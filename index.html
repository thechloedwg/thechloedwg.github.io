<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chloe DWG — Research Universe</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020207;
      font-family: Arial, Helvetica, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 30px;
      left: 35px;
      z-index: 10;

      color: white;
      font-size: 14px;
      letter-spacing: 4px;
      font-weight: 400;
    }

    .instructions {
      position: fixed;
      bottom: 28px;
      left: 35px;
      z-index: 10;

      color: rgba(255,255,255,0.55);
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div id="canvas-container"></div>

  <div class="title">
    CHLOE DWG — RESEARCH UNIVERSE
  </div>

  <div class="instructions">
    RESEARCH WORLDS · 201 UNGA SPEECHES · REFUGEE CAMPS · MORE TO COME
  </div>


  <!--
    THREE.JS
    We load the complete library from a CDN.
    Nothing needs to be downloaded.
  -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


  <script>

    // --------------------------------------------------
    // 1. CREATE THE SCENE
    // --------------------------------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x020207);


    // --------------------------------------------------
    // 2. CREATE THE CAMERA
    // --------------------------------------------------

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 20);


    // --------------------------------------------------
    // 3. CREATE THE RENDERER
    // --------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document
      .getElementById("canvas-container")
      .appendChild(renderer.domElement);


    // --------------------------------------------------
    // 4. LIGHTING
    // --------------------------------------------------

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.2
      );

    scene.add(ambientLight);


    const sun =
      new THREE.PointLight(
        0xffffff,
        2,
        100
      );

    sun.position.set(
      5,
      5,
      10
    );

    scene.add(sun);


    // --------------------------------------------------
    // 5. CREATE A PLANET FUNCTION
    // --------------------------------------------------

    function makePlanet(
      x,
      y,
      z,
      radius,
      colour
    ) {

      const geometry =
        new THREE.SphereGeometry(
          radius,
          48,
          48
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: colour,
          roughness: 0.7
        });

      const planet =
        new THREE.Mesh(
          geometry,
          material
        );

      planet.position.set(
        x,
        y,
        z
      );

      scene.add(planet);

      return planet;
    }


    // --------------------------------------------------
    // 6. CREATE OUR RESEARCH WORLDS
    // --------------------------------------------------

    const unga =
      makePlanet(
        0,
        0,
        0,
        3,
        0x3366ff
      );


    const cop =
      makePlanet(
        -7,
        3,
        -4,
        1.7,
        0x33aa66
      );


    const refugee =
      makePlanet(
        7,
        -2,
        -5,
        2,
        0xcc5555
      );


    const future =
      makePlanet(
        -4,
        -5,
        -7,
        1.2,
        0xddaa33
      );


    // --------------------------------------------------
    // 7. CREATE STARS
    // --------------------------------------------------

    const starGeometry =
      new THREE.BufferGeometry();

    const starCount = 4000;

    const positions =
      new Float32Array(
        starCount * 3
      );


    for (
      let i = 0;
      i < starCount * 3;
      i++
    ) {

      positions[i] =
        (Math.random() - 0.5) * 200;

    }


    starGeometry.setAttribute(
      "position",

      new THREE.BufferAttribute(
        positions,
        3
      )
    );


    const starMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.08
      });


    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );

    scene.add(stars);


    // --------------------------------------------------
    // 8. ANIMATION
    // --------------------------------------------------

    function animate() {

      requestAnimationFrame(
        animate
      );


      // Slowly rotate the research worlds

      unga.rotation.y += 0.002;

      cop.rotation.y += 0.0015;

      refugee.rotation.y += 0.0015;

      future.rotation.y += 0.001;


      // Slowly move the star field

      stars.rotation.y += 0.0001;


      // Render everything

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // --------------------------------------------------
    // 9. HANDLE WINDOW RESIZING
    // --------------------------------------------------

    window.addEventListener(
      "resize",

      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
