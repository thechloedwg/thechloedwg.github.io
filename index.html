<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloe DWG — Research Universe</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050509;
      font-family: Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 30px;
      left: 35px;
      z-index: 10;
      color: white;
      letter-spacing: 3px;
      font-size: 14px;
    }

    .instructions {
      position: fixed;
      bottom: 25px;
      left: 35px;
      z-index: 10;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div id="scene"></div>

  <div class="title">
    CHLOE DWG — RESEARCH UNIVERSE
  </div>

  <div class="instructions">
    DRAG TO EXPLORE · SCROLL TO ZOOM · CLICK A WORLD
  </div>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    import { OrbitControls } from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050509);


    // CAMERA

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 18);


    // RENDERER

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    document
      .getElementById("scene")
      .appendChild(renderer.domElement);


    // CONTROLS

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 40;


    // LIGHTS

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      1.5
    );

    scene.add(ambientLight);


    const pointLight = new THREE.PointLight(
      0xffffff,
      100
    );

    pointLight.position.set(5, 5, 10);

    scene.add(pointLight);


    // PLANETS

    function createPlanet(
      name,
      position,
      radius,
      colour
    ) {

      const geometry =
        new THREE.SphereGeometry(
          radius,
          64,
          64
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: colour,
          roughness: 0.7,
          metalness: 0.1
        });

      const planet =
        new THREE.Mesh(
          geometry,
          material
        );

      planet.position.set(
        position.x,
        position.y,
        position.z
      );

      planet.userData.name = name;

      scene.add(planet);

      return planet;
    }


    const unga = createPlanet(
      "UNGA 81",
      { x: 0, y: 0, z: 0 },
      3,
      0x3366ff
    );


    const cop = createPlanet(
      "COP",
      { x: -7, y: 3, z: -4 },
      1.7,
      0x33aa66
    );


    const refugee = createPlanet(
      "REFUGEE CAMPS",
      { x: 7, y: -2, z: -5 },
      2,
      0xcc5555
    );


    const future = createPlanet(
      "FUTURE PROJECT",
      { x: -4, y: -5, z: -7 },
      1.2,
      0xddaa33
    );


    // STARS

    const starGeometry =
      new THREE.BufferGeometry();

    const starCount = 3000;

    const starPositions = new Float32Array(
      starCount * 3
    );

    for (let i = 0; i < starCount * 3; i++) {

      starPositions[i] =
        (Math.random() - 0.5) * 200;

    }

    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );

    const starMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.08
      });

    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );

    scene.add(stars);


    // ANIMATION

    function animate() {

      requestAnimationFrame(animate);

      unga.rotation.y += 0.0015;
      cop.rotation.y += 0.001;
      refugee.rotation.y += 0.0012;
      future.rotation.y += 0.001;

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }

    animate();


    // RESIZE

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
