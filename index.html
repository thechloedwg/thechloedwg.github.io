/* =========================================================

/* =========================================================

/* =========================================================

const starGeometry =

for (

/* =========================================================

let pointData = [];

/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes =
        false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

        } else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(
                value.trim()
            );

            value = "";

        } else if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;
            }


            row.push(
                value.trim()
            );

            value = "";


            if (
                row.some(
                    cell =>
                        cell !== ""
                )
            ) {

                rows.push(row);
            }


            row = [];

        } else {

            value += char;
        }
    }


    if (
        value.length ||
        row.length
    ) {

        row.push(
            value.trim()
        );


        if (
            row.some(
                cell =>
                    cell !== ""
            )
        ) {

            rows.push(row);
        }
    }


    if (!rows.length) {

        return [];
    }


    const headers =
        rows[0].map(
            h =>
                h.trim().toLowerCase()
        );


    return rows
        .slice(1)
        .map(row => {

            const object = {};


            headers.forEach(
                (
                    header,
                    index
                ) => {

                    object[header] =
                        row[index] ||
                        "";
                }
            );


            return object;
        });
}


/* =========================================================
   HELPERS
   ========================================================= */

function clean(value) {

    return String(
        value || ""
    ).trim();
}


function hexToNumber(
    hex,
    fallback = 0xffffff
) {

    if (!hex) {

        return fallback;
    }


    let cleaned =
        String(hex)
            .trim()
            .replace(
                "#",
                ""
            );


    if (
        cleaned.length === 3
    ) {

        cleaned =
            cleaned[0] +
            cleaned[0] +
            cleaned[1] +
            cleaned[1] +
            cleaned[2] +
            cleaned[2];
    }


    const number =
        parseInt(
            cleaned,
            16
        );


    return Number.isNaN(number)
        ? fallback
        : number;
}


function sizeToRadius(size) {

    const n =
        Number(size) ||
        3;


    const sizes = {

        1: 0.9,

        2: 1.25,

        3: 1.7,

        4: 2.25,

        5: 3.0
    };


    return sizes[n] ||
        sizes[3];
}


/* =========================================================
   LAT / LONG
   ========================================================= */

function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );


    const theta =
        THREE.MathUtils.degToRad(
            lon + 180
        );


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    return new THREE.Vector3(
        x,
        y,
        z
    );
}


/* =========================================================
   GRID
   ========================================================= */

function createLatitudeLongitudeGrid(
    radius,
    colour,
    opacity,
    density
) {

    const group =
        new THREE.Group();


    let latitudeLines = 9;

    let longitudeLines = 18;


    if (
        density === "light"
    ) {

        latitudeLines = 5;

        longitudeLines = 10;

    } else if (
        density === "medium"
    ) {

        latitudeLines = 9;

        longitudeLines = 18;

    } else if (
        density === "dense"
    ) {

        latitudeLines = 17;

        longitudeLines = 36;
    }


    const material =
        new THREE.LineBasicMaterial({

            color: colour,

            transparent: true,

            opacity: opacity,

            depthWrite: false
        });


    /* LATITUDE */

    for (
        let i = 1;
        i < latitudeLines;
        i++
    ) {

        const lat =
            -90 +
            (
                180 /
                latitudeLines
            ) *
            i;


        const phi =
            THREE.MathUtils.degToRad(
                90 - lat
            );


        const y =
            radius *
            Math.cos(phi);


        const circleRadius =
            radius *
            Math.sin(phi);


        const points = [];


        for (
            let j = 0;
            j <= 64;
            j++
        ) {

            const theta =
                (
                    j / 64
                ) *
                Math.PI *
                2;


            points.push(
                new THREE.Vector3(
                    circleRadius *
                    Math.cos(theta),

                    y,

                    circleRadius *
                    Math.sin(theta)
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const line =
            new THREE.Line(
                geometry,
                material
            );


        group.add(
            line
        );
    }


    /* LONGITUDE */

    for (
        let i = 0;
        i < longitudeLines;
        i++
    ) {

        const theta =
            (
                i /
                longitudeLines
            ) *
            Math.PI *
            2;


        const points = [];


        for (
            let j = 0;
            j <= 64;
            j++
        ) {

            const phi =
                (
                    j / 64
                ) *
                Math.PI;


            const x =
                radius *
                Math.sin(phi) *
                Math.cos(theta);


            const y =
                radius *
                Math.cos(phi);


            const z =
                radius *
                Math.sin(phi) *
                Math.sin(theta);


            points.push(
                new THREE.Vector3(
                    x,
                    y,
                    z
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const line =
            new THREE.Line(
                geometry,
                material
            );


        group.add(
            line
        );
    }


    return group;
}


/* =========================================================
   ATMOSPHERE
   ========================================================= */

function createAtmosphere(
    radius,
    colour,
    strength
) {

    let opacity =
        0.08;


    if (
        strength === "medium"
    ) {

        opacity =
            0.12;
    }


    if (
        strength === "strong"
    ) {

        opacity =
            0.18;
    }


    const material =
        new THREE.MeshBasicMaterial({

            color: colour,

            transparent: true,

            opacity: opacity,

            side: THREE.BackSide,

            depthWrite: false
        });


    const geometry =
        new THREE.SphereGeometry(
            radius * 1.06,
            64,
            64
        );


    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   GLOW
   ========================================================= */

function createGlow(
    radius,
    colour,
    strength
) {

    let scale =
        1.10;

    let opacity =
        0.08;


    if (
        strength === "medium"
    ) {

        scale =
            1.14;

        opacity =
            0.11;

    } else if (
        strength === "strong"
    ) {

        scale =
            1.19;

        opacity =
            0.15;
    }


    const material =
        new THREE.MeshBasicMaterial({

            color: colour,

            transparent: true,

            opacity: opacity,

            side: THREE.BackSide,

            depthWrite: false
        });


    const geometry =
        new THREE.SphereGeometry(
            radius * scale,
            48,
            48
        );


    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   RINGS
   ========================================================= */

function createPlanetRings(
    radius,
    colour,
    type,
    density
) {

    const group =
        new THREE.Group();


    if (
        !type ||
        type === "none"
    ) {

        return group;
    }


    let ringCount =
        1;


    if (
        type === "double"
    ) {

        ringCount =
            2;
    }


    if (
        type === "complex"
    ) {

        ringCount =
            4;
    }


    if (
        density &&
        Number(density) > 0
    ) {

        ringCount =
            Math.max(
                ringCount,
                Number(density)
            );
    }


    for (
        let i = 0;
        i < ringCount;
        i++
    ) {

        const scale =
            1.35 +
            i * 0.12;


        const geometry =
            new THREE.RingGeometry(
                radius * scale,

                radius *
                scale +
                radius *
                0.012,

                96
            );


        const material =
            new THREE.MeshBasicMaterial({

                color: colour,

                transparent: true,

                opacity:
                    type === "complex"
                        ? 0.25
                        : 0.18,

                side:
                    THREE.DoubleSide,

                depthWrite: false
            });


        const ring =
            new THREE.Mesh(
                geometry,
                material
            );


        ring.rotation.x =
            THREE.MathUtils.degToRad(
                65 +
                i * 7
            );


        ring.rotation.z =
            i * 0.25;


        group.add(
            ring
        );
    }


    return group;
}


/* =========================================================
   SCAN LINES
   ========================================================= */

function createScanLines(
    radius,
    colour,
    intensity
) {

    const group =
        new THREE.Group();


    if (
        !intensity ||
        intensity === "none"
    ) {

        return group;
    }


    const count =
        intensity === "high"
            ? 5
            : 3;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const geometry =
            new THREE.RingGeometry(
                radius * 1.025,
                radius * 1.032,
                96
            );


        const material =
            new THREE.MeshBasicMaterial({

                color: colour,

                transparent: true,

                opacity: 0.08,

                side:
                    THREE.DoubleSide,

                depthWrite: false
            });


        const line =
            new THREE.Mesh(
                geometry,
                material
            );


        line.rotation.x =
            Math.PI / 2;


        line.userData.offset =
            i / count;


        group.add(
            line
        );
    }


    return group;
}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
    radius,
    colour,
    density
) {

    const group =
        new THREE.Group();


    if (
        !density ||
        density === "none"
    ) {

        return group;
    }


    let count =
        20;


    if (
        density === "medium"
    ) {

        count =
            40;
    }


    if (
        density === "high"
    ) {

        count =
            75;
    }


    const geometry =
        new THREE.BufferGeometry();


    const positions =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const r =
            radius *
            (
                1.18 +
                Math.random() *
                0.25
            );


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                2 *
                Math.random() -
                1
            );


        positions[i * 3] =
            r *
            Math.sin(phi) *
            Math.cos(theta);


        positions[i * 3 + 1] =
            r *
            Math.cos(phi);


        positions[i * 3 + 2] =
            r *
            Math.sin(phi) *
            Math.sin(theta);
    }


    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: colour,

            size:
                radius *
                0.018,

            transparent: true,

            opacity: 0.65,

            depthWrite: false
        });


    group.add(
        new THREE.Points(
            geometry,
            material
        )
    );


    return group;
}


/* =========================================================
   CLOUDS
   ========================================================= */

function createCloudLayer(
    radius,
    enabled,
    cloudColour,
    cloudOpacity,
    cloudDensity
) {

    if (
        enabled !== "yes" &&
        enabled !== "true" &&
        enabled !== "1"
    ) {

        return null;
    }


    const density =
        clean(
            cloudDensity
        ).toLowerCase();


    let opacity =
        Number(
            cloudOpacity
        );


    if (
        Number.isNaN(opacity)
    ) {

        opacity =
            0.4;
    }


    opacity =
        THREE.MathUtils.clamp(
            opacity,
            0,
            1
        );


    let densityMultiplier =
        1;


    if (
        density === "light"
    ) {

        densityMultiplier =
            0.65;

    } else if (
        density === "dense"
    ) {

        densityMultiplier =
            1.35;
    }


    opacity =
        THREE.MathUtils.clamp(
            opacity *
            densityMultiplier,
            0,
            1
        );


    const geometry =
        new THREE.SphereGeometry(
            radius * 1.014,
            64,
            64
        );


    const material =
        new THREE.MeshPhongMaterial({

            map:
                cloudTexture,

            color:
                hexToNumber(
                    cloudColour,
                    0xffffff
                ),

            transparent: true,

            opacity:
                opacity,

            depthWrite: false,

            shininess: 0
        });


    const clouds =
        new THREE.Mesh(
            geometry,
            material
        );


    clouds.userData.isCloudLayer =
        true;


    return clouds;
}


/* =========================================================
   CREATE PLANET
   ========================================================= */

function createProjectPlanet(
    appearance,
    position
) {

    const project =
        clean(
            appearance.project
        );


    const name =
        clean(
            appearance.name
        ) ||
        project;


    const colour =
        hexToNumber(
            appearance.colour,
            0x35d07f
        );


    const radius =
        sizeToRadius(
            appearance.size
        );


    const planetGroup =
        new THREE.Group();


    planetGroup.position.copy(
        position
    );


    planetGroup.userData = {

        type: "planet",

        project: project,

        name: name,

        radius: radius,

        colour: colour,

        targetOpacity: 1,

        spin:
            clean(
                appearance.spin
            ).toLowerCase(),

        pointStyle:
            clean(
                appearance[
                    "point style"
                ]
            ).toLowerCase(),

        appearance:
            appearance
    };


    /* =====================================================
       EARTH SURFACE
       ===================================================== */

    const surfaceOpacity =
        Number(
            appearance[
                "surface opacity"
            ]
        ) || 0.9;


    const surfaceMaterial =
        new THREE.MeshPhongMaterial({

            map:
                earthTexture,

            color:
                colour,

            transparent: true,

            opacity:
                surfaceOpacity,

            shininess: 8
        });


    const sphereGeometry =
        new THREE.SphereGeometry(
            radius,
            64,
            64
        );


    const sphere =
        new THREE.Mesh(
            sphereGeometry,
            surfaceMaterial
        );


    sphere.userData.isPlanetSurface =
        true;


    planetGroup.add(
        sphere
    );


    /* =====================================================
       COLOUR OVERLAY
       ===================================================== */

    const colourOverlayMaterial =
        new THREE.MeshBasicMaterial({

            color:
                colour,

            transparent: true,

            opacity:
                appearance.surface ===
                "Earth"
                    ? 0.18
                    : 0.28,

            depthWrite: false
        });


    const colourOverlay =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                radius * 1.003,
                64,
                64
            ),

            colourOverlayMaterial
        );


    planetGroup.add(
        colourOverlay
    );


    /* =====================================================
       GRID
       ===================================================== */

    const grid =
        createLatitudeLongitudeGrid(

            radius * 1.008,

            colour,

            Number(
                appearance[
                    "grid opacity"
                ]
            ) || 0.35,

            clean(
                appearance.grid
            ).toLowerCase()
        );


    planetGroup.add(
        grid
    );


    /* =====================================================
       ATMOSPHERE
       ===================================================== */

    const atmosphere =
        clean(
            appearance.atmosphere
        ).toLowerCase();


    if (
        atmosphere &&
        atmosphere !== "none"
    ) {

        planetGroup.add(

            createAtmosphere(

                radius,

                colour,

                clean(
                    appearance.glow
                ).toLowerCase()
            )
        );
    }


    /* =====================================================
       GLOW
       ===================================================== */

    const glowStrength =
        clean(
            appearance.glow
        ).toLowerCase();


    if (
        glowStrength &&
        glowStrength !== "none"
    ) {

        planetGroup.add(

            createGlow(

                radius,

                colour,

                glowStrength
            )
        );
    }


    /* =====================================================
       CLOUDS
       ===================================================== */

    const clouds =
        createCloudLayer(

            radius,

            "yes",

            appearance[
                "cloud colour"
            ],

            appearance[
                "cloud opacity"
            ],

            appearance[
                "cloud density"
            ]
        );


    if (clouds) {

        planetGroup.add(
            clouds
        );
    }


    /* =====================================================
       RINGS
       ===================================================== */

    const rings =
        createPlanetRings(

            radius,

            hexToNumber(

                appearance[
                    "ring colour"
                ],

                colour
            ),

            clean(
                appearance.rings
            ).toLowerCase(),

            appearance[
                "ring density"
            ]
        );


    planetGroup.add(
        rings
    );


    /* =====================================================
       SCAN LINES
       ===================================================== */

    const scanLines =
        createScanLines(

            radius,

            colour,

            clean(
                appearance[
                    "scan lines"
                ]
            ).toLowerCase()
        );


    planetGroup.add(
        scanLines
    );


    /* =====================================================
       PARTICLES
       ===================================================== */

    const particles =
        createParticles(

            radius,

            colour,

            clean(
                appearance.particles
            ).toLowerCase()
        );


    planetGroup.add(
        particles
    );


    /* =====================================================
       RESEARCH POINT GROUP
       ===================================================== */

    const pointsGroup =
        new THREE.Group();


    pointsGroup.name =
        "Research Points";


    planetGroup.add(
        pointsGroup
    );


    /* =====================================================
       ADD TO SCENE
       ===================================================== */

    scene.add(
        planetGroup
    );


    planets.push(
        planetGroup
    );


    projectObjects[
        project
    ] =
        planetGroup;


    return planetGroup;
}


/* =========================================================
   RESEARCH POINT
   ========================================================= */

function createResearchPin(
    row,
    radius,
    colour,
    pointStyle
) {

    const group =
        new THREE.Group();


    group.userData = {

        type: "research",

        country:
            clean(
                row.country
            ),

        title:
            clean(
                row.title
            ),

        url:
            clean(
                row.url
            ),

        lat:
            Number(row.lat),

        lon:
            Number(row.long),

        pulse:
            pointStyle === "pulse"
                ? Math.random() *
                  Math.PI *
                  2
                : undefined
    };


    const normal =
        latLonToVector3(

            Number(row.lat),

            Number(row.long),

            1

        ).normalize();


    /*
       The marker group is fixed permanently
       to the surface.

       We NEVER scale this parent.
    */

    group.position.copy(

        normal.clone()
            .multiplyScalar(
                radius * 1.028
            )
    );


    /* =====================================================
       HOLOGRAPHIC RING
       ===================================================== */

    const ringGeometry =
        new THREE.RingGeometry(

            radius * 0.055,

            radius * 0.075,

            48
        );


    const ringMaterial =
        new THREE.MeshBasicMaterial({

            color:
                colour,

            transparent: true,

            opacity: 0.72,

            side:
                THREE.DoubleSide,

            depthWrite: false
        });


    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );


    ring.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            0,
            1
        ),

        normal
    );


    ring.userData.isResearchMarker =
        true;


    group.add(
        ring
    );


    /* =====================================================
       INVISIBLE HIT AREA
       ===================================================== */

    /*
       This is deliberately much larger than
       the visible marker.

       It makes clicking a country easy without
       visually changing the design.
    */

    const hitGeometry =
        new THREE.SphereGeometry(
            radius * 0.14,
            16,
            16
        );


    const hitMaterial =
        new THREE.MeshBasicMaterial({

            transparent: true,

            opacity: 0,

            depthWrite: false
        });


    const hit =
        new THREE.Mesh(
            hitGeometry,
            hitMaterial
        );


    hit.userData.isResearchHit =
        true;


    group.add(
        hit
    );


    /* =====================================================
       CROSSHAIR
       ===================================================== */

    if (
        pointStyle ===
        "crosshair"
    ) {

        const size =
            radius * 0.11;


        const material =
            new THREE.LineBasicMaterial({

                color:
                    colour,

                transparent: true,

                opacity: 0.8,

                depthWrite: false
            });


        const points = [

            new THREE.Vector3(
                -size,
                0,
                0
            ),

            new THREE.Vector3(
                size,
                0,
                0
            ),

            new THREE.Vector3(
                0,
                -size,
                0
            ),

            new THREE.Vector3(
                0,
                size,
                0
            )
        ];


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const crosshair =
            new THREE.LineSegments(
                geometry,
                material
            );


        crosshair.quaternion.copy(
            ring.quaternion
        );


        crosshair.userData.isResearchMarker =
            true;


        group.add(
            crosshair
        );
    }


    return group;
}


/* =========================================================
   ATTACH POINTS
   ========================================================= */

function attachResearchPoints() {

    pointData.forEach(
        row => {

            const project =
                clean(
                    row.project
                );


            const planet =
                projectObjects[
                    project
                ];


            if (!planet) {

                return;
            }


            const pointsGroup =
                planet.children.find(

                    child =>
                        child.name ===
                        "Research Points"
                );


            if (!pointsGroup) {

                return;
            }


            const radius =
                planet.userData.radius;


            const colour =
                planet.userData.colour;


            const pointStyle =
                planet.userData.pointStyle;


            const pin =
                createResearchPin(

                    row,

                    radius,

                    colour,

                    pointStyle
                );


            pointsGroup.add(
                pin
            );
        }
    );
}


/* =========================================================
   BUILD GALAXY
   ========================================================= */

function buildGalaxy() {

    const projectsWithPoints =
        new Set();


    pointData.forEach(
        row => {

            const project =
                clean(
                    row.project
                );


            if (project) {

                projectsWithPoints.add(
                    project
                );
            }
        }
    );


    /*
       A planet only exists when its project
       has at least one research point.
    */

    const activeAppearances =
        appearanceData.filter(

            appearance =>
                projectsWithPoints.has(

                    clean(
                        appearance.project
                    )
                )
        );


    const positions = [

        new THREE.Vector3(
            -6.2,
            1.7,
            -1
        ),

        new THREE.Vector3(
            0.2,
            -1.3,
            -3
        ),

        new THREE.Vector3(
            6.0,
            1.0,
            -1.5
        ),

        new THREE.Vector3(
            -2.7,
            -3.2,
            -5
        ),

        new THREE.Vector3(
            3.1,
            3.4,
            -5.5
        ),

        new THREE.Vector3(
            8,
            -2,
            -7
        ),

        new THREE.Vector3(
            -8,
            -2,
            -6
        )
    ];


    activeAppearances.forEach(

        (
            appearance,
            index
        ) => {

            const position =
                positions[
                    index %
                    positions.length
                ].clone();


            createProjectPlanet(

                appearance,

                position
            );
        }
    );


    attachResearchPoints();
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCameraLook() {

    camera.lookAt(
        cameraLookTarget
    );
}


function startCameraAnimation(
    targetPosition,
    endLookTarget,
    duration = 1600
) {

    cameraAnimationStart =
        performance.now();


    cameraStartPosition.copy(
        camera.position
    );


    cameraTargetPosition.copy(
        targetPosition
    );


    cameraStartLookTarget.copy(
        cameraLookTarget
    );


    cameraEndLookTarget.copy(
        endLookTarget
    );


    cameraAnimating =
        true;


    cameraAnimationDuration =
        duration;
}


function updateCameraAnimation(
    now
) {

    if (!cameraAnimating) {

        return;
    }


    const elapsed =
        now -
        cameraAnimationStart;


    const t =
        Math.min(

            elapsed /
            cameraAnimationDuration,

            1
        );


    const eased =
        1 -
        Math.pow(
            1 - t,
            3
        );


    camera.position.lerpVectors(

        cameraStartPosition,

        cameraTargetPosition,

        eased
    );


    cameraLookTarget.lerpVectors(

        cameraStartLookTarget,

        cameraEndLookTarget,

        eased
    );


    updateCameraLook();


    if (t >= 1) {

        cameraAnimating =
            false;
    }
}


/* =========================================================
   ENTER PLANET
   ========================================================= */

function enterPlanet(
    planet
) {

    if (
        planetMode ||
        cameraAnimating
    ) {

        return;
    }


    selectedPlanet =
        planet;


    selectedProject =
        planet.userData.project;


    planetMode =
        true;


    document
        .getElementById(
            "backButton"
        )
        .classList.add(
            "visible"
        );


    document
        .getElementById(
            "instructions"
        )
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A LOCATION";


    hoveredPlanet =
        null;


    document
        .getElementById(
            "planetLabel"
        )
        .classList.remove(
            "visible"
        );


    showProjectDashboard(
        planet.userData.appearance
    );


    /*
       Hide every other research world.

       This means the selected world becomes
       the entire focus of the screen.
    */

    planets.forEach(
        other => {

            if (
                other === planet
            ) {

                other.visible =
                    true;

                return;
            }


            other.visible =
                false;
        }
    );


    /*
       Find the planet's actual world position.
    */

    const worldPosition =
        new THREE.Vector3();


    planet.getWorldPosition(
        worldPosition
    );


    /*
       Put the camera on the side of the planet
       from which it is currently viewing.

       This avoids the old "fly to the wrong side
       of the planet" problem.
    */

    const cameraDirection =
        camera.position
            .clone()
            .sub(
                worldPosition
            );


    if (
        cameraDirection.lengthSq() <
        0.001
    ) {

        cameraDirection.set(
            0,
            0,
            1
        );

    } else {

        cameraDirection.normalize();
    }


    const distance =
        Math.max(

            planet.userData.radius *
            3.8,

            7
        );


    const targetCameraPosition =
        worldPosition
            .clone()
            .add(

                cameraDirection
                    .multiplyScalar(
                        distance
                    )
            );


    startCameraAnimation(

        targetCameraPosition,

        worldPosition,

        1600
    );
}


/* =========================================================
   EXIT PLANET
   ========================================================= */

function exitPlanet() {

    if (!planetMode) {

        return;
    }


    planetMode =
        false;


    selectedProject =
        null;


    selectedPlanet =
        null;


    document
        .getElementById(
            "backButton"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "instructions"
        )
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


    planets.forEach(
        planet => {

            planet.visible =
                true;
        }
    );


    hideResearchCard();

    hideProjectDashboard();


    startCameraAnimation(

        new THREE.Vector3(
            0,
            2,
            20
        ),

        new THREE.Vector3(
            0,
            0,
            0
        ),

        1200
    );
}

/* =========================================================
   PLANET LABEL
   ========================================================= */

function updatePlanetLabel() {

    const label =
        document.getElementById(
            "planetLabel"
        );


    if (
        !hoveredPlanet ||
        planetMode
    ) {

        label.classList.remove(
            "visible"
        );

        return;
    }


    const worldPosition =
        new THREE.Vector3();


    hoveredPlanet.getWorldPosition(
        worldPosition
    );


    const projected =
        worldPosition
            .clone()
            .project(
                camera
            );


    const x =
        (
            projected.x *
            0.5 +
            0.5
        ) *
        window.innerWidth;


    const y =
        (
            -projected.y *
            0.5 +
            0.5
        ) *
        window.innerHeight;


    label.style.left =
        `${x}px`;


    label.style.top =
        `${y - 20}px`;


    label.textContent =
        hoveredPlanet.userData.name;


    label.classList.add(
        "visible"
    );
}


/* =========================================================
   CAMERA ORBIT
   ========================================================= */

let galaxyYaw =
    0;


let galaxyPitch =
    0.10;


let galaxyDistance =
    20;


let planetYaw =
    0;


let planetPitch =
    0;


let planetDistance =
    8;


function updateGalaxyCamera() {

    const target =
        new THREE.Vector3(
            0,
            0,
            0
        );


    const x =
        galaxyDistance *
        Math.cos(
            galaxyPitch
        ) *
        Math.sin(
            galaxyYaw
        );


    const y =
        galaxyDistance *
        Math.sin(
            galaxyPitch
        );


    const z =
        galaxyDistance *
        Math.cos(
            galaxyPitch
        ) *
        Math.cos(
            galaxyYaw
        );


    camera.position.set(
        x,
        y,
        z
    );


    cameraLookTarget.copy(
        target
    );


    updateCameraLook();
}


function updatePlanetCamera() {

    if (!selectedPlanet) {

        return;
    }


    const planetPosition =
        new THREE.Vector3();


    selectedPlanet.getWorldPosition(
        planetPosition
    );


    const x =
        planetDistance *
        Math.cos(
            planetPitch
        ) *
        Math.sin(
            planetYaw
        );


    const y =
        planetDistance *
        Math.sin(
            planetPitch
        );


    const z =
        planetDistance *
        Math.cos(
            planetPitch
        ) *
        Math.cos(
            planetYaw
        );


    camera.position.copy(
        planetPosition
    );


    camera.position.x +=
        x;


    camera.position.y +=
        y;


    camera.position.z +=
        z;


    cameraLookTarget.copy(
        planetPosition
    );


    updateCameraLook();
}


/* =========================================================
   POINTER STATE
   ========================================================= */

let isPointerDown =
    false;


let isDragging =
    false;


let pointerStartX =
    0;


let pointerStartY =
    0;


let previousPointerX =
    0;


let previousPointerY =
    0;


const DRAG_THRESHOLD =
    6;


const DRAG_SENSITIVITY =
    0.0035;


/* =========================================================
   POINTER DOWN
   ========================================================= */

renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        if (
            cameraAnimating
        ) {

            return;
        }


        isPointerDown =
            true;


        isDragging =
            false;


        didDrag =
            false;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        previousPointerX =
            event.clientX;


        previousPointerY =
            event.clientY;


        /*
           Reconstruct galaxy orbit from the
           current camera position.
        */

        if (!planetMode) {

            const x =
                camera.position.x;


            const y =
                camera.position.y;


            const z =
                camera.position.z;


            galaxyDistance =
                Math.sqrt(
                    x * x +
                    y * y +
                    z * z
                );


            galaxyYaw =
                Math.atan2(
                    x,
                    z
                );


            galaxyPitch =
                Math.asin(
                    y /
                    galaxyDistance
                );

        } else {

            const planetPosition =
                new THREE.Vector3();


            selectedPlanet.getWorldPosition(
                planetPosition
            );


            const offset =
                camera.position
                    .clone()
                    .sub(
                        planetPosition
                    );


            planetDistance =
                offset.length();


            planetYaw =
                Math.atan2(
                    offset.x,
                    offset.z
                );


            planetPitch =
                Math.asin(
                    offset.y /
                    planetDistance
                );
        }


        renderer.domElement.setPointerCapture(
            event.pointerId
        );


        document.body.classList.add(
            "dragging"
        );
    }
);


/* =========================================================
   POINTER MOVE
   ========================================================= */

renderer.domElement.addEventListener(

    "pointermove",

    event => {

        /*
           Hover only exists in galaxy mode.
        */

        if (!isPointerDown) {

            if (!planetMode) {

                mouse.x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) *
                    2 -
                    1;


                mouse.y =
                    -(
                        event.clientY /
                        window.innerHeight
                    ) *
                    2 +
                    1;


                raycaster.setFromCamera(
                    mouse,
                    camera
                );


                const intersects =
                    raycaster.intersectObjects(
                        planets,
                        true
                    );


                hoveredPlanet =
                    null;


                for (
                    let i = 0;
                    i < intersects.length;
                    i++
                ) {

                    let object =
                        intersects[i].object;


                    while (
                        object &&
                        !object.userData.project
                    ) {

                        object =
                            object.parent;
                    }


                    if (
                        object &&
                        object.userData.type ===
                        "planet"
                    ) {

                        hoveredPlanet =
                            object;

                        break;
                    }
                }


                updatePlanetLabel();
            }


            return;
        }


        /*
           Drag detection.
        */

        const dx =
            event.clientX -
            pointerStartX;


        const dy =
            event.clientY -
            pointerStartY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            !isDragging &&
            distance >
            DRAG_THRESHOLD
        ) {

            isDragging =
                true;

            didDrag =
                true;
        }


        if (!isDragging) {

            return;
        }


        const movementX =
            event.clientX -
            previousPointerX;


        const movementY =
            event.clientY -
            previousPointerY;


        previousPointerX =
            event.clientX;


        previousPointerY =
            event.clientY;


        /*
           GALAXY:
           move the camera around the universe.
        */

        if (!planetMode) {

            galaxyYaw -=
                movementX *
                DRAG_SENSITIVITY;


            galaxyPitch -=
                movementY *
                DRAG_SENSITIVITY;


            galaxyPitch =
                THREE.MathUtils.clamp(

                    galaxyPitch,

                    -1.35,

                    1.35
                );


            updateGalaxyCamera();


            return;
        }


        /*
           PLANET:
           orbit the camera around the selected
           research planet.
        */

        planetYaw -=
            movementX *
            DRAG_SENSITIVITY;


        planetPitch -=
            movementY *
            DRAG_SENSITIVITY;


        planetPitch =
            THREE.MathUtils.clamp(

                planetPitch,

                -1.35,

                1.35
            );


        updatePlanetCamera();
    }
);


/* =========================================================
   POINTER FINISH
   ========================================================= */

function finishPointer(
    event
) {

    isPointerDown =
        false;


    isDragging =
        false;


    document.body.classList.remove(
        "dragging"
    );


    try {

        renderer.domElement.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {

        /* ignore */
    }
}


renderer.domElement.addEventListener(

    "pointerup",

    event => {

        finishPointer(
            event
        );


        if (didDrag) {

            didDrag =
                false;

            return;
        }


        if (
            cameraAnimating
        ) {

            return;
        }


        handleClick(
            event
        );
    }
);


renderer.domElement.addEventListener(

    "pointercancel",

    event => {

        finishPointer(
            event
        );


        didDrag =
            false;
    }
);


/* =========================================================
   CLICK
   ========================================================= */

function handleClick(
    event
) {

    mouse.x =
        (
            event.clientX /
            window.innerWidth
        ) *
        2 -
        1;


    mouse.y =
        -(
            event.clientY /
            window.innerHeight
        ) *
        2 +
        1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    /* =====================================================
       GALAXY
       ===================================================== */

    if (!planetMode) {

        const intersects =
            raycaster.intersectObjects(
                planets,
                true
            );


        for (
            let i = 0;
            i < intersects.length;
            i++
        ) {

            let object =
                intersects[i].object;


            while (
                object &&
                object.userData.type !==
                "planet"
            ) {

                object =
                    object.parent;
            }


            if (
                object &&
                object.userData.type ===
                "planet"
            ) {

                enterPlanet(
                    object
                );

                return;
            }
        }


        return;
    }


    /* =====================================================
       PLANET
       ===================================================== */

    if (
        !selectedPlanet
    ) {

        return;
    }


    const pointsGroup =
        selectedPlanet.children.find(

            child =>
                child.name ===
                "Research Points"
        );


    if (!pointsGroup) {

        return;
    }


    const intersects =
        raycaster.intersectObjects(

            pointsGroup.children,

            true
        );


    for (
        let i = 0;
        i < intersects.length;
        i++
    ) {

        let object =
            intersects[i].object;


        while (
            object &&
            object.userData.type !==
            "research"
        ) {

            object =
                object.parent;
        }


        if (
            object &&
            object.userData.type ===
            "research"
        ) {

            showResearchCard(
                object.userData
            );


            return;
        }
    }
}


/* =========================================================
   ZOOM
   ========================================================= */

renderer.domElement.addEventListener(

    "wheel",

    event => {

        event.preventDefault();


        if (
            cameraAnimating
        ) {

            return;
        }


        /*
           GALAXY ZOOM
        */

        if (!planetMode) {

            galaxyDistance +=
                event.deltaY *
                0.012;


            galaxyDistance =
                THREE.MathUtils.clamp(

                    galaxyDistance,

                    8,

                    45
                );


            updateGalaxyCamera();


        } else {

            /*
               PLANET ZOOM
            */

            planetDistance +=
                event.deltaY *
                0.008;


            planetDistance =
                THREE.MathUtils.clamp(

                    planetDistance,

                    3.5,

                    15
                );


            updatePlanetCamera();
        }

    },

    {
        passive: false
    }
);


/* =========================================================
   BACK BUTTON
   ========================================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(

        "click",

        event => {

            event.stopPropagation();

            exitPlanet();
        }
    );


/* =========================================================
   ANIMATION
   ========================================================= */

let lastTime =
    performance.now();


function animate(now) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            (
                now -
                lastTime
            ) /
            1000,

            0.05
        );


    lastTime =
        now;


    /* =====================================================
       CAMERA
       ===================================================== */

    updateCameraAnimation(
        now
    );


    /* =====================================================
       AUTOMATIC PLANET ROTATION
       ===================================================== */

    if (
        !isPointerDown &&
        !isDragging &&
        !cameraAnimating
    ) {

        planets.forEach(
            planet => {

                let speed =
                    0.05;


                if (
                    planet.userData.spin ===
                    "slow"
                ) {

                    speed =
                        0.025;

                } else if (
                    planet.userData.spin ===
                    "fast"
                ) {

                    speed =
                        0.09;
                }


                /*
                   In planet mode the camera moves
                   around the selected planet instead.
                */

                if (
                    planetMode
                ) {

                    return;
                }


                planet.rotation.y +=
                    speed *
                    delta;
            }
        );
    }


    /* =====================================================
       CLOUD ROTATION
       ===================================================== */

    planets.forEach(
        planet => {

            planet.children.forEach(
                child => {

                    if (
                        child.userData &&
                        child.userData.isCloudLayer
                    ) {

                        child.rotation.y +=
                            0.012 *
                            delta;
                    }
                }
            );
        }
    );


    /* =====================================================
       HOLOGRAPHIC POINT PULSES
       ===================================================== */

    planets.forEach(
        planet => {

            const pointsGroup =
                planet.children.find(

                    child =>
                        child.name ===
                        "Research Points"
                );


            if (!pointsGroup) {

                return;
            }


            pointsGroup.children.forEach(
                pin => {

                    if (
                        pin.userData &&
                        pin.userData.pulse !==
                        undefined
                    ) {

                        pin.userData.pulse +=
                            delta *
                            3;


                        const scale =
                            1 +
                            Math.sin(
                                pin.userData.pulse
                            ) *
                            0.25;


                        /*
                           ONLY visible marker
                           geometry is scaled.

                           The parent group remains fixed,
                           and the invisible hit area remains
                           fixed.
                        */

                        pin.children.forEach(
                            child => {

                                if (
                                    child.userData &&
                                    child.userData.isResearchHit
                                ) {

                                    return;
                                }


                                if (
                                    child.userData &&
                                    child.userData.isResearchMarker
                                ) {

                                    child.scale.set(

                                        scale,

                                        scale,

                                        scale
                                    );
                                }
                            }
                        );
                    }
                }
            );
        }
    );


    /* =====================================================
       SCAN LINES
       ===================================================== */

    planets.forEach(
        planet => {

            planet.children.forEach(
                child => {

                    if (
                        child.children &&
                        child.children.length &&
                        child.name !==
                        "Research Points"
                    ) {

                        child.children.forEach(
                            object => {

                                if (
                                    object.userData &&
                                    object.userData.offset !==
                                    undefined
                                ) {

                                    object.rotation.y +=
                                        delta *
                                        0.15;
                                }
                            }
                        );
                    }
                }
            );
        }
    );


    /* =====================================================
       RENDER
       ===================================================== */

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );
    }
);


/* =========================================================
   LOAD GOOGLE SHEETS
   ========================================================= */

async function loadData() {

    try {

        const [
            pointsResponse,
            appearanceResponse
        ] =
            await Promise.all([

                fetch(
                    POINTS_CSV +
                    "&cache=" +
                    Date.now()
                ),

                fetch(
                    APPEARANCE_CSV +
                    "&cache=" +
                    Date.now()
                )
            ]);


        if (
            !pointsResponse.ok ||
            !appearanceResponse.ok
        ) {

            throw new Error(
                "Could not load Google Sheets."
            );
        }


        const pointsText =
            await pointsResponse.text();


        const appearanceText =
            await appearanceResponse.text();


        pointData =
            parseCSV(
                pointsText
            );


        appearanceData =
            parseCSV(
                appearanceText
            );


        console.log(
            "Research points:",
            pointData
        );


        console.log(
            "Planet appearances:",
            appearanceData
        );


        buildGalaxy();


        updateGalaxyCamera();


        document
            .getElementById(
                "loading"
            )
            .classList.add(
                "hidden"
            );


    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "loading"
            )
            .textContent =
            "Could not load research universe";
    }
}


/* =========================================================
   START
   ========================================================= */

loadData();


animate(
    performance.now()
);

</script>
