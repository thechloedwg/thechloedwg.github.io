/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(
    text
) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;
        }


        if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

            continue;
        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(
                value
            );

            value = "";

            continue;
        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;
            }


            row.push(
                value
            );

            value = "";


            if (
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            ) {

                rows.push(
                    row
                );
            }


            row = [];

            continue;
        }


        value +=
            char;
    }


    row.push(
        value
    );


    if (
        row.some(
            cell =>
                cell.trim() !== ""
        )
    ) {

        rows.push(
            row
        );
    }


    if (
        rows.length === 0
    ) {

        return [];
    }


    const headers =
        rows[0].map(
            header =>
                header
                    .trim()
                    .toLowerCase()
    );


    return rows
        .slice(1)
        .map(
            values => {

                const object = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {

                        object[header] =
                            (
                                values[index] ||
                                ""
                            ).trim();
                    }
                );


                return object;
            }
        );
}


/* =========================================================

function clean(
    value
) {

    return String(
        value ?? ""
    ).trim();
}


function hexToNumber(
    hex,
    fallback = 0xffffff
) {

    const value =
        clean(
            hex
        ).replace(
            "#",
            ""
        );


    if (
        /^[0-9a-fA-F]{6}$/.test(
            value
        )
    ) {

        return parseInt(
            value,
            16
        );
    }


    if (
        /^[0-9a-fA-F]{3}$/.test(
            value
        )
    ) {

        return parseInt(
            value
                .split("")
                .map(
                    char =>
                        char + char
                )
                .join(""),
            16
        );
    }


    return fallback;
}


function sizeToRadius(
    size
) {

    const value =
        Number(
            size
        );


    if (value === 1) return 0.9;

    if (value === 2) return 1.25;

    if (value === 3) return 1.7;

    if (value === 4) return 2.25;

    if (value === 5) return 3.0;


    return 1.7;
}


/* =========================================================

function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );


    const theta =
        THREE.MathUtils.degToRad(
            lon + 180
        );


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    return new THREE.Vector3(
        x,
        y,
        z
    );
}


/* =========================================================

function createLatitudeLongitudeGrid(
    radius,

    opacity,
    density
) {

    const group =
        new THREE.Group();


    let latitudeCount = 9;

    let longitudeCount = 18;


    if (
        density === "light"
    ) {

        latitudeCount = 5;
        longitudeCount = 10;

    } else if (
        density === "dense"
    ) {

        latitudeCount = 17;
        longitudeCount = 36;
    }


    const material =
        new THREE.LineBasicMaterial({
            color: colour,
            transparent: true,
            opacity: opacity * 0.72,
            depthWrite: false,
            depthTest: true
        });


    for (
        let i = 1;
        i < latitudeCount;
        i++
    ) {

        const latitude =
            -90 +
            (
                i /
                latitudeCount
            ) *
            180;


        const points = [];


        for (
            let j = 0;
            j <= 64;
            j++
        ) {

            const longitude =
                (
                    j /
                    64
                ) *
                360 -
                180;


            points.push(
                latLonToVector3(
                    latitude,
                    longitude,
                    radius * 1.006
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        group.add(
            new THREE.Line(
                geometry,
                material
            )
        );
    }


    for (
        let i = 0;
        i < longitudeCount;
        i++
    ) {

        const longitude =
            (
                i /
                longitudeCount
            ) *
            360;


        const points = [];


        for (
            let j = 0;
            j <= 64;
            j++
        ) {

            const latitude =
                -90 +
                (
                    j /
                    64
                ) *
                180;


            points.push(
                latLonToVector3(
                    latitude,
                    longitude,
                    radius * 1.006
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        group.add(
            new THREE.Line(
                geometry,
                material
            )
        );
    }


    return group;
}


/* =========================================================
   3D RESEARCH MAP GRID
   ========================================================= */

function createResearchMapGrid(
    radius,
    colour,
    intensity = 1
) {

    const group =
        new THREE.Group();


    const lineOpacity =
        0.12 *
        intensity;


    const ringScales = [
        1.018,
        1.045,
        1.075
    ];


    ringScales.forEach(
        scale => {

            const geometry =
                new THREE.RingGeometry(
                    radius * scale,
                    radius * scale + 0.004,
                    96
                );


            const material =
                new THREE.MeshBasicMaterial({
                    color: colour,
                    transparent: true,
                    opacity: lineOpacity,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });


            const ring =
                new THREE.Mesh(
                    geometry,
                    material
                );


            ring.rotation.x =
                Math.PI / 2;


            group.add(
                ring
            );
        }
    );


    const latitudeGuides = [
        35,
        -35
    ];


    latitudeGuides.forEach(
        latitude => {

            const points = [];


            for (
                let i = 0;
                i <= 96;
                i++
            ) {

                const longitude =
                    -180 +
                    (
                        i /
                        96
                    ) *
                    360;


                points.push(
                    latLonToVector3(
                        latitude,
                        longitude,
                        radius * 1.021
                    )
                );
            }


            const geometry =
                new THREE.BufferGeometry()
                    .setFromPoints(
                        points
                    );


            const material =
                new THREE.LineBasicMaterial({
                    color: colour,
                    transparent: true,
                    opacity: lineOpacity,
                    depthWrite: false
                });


            group.add(
                new THREE.Line(
                    geometry,
                    material
                )
            );
        }
    );


    const greatCircleAngles = [
        0,
        Math.PI / 2,
        Math.PI,
        3 * Math.PI / 2
    ];


    greatCircleAngles.forEach(
        angle => {

            const points = [];


            for (
                let i = 0;
                i <= 96;
                i++
            ) {

                const latitude =
                    -90 +
                    (
                        i /
                        96
                    ) *
                    180;


                const longitude =
                    THREE.MathUtils.radToDeg(
                        angle
                    );


                points.push(
                    latLonToVector3(
                        latitude,
                        longitude,
                        radius * 1.022
                    )
                );
            }


            const geometry =
                new THREE.BufferGeometry()
                    .setFromPoints(
                        points
                    );


            const material =
                new THREE.LineBasicMaterial({
                    color: colour,
                    transparent: true,
                    opacity: lineOpacity,
                    depthWrite: false
                });


            group.add(
                new THREE.Line(
                    geometry,
                    material
                )
            );
        }
    );


    const tickMaterial =
        new THREE.LineBasicMaterial({
            color: colour,
            transparent: true,
            opacity: lineOpacity * 1.8,
            depthWrite: false
        });


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const angle =
            (
                i /
                12
            ) *
            Math.PI *
            2;


        const inner =
            latLonToVector3(
                0,
                THREE.MathUtils.radToDeg(angle),
                radius * 1.026
            );


        const outer =
            latLonToVector3(
                0,
                THREE.MathUtils.radToDeg(angle),
                radius * 1.075
            );


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints([
                    inner,
                    outer
                ]);


        group.add(
            new THREE.Line(
                geometry,
                tickMaterial
            )
        );
    }


    group.name =
        "3D Research Grid";


    group.renderOrder =
        8;


    return group;
}


/* =========================================================
   ATMOSPHERE
   ========================================================= */

function createAtmosphere(
    radius,
    colour,
    strength
) {

    let opacity = 0.08;


    if (
        strength === "medium"
    ) {

        opacity = 0.12;

    } else if (
        strength === "strong"
    ) {

        opacity = 0.18;
    }


    const geometry =
        new THREE.SphereGeometry(
            radius * 1.06,
            48,
            48
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity: opacity,
            side: THREE.BackSide,
            depthWrite: false
        });


    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   GLOW
   ========================================================= */

function createGlow(
    radius,
    colour,
    strength
) {

    let scale = 1.10;

    let opacity = 0.08;


    if (
        strength === "medium"
    ) {

        scale = 1.14;
        opacity = 0.11;

    } else if (
        strength === "strong"
    ) {

        scale = 1.19;
        opacity = 0.15;
    }


    const geometry =
        new THREE.SphereGeometry(
            radius * scale,
            32,
            32
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity: opacity,
            side: THREE.BackSide,
            depthWrite: false
        });


    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   PLANET RINGS
   ========================================================= */

function createPlanetRings(
    radius,
    colour,
    type,
    density
) {

    const group =
        new THREE.Group();


    const ringType =
        clean(
            type
        ).toLowerCase();


    if (
        ringType === "none" ||
        !ringType
    ) {

        return group;
    }


    let count = 2;


    if (
        ringType === "complex"
    ) {

        count = 4;
    }


    const numericDensity =
        Number(
            density
        );


    if (
        numericDensity &&
        numericDensity > count
    ) {

        count =
            Math.min(
                numericDensity,
                8
            );
    }


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const geometry =
            new THREE.RingGeometry(
                radius *
                (
                    1.35 +
                    i * 0.12
                ),
                radius *
                (
                    1.355 +
                    i * 0.12
                ),
                96
            );


        const material =
            new THREE.MeshBasicMaterial({
                color: colour,
                transparent: true,
                opacity:
                    ringType === "complex"
                        ? 0.25
                        : 0.18,
                side: THREE.DoubleSide,
                depthWrite: false
            });


        const ring =
            new THREE.Mesh(
                geometry,
                material
            );


        ring.rotation.x =
            Math.PI / 2;


        group.add(
            ring
        );
    }


    return group;
}


/* =========================================================
   SCAN LINES
   ========================================================= */

function createScanLines(
    radius,
    colour,
    intensity
) {

    const group =
        new THREE.Group();


    const value =
        clean(
            intensity
        ).toLowerCase();


    if (
        value === "none" ||
        !value
    ) {

        return group;
    }


    const count =
        value === "high"
            ? 5
            : 3;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const geometry =
            new THREE.RingGeometry(
                radius * 1.025,
                radius * 1.032,
                96
            );


        const material =
            new THREE.MeshBasicMaterial({
                color: colour,
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide,
                depthWrite: false
            });


        const ring =
            new THREE.Mesh(
                geometry,
                material
            );


        ring.rotation.x =
            Math.PI / 2;


        ring.rotation.z =
            (
                i /
                count
            ) *
            Math.PI;


        group.add(
            ring
        );
    }


    return group;
}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
    radius,
    colour,
    density
) {

    const group =
        new THREE.Group();


    const value =
        clean(
            density
        ).toLowerCase();


    if (
        value === "none" ||
        !value
    ) {

        return group;
    }


    let count = 20;


    if (
        value === "medium"
    ) {

        count = 40;

    } else if (
        value === "high"
    ) {

        count = 75;
    }


    const positions = [];


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const r =
            radius *
            (
                1.18 +
                Math.random() *
                0.25
            );


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                2 *
                Math.random() -
                1
            );


        positions.push(
            r *
            Math.sin(phi) *
            Math.cos(theta)
        );


        positions.push(
            r *
            Math.sin(phi) *
            Math.sin(theta)
        );


        positions.push(
            r *
            Math.cos(phi)
        );
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({
            color: colour,
            size: 0.025,
            transparent: true,
            opacity: 0.55,
            depthWrite: false
        });


    group.add(
        new THREE.Points(
            geometry,
            material
        )
    );


    return group;
}


/* =========================================================
   CLOUD LAYER
   ========================================================= */

function createCloudLayer(
    radius,
    enabled,
    cloudColour,
    cloudOpacity,
    cloudDensity
) {

    const value =
        clean(
            enabled
        ).toLowerCase();


    if (
        !(
            value === "yes" ||
            value === "true" ||
            value === "1"
        )
    ) {

        return null;
    }


    let opacity =
        Number(
            cloudOpacity
        );


    if (
        !Number.isFinite(
            opacity
        )
    ) {

        opacity = 0.35;
    }


    const density =
        clean(
            cloudDensity
        ).toLowerCase();


    if (
        density === "light"
    ) {

        opacity *= 0.65;

    } else if (
        density === "dense"
    ) {

        opacity *= 1.35;
    }


    opacity =
        THREE.MathUtils.clamp(
            opacity,
            0,
            1
        );


    const geometry =
        new THREE.SphereGeometry(
            radius * 1.014,
            48,
            48
        );


    const material =
        new THREE.MeshPhongMaterial({
            map: cloudTexture,
            color: hexToNumber(
                cloudColour,
                0xffffff
            ),
            transparent: true,
            opacity: opacity,
            depthWrite: false
        });


    const clouds =
        new THREE.Mesh(
            geometry,
            material
        );


    clouds.userData.isCloudLayer =
        true;


    clouds.renderOrder =
        5;


    return clouds;
}


/* =========================================================
   RESEARCH PIN
   ========================================================= */

function createResearchPin(
    row,
    radius,
    colour,
    pointStyle
) {

    const group =
        new THREE.Group();


    group.userData = {

        type:
            "research",

        country:
            clean(
                row.country
            ),

        title:
            clean(
                row.title
            ),

        url:
            clean(
                row.url
            ),

        lat:
            Number(
                row.lat
            ),

        lon:
            Number(
                row.long
            )

    };


    if (
        clean(
            pointStyle
        ).toLowerCase() ===
        "pulse"
    ) {

        group.userData.pulse =
            Math.random() *
            Math.PI *
            2;
    }


    const normal =
        latLonToVector3(
            group.userData.lat,
            group.userData.lon,
            1
        ).normalize();


    group.position.copy(
        normal
            .clone()
            .multiplyScalar(
                radius * 1.055
            )
    );


    group.quaternion.setFromUnitVectors(
        new THREE.Vector3(
            0,
            0,
            1
        ),
        normal
    );


    /*
       Visible marker ring
    */

    const markerGeometry =
        new THREE.RingGeometry(
            radius * 0.055,
            radius * 0.075,
            24
        );


    const markerMaterial =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity: 0.78,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: true
        });


    const marker =
        new THREE.Mesh(
            markerGeometry,
            markerMaterial
        );


    marker.userData.isResearchMarker =
        true;


    marker.renderOrder =
        10;


    group.add(
        marker
    );


    /*
       Invisible larger hit area
    */

    const hitGeometry =
        new THREE.SphereGeometry(
            radius * 0.19,
            16,
            16
        );


    const hitMaterial =
        new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
        });


    const hit =
        new THREE.Mesh(
            hitGeometry,
            hitMaterial
        );


    hit.userData.isResearchHit =
        true;


    hit.renderOrder =
        20;


    group.add(
        hit
    );


    /*
       Crosshair style
    */

    if (
        clean(
            pointStyle
        ).toLowerCase() ===
        "crosshair"
    ) {

        const crossGeometry =
            new THREE.BufferGeometry();


        crossGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(
                [
                    -radius * 0.11, 0, 0,
                     radius * 0.11, 0, 0,
                    0, -radius * 0.11, 0,
                    0,  radius * 0.11, 0
                ],
                3
            )
        );


        const crossMaterial =
            new THREE.LineBasicMaterial({
                color: colour,
                transparent: true,
                opacity: 0.8,
                depthWrite: false
            });


        const cross =
            new THREE.LineSegments(
                crossGeometry,
                crossMaterial
            );


        cross.userData.isResearchMarker =
            true;


        cross.renderOrder =
            11;


        group.add(
            cross
        );
    }


    return group;
}


/* =========================================================
   PROJECT PLANET
   ========================================================= */

function createProjectPlanet(
    appearance,
    position
) {

    const project =
        clean(
            appearance.project
        );


    const name =
        clean(
            appearance.name
        );


    const colour =
        hexToNumber(
            appearance.colour,
            0x44ff88
        );


    const radius =
        sizeToRadius(
            appearance.size
        );


    const planet =
        new THREE.Group();


    planet.position.copy(
        position
    );


    planet.userData = {

        type:
            "planet",

        project:
            project,

        name:
            name,

        radius:
            radius,

        colour:
            colour,

        spin:
            clean(
                appearance.spin
            ).toLowerCase(),

        pointStyle:
            clean(
                appearance["point style"]
            ).toLowerCase(),

        appearance:
            appearance

    };


    /*
       Glow
    */

    const glowValue =
        clean(
            appearance.glow
        ).toLowerCase();


    if (
        glowValue &&
        glowValue !== "none"
    ) {

        const glow =
            createGlow(
                radius,
                colour,
                glowValue
            );


        planet.add(
            glow
        );
    }


    /*
       Surface
    */

    const surfaceOpacity =
        Number(
            appearance["surface opacity"]
        ) ||
        0.9;


    const surfaceGeometry =
        new THREE.SphereGeometry(
            radius,
            64,
            64
        );


    const surfaceMaterial =
        new THREE.MeshPhongMaterial({

            map:
                earthTexture,

            color:
                colour,

            transparent:
                true,

            opacity:
                surfaceOpacity,

            shininess:
                8,

            depthWrite:
                true,

            depthTest:
                true
        });


    const surface =
        new THREE.Mesh(
            surfaceGeometry,
            surfaceMaterial
        );


    surface.renderOrder =
        6;


    planet.add(
        surface
    );


    /*
       Colour wash
    */

    const washGeometry =
        new THREE.SphereGeometry(
            radius * 1.003,
            48,
            48
        );


    const washMaterial =
        new THREE.MeshBasicMaterial({

            color:
                colour,

            transparent:
                true,

            opacity:
                clean(
                    appearance.surface
                ) === "Earth"
                    ? 0.18
                    : 0.28,

            depthWrite:
                false,

            depthTest:
                true
        });


    const wash =
        new THREE.Mesh(
            washGeometry,
            washMaterial
        );


    wash.renderOrder =
        7;


    planet.add(
        wash
    );


    /*
       Standard grid
    */

    const gridOpacity =
        Number(
            appearance["grid opacity"]
        ) ||
        0;


    const grid =
        clean(
            appearance.grid
        ).toLowerCase();


    if (
        gridOpacity > 0 &&
        grid !== "none"
    ) {

        planet.add(
            createLatitudeLongitudeGrid(
                radius,
                colour,
                gridOpacity,
                grid
            )
        );
    }


    /*
       3D research navigation grid
    */

    const researchGrid =
        createResearchMapGrid(
            radius,
            colour,
            1
        );


    planet.add(
        researchGrid
    );


    /*
       Atmosphere
    */

    const atmosphereValue =
        clean(
            appearance.atmosphere
        ).toLowerCase();


    if (
        atmosphereValue &&
        atmosphereValue !== "none"
    ) {

        planet.add(
            createAtmosphere(
                radius,
                colour,
                clean(
                    appearance.glow
                ).toLowerCase()
            )
        );
    }


    /*
       Clouds
    */

    const clouds =
        createCloudLayer(
            radius,
            "yes",
            appearance["cloud colour"],
            appearance["cloud opacity"],
            appearance["cloud density"]
        );


    if (
        clouds
    ) {

        planet.add(
            clouds
        );
    }


    /*
       Rings
    */

    const rings =
        createPlanetRings(
            radius,
            hexToNumber(
                appearance["ring colour"],
                colour
            ),
            appearance.rings,
            appearance["ring density"]
        );


    planet.add(
        rings
    );


    /*
       Scan lines
    */

    planet.add(
        createScanLines(
            radius,
            colour,
            appearance["scan lines"]
        )
    );


    /*
       Particles
    */

    planet.add(
        createParticles(
            radius,
            colour,
            appearance.particles
        )
    );


    /*
       RESEARCH POINTS
    */

    const pointsGroup =
        new THREE.Group();


    pointsGroup.name =
        "Research Points";


    pointsGroup.renderOrder =
        20;


    planet.add(
        pointsGroup
    );


    scene.add(
        planet
    );


    planets.push(
        planet
    );


    projectObjects[
        project
    ] =
        planet;


    return planet;
}


/* =========================================================
   ATTACH RESEARCH POINTS
   ========================================================= */

function attachResearchPoints() {

    pointData.forEach(
        row => {

            const project =
                clean(
                    row.project
                );


            const planet =
                projectObjects[
                    project
                ];


            if (!planet) {

                return;
            }


            const pointsGroup =
                planet.children.find(
                    child =>
                        child.name ===
                        "Research Points"
                );


            if (!pointsGroup) {

                return;
            }


            pointsGroup.add(
                createResearchPin(
                    row,
                    planet.userData.radius,
                    planet.userData.colour,
                    planet.userData.pointStyle
                )
            );
        }
    );
}


/* =========================================================
   BUILD GALAXY
   ========================================================= */

function buildGalaxy() {

    const projectsWithPoints =
        new Set();


    pointData.forEach(
        row => {

            const project =
                clean(
                    row.project
                );


            if (project) {

                projectsWithPoints.add(
                    project
                );
            }
        }
    );


    const activeAppearances =
        appearanceData.filter(
            appearance =>
                projectsWithPoints.has(
                    clean(
                        appearance.project
                    )
                )
        );


    const positions = [

        new THREE.Vector3(
            -6.2,
            1.7,
            -1
        ),

        new THREE.Vector3(
            0.2,
            -1.3,
            -3
        ),

        new THREE.Vector3(
            6.0,
            1.0,
            -1.5
        ),

        new THREE.Vector3(
            -2.7,
            -3.2,
            -5
        ),

        new THREE.Vector3(
            3.1,
            3.4,
            -5.5
        ),

        new THREE.Vector3(
            8,
            -2,
            -7
        ),

        new THREE.Vector3(
            -8,
            -2,
            -6
        )
    ];


    activeAppearances.forEach(
        (
            appearance,
            index
        ) => {

            createProjectPlanet(
                appearance,
                positions[
                    index %
                    positions.length
                ].clone()
            );
        }
    );


    attachResearchPoints();
}


/* =========================================================
   CAMERA ANIMATION
   ========================================================= */

function updateCameraLook() {

    camera.lookAt(
        cameraLookTarget
    );
}


function startCameraAnimation(
    targetPosition,
    endLookTarget,
    duration = 1600
) {

    cameraAnimationStart =
        performance.now();


    cameraStartPosition.copy(
        camera.position
    );


    cameraTargetPosition.copy(
        targetPosition
    );


    cameraStartLookTarget.copy(
        cameraLookTarget
    );


    cameraEndLookTarget.copy(
        endLookTarget
    );


    cameraAnimationDuration =
        duration;


    cameraAnimating =
        true;
}


function updateCameraAnimation(
    now
) {

    if (
        !cameraAnimating
    ) {

        return;
    }


    const elapsed =
        now -
        cameraAnimationStart;


    const t =
        Math.min(
            elapsed /
            cameraAnimationDuration,
            1
        );


    const eased =
        1 -
        Math.pow(
            1 - t,
            3
        );


    camera.position.lerpVectors(
        cameraStartPosition,
        cameraTargetPosition,
        eased
    );


    cameraLookTarget.lerpVectors(
        cameraStartLookTarget,
        cameraEndLookTarget,
        eased
    );


    updateCameraLook();


    if (
        t >= 1
    ) {

        cameraAnimating =
            false;
    }
}


/* =========================================================
   GALAXY CAMERA
   ========================================================= */

function updateGalaxyCamera() {

    const x =
        galaxyDistance *
        Math.cos(
            galaxyPitch
        ) *
        Math.sin(
            galaxyYaw
        );


    const y =
        galaxyDistance *
        Math.sin(
            galaxyPitch
        );


    const z =
        galaxyDistance *
        Math.cos(
            galaxyPitch
        ) *
        Math.cos(
            galaxyYaw
        );


    camera.position.set(
        x,
        y,
        z
    );


    cameraLookTarget.set(
        0,
        0,
        0
    );


    updateCameraLook();
}


/* =========================================================
   FIXED PLANET CAMERA
   ========================================================= */

function updatePlanetCamera() {

    if (
        !selectedPlanet
    ) {

        return;
    }


    const position =
        new THREE.Vector3();


    selectedPlanet.getWorldPosition(
        position
    );


    camera.position.set(
        position.x,
        position.y,
        position.z +
        planetDistance
    );


    cameraLookTarget.copy(
        position
    );


    updateCameraLook();


    updateMarkerConnector();
}


/* =========================================================
   ENTER PLANET
   ========================================================= */

function enterPlanet(
    planet
) {

    if (
        planetMode ||
        cameraAnimating
    ) {

        return;
    }


    selectedPlanet =
        planet;


    selectedProject =
        planet.userData.project;


    hoveredPlanet =
        null;


    updatePlanetLabel();


    planetMode =
        true;


    activeMarker =
        null;


    hideMarkerCard();

    hideMarkerConnector();


    planets.forEach(
        other => {

            other.visible =
                other === planet;
        }
    );


    const worldPosition =
        new THREE.Vector3();


    planet.getWorldPosition(
        worldPosition
    );


    planetDistance =
        Math.max(
            planet.userData.radius *
            3.8,
            7
        );


    const targetCamera =
        new THREE.Vector3(
            worldPosition.x,
            worldPosition.y,
            worldPosition.z +
            planetDistance
        );


    startCameraAnimation(
        targetCamera,
        worldPosition,
        1500
    );


    showPlanetHUD(
        planet
    );


    document
        .getElementById(
            "backButton"
        )
        .classList.add(
            "visible"
        );


    document
        .getElementById(
            "instructions"
        )
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A LOCATION";
}


/* =========================================================
   EXIT PLANET
   ========================================================= */

function exitPlanet() {

    if (
        !planetMode
    ) {

        return;
    }


    planetMode =
        false;


    selectedPlanet =
        null;


    selectedProject =
        null;


    activeMarker =
        null;


    hoveredPlanet =
        null;


    hideMarkerCard();

    hideMarkerConnector();

    hidePlanetHUD();


    planets.forEach(
        planet => {

            planet.visible =
                true;
        }
    );


    document
        .getElementById(
            "backButton"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "instructions"
        )
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


    startCameraAnimation(
        new THREE.Vector3(
            0,
            2,
            20
        ),
        new THREE.Vector3(
            0,
            0,
            0
        ),
        1200
    );
}

/* =========================================================
   MEASUREMENT SCALE
   ========================================================= */

function createMeasurementScale(
    pointCount
) {

    const scale =
        document.getElementById(
            "measurementScale"
        );


    scale.innerHTML =
        '<div class="scale-line"></div>';


    const count =
        9;


    for (
        let i = 0;
        i <= count;
        i++
    ) {

        const tick =
            document.createElement(
                "div"
            );


        tick.className =
            "scale-tick" +
            (
                i % 3 === 0
                    ? " major"
                    : ""
            );


        tick.style.top =
            `${(
                i /
                count
            ) * 100}%`;


        scale.appendChild(
            tick
        );


        if (
            i % 3 === 0
        ) {

            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "scale-number";


            number.style.top =
                `${(
                    i /
                    count
                ) * 100}%`;


            number.textContent =
                String(
                    i * 10
                ).padStart(
                    2,
                    "0"
                );


            scale.appendChild(
                number
            );
        }
    }


    const label =
        document.createElement(
            "div"
        );


    label.style.position =
        "absolute";


    label.style.right =
        "0";


    label.style.bottom =
        "-16px";


    label.style.fontSize =
        "6px";


    label.style.letterSpacing =
        "0.16em";


    label.style.opacity =
        "0.35";


    label.textContent =
        `PTS ${String(
            pointCount
        ).padStart(
            3,
            "0"
        )}`;


    scale.appendChild(
        label
    );
}

        );

function projectToHUD(
    worldPosition
) {

    const projected =
        worldPosition
            .clone()
            .project(
                camera
            );


    return {

        x:
            (
                projected.x *
                0.5 +
                0.5
            ) *
            1000,

        y:
            (
                -projected.y *
                0.5 +
                0.5
            ) *
            600

    };
}


function updateMarkerConnector() {

    if (
        !planetMode ||
        !activeMarker ||
        !selectedPlanet
    ) {

        hideMarkerConnector();

        return;
    }


    const markerWorld =
        new THREE.Vector3();


    activeMarker.getWorldPosition(
        markerWorld
    );


    const point =
        projectToHUD(
            markerWorld
        );


    point.y += 4;


    const cardOnRight =
        point.x < 570;


    const targetX =
        cardOnRight
            ? 730
            : 270;


    const elbowX =
        cardOnRight
            ? 650
            : 350;


    const targetY =
        Math.max(
            100,
            Math.min(
                500,
                point.y
            )
        );


    const points =
        [
            `${point.x},${point.y}`,
            `${elbowX},${point.y}`,
            `${targetX},${targetY}`
        ].join(
            " "
        );


    document
        .getElementById(
            "markerConnectorPoint"
        )
        .setAttribute(
            "cx",
            point.x
        );


    document
        .getElementById(
            "markerConnectorPoint"
        )
        .setAttribute(
            "cy",
            point.y
        );


    document
        .getElementById(
            "markerConnectorLine"
        )
        .setAttribute(
            "points",
            points
        );


    document
        .getElementById(
            "markerConnectorTick"
        )
        .setAttribute(
            "x1",
            targetX
        );


    document
        .getElementById(
            "markerConnectorTick"
        )
        .setAttribute(
            "y1",
            targetY - 8
        );


    document
        .getElementById(
            "markerConnectorTick"
        )
        .setAttribute(
            "x2",
            targetX
        );


    document
        .getElementById(
            "markerConnectorTick"
        )
        .setAttribute(
            "y2",
            targetY + 8
        );


    showMarkerConnector();
}


/* =========================================================
   POINTER STATE
   ========================================================= */

let isPointerDown = false;

let isDragging = false;

let didDrag = false;

let pointerStartX = 0;

let pointerStartY = 0;

let previousPointerX = 0;

let previousPointerY = 0;

const DRAG_THRESHOLD = 6;

const DRAG_SENSITIVITY = 0.0035;


/* =========================================================
   POINTER DOWN
   ========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        if (
            cameraAnimating
        ) {

            return;
        }


        isPointerDown =
            true;


        isDragging =
            false;


        didDrag =
            false;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        previousPointerX =
            event.clientX;


        previousPointerY =
            event.clientY;


        if (
            !planetMode
        ) {

            const x =
                camera.position.x;


            const y =
                camera.position.y;


            const z =
                camera.position.z;


            galaxyDistance =
                Math.sqrt(
                    x * x +
                    y * y +
                    z * z
                );


            galaxyYaw =
                Math.atan2(
                    x,
                    z
                );


            galaxyPitch =
                Math.asin(
                    y /
                    galaxyDistance
                );
        }


        renderer.domElement.setPointerCapture(
            event.pointerId
        );


        document.body.classList.add(
            "dragging"
        );
    }
);


/* =========================================================
   POINTER MOVE
   ========================================================= */

renderer.domElement.addEventListener(
    "pointermove",
    event => {

        /*
           PLANET MODE
        */

        if (
            planetMode
        ) {

            if (
                !isPointerDown ||
                !selectedPlanet
            ) {

                return;
            }


            const dx =
                event.clientX -
                pointerStartX;


            const dy =
                event.clientY -
                pointerStartY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                !isDragging &&
                distance >
                DRAG_THRESHOLD
            ) {

                isDragging =
                    true;


                didDrag =
                    true;
            }


            if (
                !isDragging
            ) {

                return;
            }


            const movementX =
                event.clientX -
                previousPointerX;


            const movementY =
                event.clientY -
                previousPointerY;


            previousPointerX =
                event.clientX;


            previousPointerY =
                event.clientY;


            selectedPlanet.rotation.y +=
                movementX *
                0.0045;


            selectedPlanet.rotation.x +=
                movementY *
                0.0045;


            selectedPlanet.rotation.x =
                THREE.MathUtils.clamp(
                    selectedPlanet.rotation.x,
                    -1.25,
                    1.25
                );


            if (
                activeMarker
            ) {

                updateMarkerConnector();
            }


            return;
        }


        /*
           GALAXY MODE HOVER
        */

        if (
            !isPointerDown
        ) {

            mouse.x =
                (
                    event.clientX /
                    window.innerWidth
                ) *
                2 -
                1;


            mouse.y =
                -(
                    event.clientY /
                    window.innerHeight
                ) *
                2 +
                1;


            raycaster.setFromCamera(
                mouse,
                camera
            );


            const intersects =
                raycaster.intersectObjects(
                    planets,
                    true
                );


            hoveredPlanet =
                null;


            for (
                let i = 0;
                i < intersects.length;
                i++
            ) {

                let object =
                    intersects[i].object;


                while (
                    object &&
                    !object.userData.project
                ) {

                    object =
                        object.parent;
                }


                if (
                    object &&
                    object.userData.type ===
                    "planet"
                ) {

                    hoveredPlanet =
                        object;

                    break;
                }
            }


            updatePlanetLabel();

            return;
        }


        /*
           GALAXY MODE DRAG
        */

        const dx =
            event.clientX -
            pointerStartX;


        const dy =
            event.clientY -
            pointerStartY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            !isDragging &&
            distance >
            DRAG_THRESHOLD
        ) {

            isDragging =
                true;


            didDrag =
                true;
        }


        if (
            !isDragging
        ) {

            return;
        }


        const movementX =
            event.clientX -
            previousPointerX;


        const movementY =
            event.clientY -
            previousPointerY;


        previousPointerX =
            event.clientX;


        previousPointerY =
            event.clientY;


        galaxyYaw -=
            movementX *
            DRAG_SENSITIVITY;


        galaxyPitch -=
            movementY *
            DRAG_SENSITIVITY;


        galaxyPitch =
            THREE.MathUtils.clamp(
                galaxyPitch,
                -1.35,
                1.35
            );


        updateGalaxyCamera();
    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

renderer.domElement.addEventListener(
    "pointerup",
    event => {

        if (
            cameraAnimating
        ) {

            return;
        }


        const wasDragging =
            didDrag;


        isPointerDown =
            false;


        isDragging =
            false;


        document.body.classList.remove(
            "dragging"
        );


        try {

            renderer.domElement.releasePointerCapture(
                event.pointerId
            );

        } catch (
            error
        ) {}


        if (
            planetMode
        ) {

            didDrag =
                false;


            if (
                wasDragging
            ) {

                return;
            }


            handleClick(
                event
            );


            return;
        }


        if (
            wasDragging
        ) {

            didDrag =
                false;

            return;
        }


        didDrag =
            false;


        handleClick(
            event
        );
    }
);


/* =========================================================
   CLICK
   ========================================================= */

function handleClick(
    event
) {

    mouse.x =
        (
            event.clientX /
            window.innerWidth
        ) *
        2 -
        1;


    mouse.y =
        -(
            event.clientY /
            window.innerHeight
        ) *
        2 +
        1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    /*
       GALAXY MODE
    */

    if (
        !planetMode
    ) {

        const intersects =
            raycaster.intersectObjects(
                planets,
                true
            );


        for (
            let i = 0;
            i < intersects.length;
            i++
        ) {

            let object =
                intersects[i].object;


            while (
                object &&
                object.userData.type !==
                "planet"
            ) {

                object =
                    object.parent;
            }


            if (
                object &&
                object.userData.type ===
                "planet"
            ) {

                enterPlanet(
                    object
                );

                return;
            }
        }


        return;
    }


    /*
       PLANET MODE
    */

    if (
        !selectedPlanet
    ) {

        return;
    }


    const pointsGroup =
        selectedPlanet.children.find(
            child =>
                child.name ===
                "Research Points"
        );


    if (
        !pointsGroup
    ) {

        return;
    }


    const intersects =
        raycaster.intersectObjects(
            pointsGroup.children,
            true
        );


    for (
        let i = 0;
        i < intersects.length;
        i++
    ) {

        let object =
            intersects[i].object;


        while (
            object &&
            object.userData.type !==
            "research"
        ) {

            object =
                object.parent;
        }


        if (
            object &&
            object.userData.type ===
            "research"
        ) {

            activeMarker =
                object;


            showMarkerCard(
                object.userData
            );


            updateMarkerConnector();


            return;
        }
    }
}


/* =========================================================
   GALAXY / PLANET ZOOM
   ========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (
            cameraAnimating
        ) {

            return;
        }


        if (
            !planetMode
        ) {

            galaxyDistance +=
                event.deltaY *
                0.012;


            galaxyDistance =
                THREE.MathUtils.clamp(
                    galaxyDistance,
                    8,
                    45
                );


            updateGalaxyCamera();

            return;
        }


        planetDistance +=
            event.deltaY *
            0.008;


        planetDistance =
            THREE.MathUtils.clamp(
                planetDistance,
                3.5,
                15
            );


        updatePlanetCamera();
    },
    {
        passive: false
    }
);


/* =========================================================
   PLANET LABEL
   ========================================================= */

function updatePlanetLabel() {

    const label =
        document.getElementById(
            "planetLabel"
        );


    if (
        !hoveredPlanet ||
        planetMode
    ) {

        label.classList.remove(

        );

    }

        ) *

    );
}

/* =========================================================
   ANIMATION
   ========================================================= */

let lastTime =
    performance.now();


function animate(
    now
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (
                now -
                lastTime
            ) / 1000,
            0.05
        );


    lastTime =
        now;


    updateCameraAnimation(
        now
    );


    /*
       Galaxy planets rotate.
    */

    if (
        !planetMode &&
        !isPointerDown &&
        !cameraAnimating
    ) {

        planets.forEach(
            planet => {

                let speed =
                    0.05;


                if (
                    planet.userData.spin ===
                    "slow"
                ) {

                    speed =
                        0.025;

                } else if (
                    planet.userData.spin ===
                    "fast"
                ) {

                    speed =
                        0.09;
                }


                planet.rotation.y +=
                    speed *
                    delta;
            }
        );
    }


    /*
       Clouds
    */

    planets.forEach(
        planet => {

            planet.children.forEach(
                child => {

                    if (
                        child.userData &&
                        child.userData.isCloudLayer
                    ) {

                        child.rotation.y +=
                            0.012 *
                            delta;
                    }
                }
            );
        }
    );


    /*
       3D research grid
    */

    planets.forEach(
        planet => {

            const researchGrid =
                planet.children.find(
                    child =>
                        child.name ===
                        "3D Research Grid"
                );


            if (
                researchGrid &&
                !planetMode
            ) {

                researchGrid.rotation.y +=
                    0.002 *
                    delta;
            }
        }
    );


    /*
       Pulse markers
    */

    planets.forEach(
        planet => {

            const pointsGroup =
                planet.children.find(
                    child =>
                        child.name ===
                        "Research Points"
                );


            if (
                !pointsGroup
            ) {

                return;
            }


            pointsGroup.children.forEach(
                pin => {

                    if (
                        pin.userData &&
                        pin.userData.pulse !==
                        undefined
                    ) {

                        pin.userData.pulse +=
                            delta *
                            3;


                        const scale =
                            1 +
                            Math.sin(
                                pin.userData.pulse
                            ) *
                            0.25;


                        pin.children.forEach(
                            child => {

                                if (
                                    child.userData &&
                                    child.userData.isResearchHit
                                ) {

                                    return;
                                }


                                if (
                                    child.userData &&
                                    child.userData.isResearchMarker
                                ) {

                                    child.scale.set(
                                        scale,
                                        scale,
                                        scale
                                    );
                                }
                            }
                        );
                    }
                }
            );
        }
    );


    /*
       Keep connector aligned
    */

    if (
        planetMode &&
        activeMarker
    ) {

        updateMarkerConnector();
    }


    renderer.render(
        scene,
        camera
    );
}

        camera.aspect =

        ) {

/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {

    try {

        const [
            pointsResponse,
            appearanceResponse
        ] =
            await Promise.all([

                fetch(
                    POINTS_CSV +
                    "&cache=" +
                    Date.now()
                ),

                fetch(
                    APPEARANCE_CSV +
                    "&cache=" +
                    Date.now()
                )
            ]);


        if (
            !pointsResponse.ok ||
            !appearanceResponse.ok
        ) {

            throw new Error(
                "Could not load Google Sheets."
            );
        }


        const pointsText =
            await pointsResponse.text();


        const appearanceText =
            await appearanceResponse.text();


        pointData =
            parseCSV(
                pointsText
            );


        appearanceData =
            parseCSV(
                appearanceText
            );


        console.log(
            "Research points:",
            pointData
        );


        console.log(
            "Planet appearances:",
            appearanceData
        );


        buildGalaxy();


        updateGalaxyCamera();


        document
            .getElementById(
                "loading"
            )
            .classList.add(
                "hidden"
            );


    } catch (
        error
    ) {

        console.error(
            error
        );


        document
            .getElementById(
                "loading"
            )
            .textContent =
            "Could not load research universe";
    }
}

loadData();

animate(
    performance.now()
);
