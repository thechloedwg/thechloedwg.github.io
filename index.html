<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>


//
// ============================================================
// BASIC SETUP
// ============================================================
//


const container =
    document.getElementById(
        "container"
    );


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
            window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    2,
    20
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


container.appendChild(
    renderer.domElement
);



//
// ============================================================
// GALAXY
// ============================================================
//


const galaxy =
    new THREE.Group();


scene.add(
    galaxy
);



//
// ============================================================
// LIGHT
// ============================================================
//


const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );


scene.add(
    ambientLight
);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.2
    );


directionalLight.position.set(
    5,
    8,
    10
);


scene.add(
    directionalLight
);



//
// ============================================================
// EARTH TEXTURE
// ============================================================
//


const textureLoader =
    new THREE.TextureLoader();


const earthTexture =
    textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
    );



//
// ============================================================
// GLOBAL STATE
// ============================================================
//


let mode =
    "galaxy";


let selectedPlanet =
    null;


let cameraAnimating =
    false;


let isDragging =
    false;


let previousMouse = {
    x: 0,
    y: 0
};


const planets = [];

const labels = [];

const projectData = {};



//
// ============================================================
// SIZE SYSTEM
// ============================================================
//
// Spreadsheet size:
// 1 = tiny
// 2 = small
// 3 = medium
// 4 = large
// 5 = major
//
//


function sizeToRadius(
    size
) {

    const sizes = {

        1: 0.9,

        2: 1.25,

        3: 1.7,

        4: 2.25,

        5: 3.0

    };


    return (
        sizes[
            Math.round(size)
        ] || 1.7
    );
}



//
// ============================================================
// PROJECT COLOURS
// ============================================================
//
//
// These are assigned automatically.
// You can change them later.
//


const projectColours = [

    0x35d07f,

    0xff405f,

    0xffc84a,

    0x5d8cff,

    0xc56cff,

    0x55d8d0,

    0xff8b4d,

    0xe8e8e8

];



//
// ============================================================
// CREATE PROJECT PLANET
// ============================================================
//


function createProjectPlanet(
    project,
    size,
    colour,
    position,
    isUNGA = false
) {

    const radius =
        sizeToRadius(
            size
        );


    let geometry =
        new THREE.SphereGeometry(
            radius,
            48,
            48
        );


    let material;


    //
    // UNGA gets Earth.
    //

    if (
        isUNGA
    ) {

        material =
            new THREE.MeshPhongMaterial({

                map:
                    earthTexture,

                transparent:
                    true,

                opacity:
                    0.92

            });

    } else {

        material =
            new THREE.MeshPhongMaterial({

                color:
                    colour,

                transparent:
                    true,

                opacity:
                    0.75

            });
    }


    const planet =
        new THREE.Mesh(
            geometry,
            material
        );


    planet.position.copy(
        position
    );


    planet.userData = {

        project:
            project,

        size:
            size,

        targetOpacity:
            isUNGA
                ? 0.92
                : 0.75

    };


    galaxy.add(
        planet
    );


    planets.push(
        planet
    );


    //
    // UNGA gets grid + atmosphere.
    //

    if (
        isUNGA
    ) {

        addEarthLayers(
            planet,
            radius
        );
    }


    return planet;
}



//
// ============================================================
// EARTH ATMOSPHERE + GRID
// ============================================================
//


function addEarthLayers(
    earth,
    radius
) {

    const atmosphereGeometry =
        new THREE.SphereGeometry(
            radius * 1.04,
            64,
            64
        );


    const atmosphereMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x66ccff,

            transparent:
                true,

            opacity:
                0.08,

            side:
                THREE.BackSide

        });


    const atmosphere =
        new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial
        );


    earth.add(
        atmosphere
    );


    const gridGroup =
        new THREE.Group();


    earth.add(
        gridGroup
    );


    const gridMaterial =
        new THREE.LineBasicMaterial({

            color:
                0xffffff,

            transparent:
                true,

            opacity:
                0.08

        });


    //
    // Latitude
    //

    for (
        let lat = -80;
        lat <= 80;
        lat += 20
    ) {

        const points = [];

        const phi =
            THREE.MathUtils.degToRad(
                90 - lat
            );


        const y =
            radius *
            Math.cos(phi);


        const r =
            radius *
            Math.sin(phi);


        for (
            let lon = 0;
            lon <= 360;
            lon += 5
        ) {

            const theta =
                THREE.MathUtils.degToRad(
                    lon
                );


            points.push(

                new THREE.Vector3(

                    r *
                    Math.cos(theta),

                    y,

                    r *
                    Math.sin(theta)

                )

            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const line =
            new THREE.Line(
                geometry,
                gridMaterial
            );


        gridGroup.add(
            line
        );
    }


    //
    // Longitude
    //

    for (
        let lon = 0;
        lon < 360;
        lon += 20
    ) {

        const points = [];


        const theta =
            THREE.MathUtils.degToRad(
                lon
            );


        for (
            let lat = -90;
            lat <= 90;
            lat += 5
        ) {

            const phi =
                THREE.MathUtils.degToRad(
                    lat
                );


            const x =
                radius *
                Math.cos(phi) *
                Math.cos(theta);


            const y =
                radius *
                Math.sin(phi);


            const z =
                radius *
                Math.cos(phi) *
                Math.sin(theta);


            points.push(

                new THREE.Vector3(
                    x,
                    y,
                    z
                )

            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const line =
            new THREE.Line(
                geometry,
                gridMaterial
            );


        gridGroup.add(
            line
        );
    }
}



//
// ============================================================
// PLANET LABEL
// ============================================================
//


function createPlanetLabel(
    planet,
    name
) {

    const label =
        document.createElement(
            "div"
        );


    label.className =
        "planet-label";


    label.textContent =
        name;


    document.body.appendChild(
        label
    );


    labels.push({

        element:
            label,

        object:
            planet

    });
}



//
// ============================================================
// UPDATE LABELS
// ============================================================
//


function updateLabels() {

    labels.forEach(
        item => {

            const worldPosition =
                new THREE.Vector3();


            item.object.getWorldPosition(
                worldPosition
            );


            const radius =
                item.object.geometry
                    .parameters.radius;


            worldPosition.y +=
                radius + 0.5;


            const projected =
                worldPosition.clone();


            projected.project(
                camera
            );


            const x =
                (
                    projected.x *
                    0.5 +
                    0.5
                ) *
                window.innerWidth;


            const y =
                (
                    -projected.y *
                    0.5 +
                    0.5
                ) *
                window.innerHeight;


            item.element.style.left =
                `${x}px`;


            item.element.style.top =
                `${y}px`;


            //
            // Behind camera?
            //

            if (
                projected.z > 1
            ) {

                item.element.style.opacity =
                    "0";

            } else if (

                mode === "planet" &&
                item.object !==
                    selectedPlanet

            ) {

                item.element.style.opacity =
                    "0";

            } else {

                item.element.style.opacity =
                    "1";
            }
        }
    );
}



//
// ============================================================
// RESEARCH POINT GROUPS
// ============================================================
//


const researchGroups = {};



//
// ============================================================
// LAT/LON → 3D
// ============================================================
//


function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );


    const theta =
        THREE.MathUtils.degToRad(
            lon + 180
        );


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    return new THREE.Vector3(
        x,
        y,
        z
    );
}



//
// ============================================================
// CSV PARSER
// ============================================================
//


function parseCSV(
    text
) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes =
        false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            cell += '"';

            i++;

        } else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(
                cell
            );

            cell = "";

        } else if (

            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes

        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;
            }


            row.push(
                cell
            );


            rows.push(
                row
            );


            row = [];

            cell = "";

        } else {

            cell += char;
        }
    }


    if (
        cell.length ||
        row.length
    ) {

        row.push(
            cell
        );


        rows.push(
            row
        );
    }


    if (
        rows.length === 0
    ) {

        return [];
    }


    const headers =
        rows[0].map(
            h =>
                h
                    .trim()
                    .toLowerCase()
        );


    return rows
        .slice(1)
        .filter(
            r =>
                r.length > 1
        )
        .map(
            r => {

                const obj = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {

                        obj[header] =
                            (
                                r[index] ||
                                ""
                            ).trim();

                    }
                );


                return obj;
            }
        );
}



//
// ============================================================
// CREATE UNIVERSE FROM SPREADSHEET
// ============================================================
//


function buildUniverse(
    data
) {

    //
    // Remove any existing
    // project planets.
    //

    planets.forEach(
        planet => {

            galaxy.remove(
                planet
            );
        }
    );


    planets.length = 0;


    labels.forEach(
        label => {

            label.element.remove();
        }
    );


    labels.length = 0;


    //
    // Clear project data.
    //

    Object.keys(
        projectData
    ).forEach(
        key => {

            delete projectData[key];

        }
    );


    //
    // Group spreadsheet rows
    // by project.
    //

    data.forEach(
        row => {

            if (
                !row.project
            ) {
                return;
            }


            const project =
                row.project.trim();


            if (
                !project
            ) {
                return;
            }


            if (
                !projectData[project]
            ) {

                projectData[project] = [];
            }


            projectData[project].push(
                row
            );
        }
    );


    const projectNames =
        Object.keys(
            projectData
        );


    //
    // Create one planet per
    // project.
    //

    projectNames.forEach(
        (
            project,
            index
        ) => {

            const rows =
                projectData[project];


            //
            // Size comes from the
            // first row.
            //

            let size =
                parseFloat(
                    rows[0].size
                );


            if (
                !Number.isFinite(size)
            ) {

                size = 3;
            }


            size =
                THREE.MathUtils.clamp(
                    Math.round(size),
                    1,
                    5
                );


            //
            // Special UNGA treatment.
            //

            const isUNGA =
                project
                    .toUpperCase() ===
                "UNGA81";


            //
            // Arrange planets in
            // a loose 3D formation.
            //

            let position;


            if (
                projectNames.length === 1
            ) {

                position =
                    new THREE.Vector3(
                        0,
                        0,
                        0
                    );

            } else {

                const angle =
                    index *
                    Math.PI *
                    2 /
                    projectNames.length;


                const distance =
                    6 +
                    (
                        index % 2
                    ) * 2;


                position =
                    new THREE.Vector3(

                        Math.cos(angle) *
                            distance,

                        (
                            index % 3 -
                            1
                        ) * 3,

                        Math.sin(angle) *
                            distance

                    );
            }


            //
            // Give each project
            // a colour.
            //

            const colour =
                projectColours[
                    index %
                    projectColours.length
                ];


            const planet =
                createProjectPlanet(
                    project,
                    size,
                    colour,
                    position,
                    isUNGA
                );


            planet.userData.rows =
                rows;


            //
            // Label.
            //

            createPlanetLabel(
                planet,
                project
            );


            //
            // Create research
            // points for this planet.
            //

            const pointsGroup =
                new THREE.Group();


            planet.add(
                pointsGroup
            );


            researchGroups[project] =
                pointsGroup;


            //
            // Add every spreadsheet
            // row as a location.
            //

            rows.forEach(
                row => {

                    const lat =
                        parseFloat(
                            row.lat
                        );


                    const lon =
                        parseFloat(
                            row.long
                        );


                    if (
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lon)
                    ) {

                        return;
                    }


                    //
                    // Scale points to
                    // planet size.
                    //

                    const pointRadius =
                        sizeToRadius(size) *
                        0.018;


                    const geometry =
                        new THREE.SphereGeometry(
                            pointRadius,
                            12,
                            12
                        );


                    const material =
                        new THREE.MeshBasicMaterial({

                            color:
                                0xffffff,

                            transparent:
                                true,

                            opacity:
                                0.25

                        });


                    const point =
                        new THREE.Mesh(
                            geometry,
                            material
                        );


                    point.position.copy(

                        latLonToVector3(

                            lat,
                            lon,

                            sizeToRadius(size) *
                                1.025

                        )

                    );


                    point.userData = {

                        type:
                            "research",

                        project:
                            project,

                        country:
                            row.country,

                        title:
                            row.title,

                        url:
                            row.url ||
                            row.URL,

                        lat:
                            lat,

                        lon:
                            lon

                    };


                    pointsGroup.add(
                        point
                    );
                }
            );
        }
    );
}



//
// ============================================================
// LOAD SPREADSHEET
// ============================================================
//


const DATA_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ23GJgYn3S8flelPGL3HDWtEOisQZJYHt6-Yt90P8mEYladNlO2N4xCEx9Zj03Z3GQNCNG0PihZYlN/pub?gid=0&single=true&output=csv";


fetch(
    DATA_URL
)

.then(
    response => {

        if (
            !response.ok
        ) {

            throw new Error(
                "Could not load spreadsheet"
            );
        }


        return response.text();
    }
)

.then(
    text => {

        const data =
            parseCSV(
                text
            );


        buildUniverse(
            data
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";
    }
)

.catch(
    error => {

        console.error(
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "RESEARCH DATA COULD NOT BE LOADED";
    }
);



//
// ============================================================
// STARS
// ============================================================
//


const starGeometry =
    new THREE.BufferGeometry();


const starPositions = [];


for (
    let i = 0;
    i < 5000;
    i++
) {

    starPositions.push(

        (
            Math.random() -
            0.5
        ) * 200,

        (
            Math.random() -
            0.5
        ) * 200,

        (
            Math.random() -
            0.5
        ) * 200

    );
}


starGeometry.setAttribute(

    "position",

    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )

);


const starMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            0.08,

        transparent:
            true,

        opacity:
            0.6

    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(
    stars
);



//
// ============================================================
// DRAG
// ============================================================
//


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        isDragging =
            true;


        previousMouse.x =
            event.clientX;


        previousMouse.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (
            !isDragging ||
            cameraAnimating
        ) {

            return;
        }


        const deltaX =
            event.clientX -
            previousMouse.x;


        const deltaY =
            event.clientY -
            previousMouse.y;


        if (
            mode === "galaxy"
        ) {

            galaxy.rotation.y +=
                deltaX * 0.005;


            galaxy.rotation.x +=
                deltaY * 0.005;

        } else if (
            selectedPlanet
        ) {

            selectedPlanet.rotation.y +=
                deltaX * 0.005;


            selectedPlanet.rotation.x +=
                deltaY * 0.005;
        }


        previousMouse.x =
            event.clientX;


        previousMouse.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    () => {

        isDragging =
            false;
    }
);


renderer.domElement.addEventListener(
    "pointerleave",
    () => {

        isDragging =
            false;
    }
);



//
// ============================================================
// ZOOM
// ============================================================
//


renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (
            cameraAnimating
        ) {

            return;
        }


        camera.position.z +=
            event.deltaY * 0.01;


        if (
            mode === "galaxy"
        ) {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    8,
                    40
                );

        } else {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    3.5,
                    15
                );
        }
    },
    {
        passive: false
    }
);



//
// ============================================================
// RAYCASTING
// ============================================================
//


const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


function getMouse(
    event
) {

    mouse.x =
        (
            event.clientX /
            window.innerWidth
        ) *
        2 -
        1;


    mouse.y =
        -(
            event.clientY /
            window.innerHeight
        ) *
        2 +
        1;
}



//
// ============================================================
// CLICK
// ============================================================
//


renderer.domElement.addEventListener(
    "click",
    event => {

        getMouse(
            event
        );


        raycaster.setFromCamera(
            mouse,
            camera
        );


        //
        // GALAXY MODE
        //

        if (
            mode === "galaxy"
        ) {

            //
            // ONLY PLANETS.
            //

            const hits =
                raycaster.intersectObjects(
                    planets,
                    false
                );


            if (
                hits.length > 0 &&
                !cameraAnimating
            ) {

                enterPlanet(
                    hits[0].object
                );
            }


            return;
        }


        //
        // PLANET MODE
        //

        if (
            mode === "planet" &&
            selectedPlanet
        ) {

            const project =
                selectedPlanet
                    .userData
                    .project;


            const pointsGroup =
                researchGroups[
                    project
                ];


            if (
                !pointsGroup
            ) {
                return;
            }


            const hits =
                raycaster.intersectObjects(
                    pointsGroup.children,
                    false
                );


            if (
                hits.length > 0
            ) {

                showResearchPin(
                    hits[0].object
                );
            }
        }
    }
);



//
// ============================================================
// ENTER PLANET
// ============================================================
//


function enterPlanet(
    planet
) {

    selectedPlanet =
        planet;


    mode =
        "planet";


    cameraAnimating =
        true;


    document.getElementById(
        "backButton"
    ).style.display =
        "block";


    document.getElementById(
        "instructions"
    ).textContent =
        "DRAG TO ROTATE · SCROLL TO ZOOM · SELECT A LOCATION";


    //
    // Fade every other planet.
    //

    planets.forEach(
        other => {

            if (
                other === planet
            ) {

                other.userData
                    .targetOpacity =
                    planet.userData
                        .project
                        .toUpperCase() ===
                    "UNGA81"
                        ? 0.92
                        : 0.75;

            } else {

                other.userData
                    .targetOpacity =
                    0;
            }
        }
    );


    //
    // Find current world
    // position.
    //

    const worldPosition =
        new THREE.Vector3();


    planet.getWorldPosition(
        worldPosition
    );


    //
    // Direction from planet
    // toward camera.
    //

    const direction =
        new THREE.Vector3()
            .subVectors(
                camera.position,
                worldPosition
            )
            .normalize();


    //
    // Zoom distance based
    // on planet size.
    //

    const radius =
        planet.geometry
            .parameters
            .radius;


    const distance =
        radius * 2.7;


    const destination =
        worldPosition.clone()
            .add(
                direction.multiplyScalar(
                    distance
                )
            );


    animateCameraTo(

        destination,

        worldPosition,

        () => {

            cameraAnimating =
                false;

            //
            // Research points appear.
            //

            const project =
                planet.userData
                    .project;


            const pointsGroup =
                researchGroups[
                    project
                ];


            if (
                pointsGroup
            ) {

                pointsGroup.children
                    .forEach(
                        point => {

                            point.material.opacity =
                                0.9;
                        }
                    );
            }
        }
    );
}



//
// ============================================================
// CAMERA ANIMATION
// ============================================================
//


function animateCameraTo(
    destination,
    target,
    callback
) {

    const startPosition =
        camera.position.clone();


    const startTime =
        performance.now();


    const duration =
        1600;


    function animateCamera() {

        const elapsed =
            performance.now() -
            startTime;


        let progress =
            elapsed /
            duration;


        progress =
            Math.min(
                progress,
                1
            );


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        camera.position.lerpVectors(

            startPosition,

            destination,

            eased

        );


        camera.lookAt(
            target
        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animateCamera
            );

        } else {

            callback();
        }
    }


    animateCamera();
}



//
// ============================================================
// RESEARCH PIN
// ============================================================
//


function showResearchPin(
    point
) {

    const data =
        point.userData;


    document.getElementById(
        "pinCountry"
    ).textContent =
        data.country;


    document.getElementById(
        "pinTitle"
    ).textContent =
        data.title;


    const link =
        document.getElementById(
            "pinLink"
        );


    link.href =
        data.url ||
        "#";


    document.getElementById(
        "pin"
    ).style.display =
        "block";
}



//
// ============================================================
// BACK TO UNIVERSE
// ============================================================
//


document.getElementById(
    "backButton"
).addEventListener(
    "click",
    () => {

        mode =
            "galaxy";


        selectedPlanet =
            null;


        cameraAnimating =
            false;


        document.getElementById(
            "backButton"
        ).style.display =
            "none";


        document.getElementById(
            "pin"
        ).style.display =
            "none";


        document.getElementById(
            "instructions"
        ).textContent =
            "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


        //
        // Restore planets.
        //

        planets.forEach(
            planet => {

                planet.userData
                    .targetOpacity =

                    planet.userData
                        .project
                        .toUpperCase() ===
                    "UNGA81"

                        ? 0.92

                        : 0.75;
            }
        );


        //
        // Restore camera.
        //

        animateCameraTo(

            new THREE.Vector3(
                0,
                2,
                20
            ),

            new THREE.Vector3(
                0,
                0,
                0
            ),

            () => {}
        );
    }
);



//
// ============================================================
// PLANET FADE
// ============================================================
//


function updatePlanetOpacity() {

    planets.forEach(
        planet => {

            if (
                planet.material &&
                planet.material.transparent
            ) {

                const target =
                    planet.userData
                        .targetOpacity;


                planet.material.opacity +=

                    (
                        target -
                        planet.material.opacity
                    ) * 0.08;
            }
        }
    );
}



//
// ============================================================
// ANIMATION
// ============================================================
//


function animate() {

    requestAnimationFrame(
        animate
    );


    //
    // Slowly rotate the universe.
    //

    if (
        mode === "galaxy" &&
        !isDragging &&
        !cameraAnimating
    ) {

        galaxy.rotation.y +=
            0.0005;
    }


    //
    // Slowly rotate every planet.
    //

    planets.forEach(
        planet => {

            planet.rotation.y +=
                0.0007;
        }
    );


    //
    // Fade planets.
    //

    updatePlanetOpacity();


    //
    // Keep labels attached.
    //

    updateLabels();


    renderer.render(
        scene,
        camera
    );
}


animate();



//
// ============================================================
// RESIZE
// ============================================================
//


window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


</script>

</body>
