    x: 0,

const labels = [];

// ============================================================
// SIZE
// ============================================================


function sizeToRadius(size) {

    const sizes = {

        1: 0.9,

        2: 1.25,

        3: 1.7,

        4: 2.25,

        5: 3.0

    };


    return (
        sizes[Math.round(size)] ||
        1.7
    );
}


// ============================================================
// PROJECT COLOURS
// ============================================================


const projectColours = [

    0x35d07f,

    0xff405f,

    0xffc84a,

    0x5d8cff,

    0xc56cff,

    0x55d8d0,

    0xff8b4d,

    0xe8e8e8

];


// ============================================================
// CREATE PLANET
// ============================================================


function createProjectPlanet(

    project,
    size,
    colour,
    position,
    isUNGA

) {

    const radius =
        sizeToRadius(size);


    const geometry =
        new THREE.SphereGeometry(
            radius,
            64,
            64
        );


    let material;


    if (isUNGA) {

        material =
            new THREE.MeshPhongMaterial({

                map:
                    earthTexture,

                transparent:
                    true,

                opacity:
                    0.92,

                shininess:
                    10

            });

    } else {

        material =
            new THREE.MeshPhongMaterial({

                color:
                    colour,

                transparent:
                    true,

                opacity:
                    0.68,

                shininess:
                    20

            });
    }


    const planet =
        new THREE.Mesh(
            geometry,
            material
        );


    planet.position.copy(
        position
    );


    planet.userData = {

        project:
            project,

        size:
            size,

        colour:
            colour,

        targetOpacity:

            isUNGA
                ? 0.92
                : 0.68

    };


    galaxy.add(
        planet
    );


    planets.push(
        planet
    );


    // Outer holographic shell

    addHolographicShell(
        planet,
        radius,
        colour,
        isUNGA
    );


    // Earth clouds

    if (isUNGA) {

        addEarthClouds(
            planet,
            radius
        );


        addEarthGrid(
            planet,
            radius
        );
    }


    return planet;
}


// ============================================================
// HOLOGRAPHIC SHELL
// ============================================================


function addHolographicShell(

    planet,
    radius,
    colour,
    isEarth

) {

    const geometry =
        new THREE.SphereGeometry(
            radius * 1.035,
            32,
            32
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:

                isEarth
                    ? 0x66ccff
                    : colour,

            transparent:
                true,

            opacity:
                0.055,

            wireframe:
                true
        });


    const shell =
        new THREE.Mesh(
            geometry,
            material
        );


    shell.userData.isShell =
        true;


    planet.add(
        shell
    );
}


// ============================================================
// EARTH CLOUDS
// ============================================================


function addEarthClouds(
    earth,
    radius
) {

    const geometry =
        new THREE.SphereGeometry(
            radius * 1.015,
            64,
            64
        );


    const material =
        new THREE.MeshPhongMaterial({

            map:
                cloudTexture,

            transparent:
                true,

            opacity:
                0.30,

            depthWrite:
                false
        });


    const clouds =
        new THREE.Mesh(
            geometry,
            material
        );


    clouds.userData.isClouds =
        true;


    earth.add(
        clouds
    );
}


// ============================================================
// EARTH GRID
// ============================================================


function addEarthGrid(
    earth,
    radius
) {

    const gridGroup =
        new THREE.Group();


    earth.add(
        gridGroup
    );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0xffffff,

            transparent:
                true,

            opacity:
                0.07
        });


    // Latitude

    for (
        let lat = -80;
        lat <= 80;
        lat += 20
    ) {

        const points = [];


        const phi =
            THREE.MathUtils.degToRad(
                90 - lat
            );


        const y =
            radius *
            Math.cos(phi);


        const r =
            radius *
            Math.sin(phi);


        for (
            let lon = 0;
            lon <= 360;
            lon += 5
        ) {

            const theta =
                THREE.MathUtils.degToRad(
                    lon
                );


            points.push(

                new THREE.Vector3(

                    r *
                    Math.cos(theta),

                    y,

                    r *
                    Math.sin(theta)

                )

            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        gridGroup.add(

            new THREE.Line(
                geometry,
                material
            )

        );
    }


    // Longitude

    for (
        let lon = 0;
        lon < 360;
        lon += 20
    ) {

        const points = [];


        const theta =
            THREE.MathUtils.degToRad(
                lon
            );


        for (
            let lat = -90;
            lat <= 90;
            lat += 5
        ) {

            const phi =
                THREE.MathUtils.degToRad(
                    lat
                );


            points.push(

                new THREE.Vector3(

                    radius *
                    Math.cos(phi) *
                    Math.cos(theta),

                    radius *
                    Math.sin(phi),

                    radius *
                    Math.cos(phi) *
                    Math.sin(theta)

                )

            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        gridGroup.add(

            new THREE.Line(
                geometry,
                material
            )

        );
    }
}


// ============================================================
// PLANET LABEL
// ============================================================


function createPlanetLabel(
    planet,
    name
) {

    const label =
        document.createElement(
            "div"

// ============================================================
// UPDATE LABELS
// ============================================================


function updateLabels() {

    labels.forEach(
        item => {

            const worldPosition =
                new THREE.Vector3();


            item.object.getWorldPosition(
                worldPosition
            );


            const radius =
                item.object.geometry
                    .parameters.radius;


            // Put heading above planet

            worldPosition.y +=
                radius + 0.45;


            const projected =
                worldPosition.clone();


            projected.project(
                camera
            );


            const x =
                (
                    projected.x *
                    0.5 +
                    0.5
                ) *
                window.innerWidth;


            const y =
                (
                    -projected.y *
                    0.5 +
                    0.5
                ) *
                window.innerHeight;


            item.element.style.left =
                `${x}px`;


            item.element.style.top =
                `${y}px`;


            // ONLY show when hovering

            if (

                mode === "galaxy" &&

                hoveredPlanet ===
                    item.object &&

                projected.z <= 1

            ) {

                item.element.style.opacity =
                    "1";

            } else {

                item.element.style.opacity =
                    "0";
            }

        }
    );
}

// ============================================================
// CSV PARSER
// ============================================================


function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        const next =
            text[i + 1];


        if (

            char === '"' &&
            insideQuotes &&
            next === '"'

        ) {

            cell += '"';

            i++;

        }

        else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        }

        else if (

            char === "," &&
            !insideQuotes

        ) {

            row.push(
                cell
            );

            cell = "";

        }

        else if (

            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes

        ) {

            if (

                char === "\r" &&
                next === "\n"

            ) {

                i++;
            }


            row.push(
                cell
            );


            rows.push(
                row
            );


            row = [];

            cell = "";

        }

        else {

            cell += char;
        }
    }


    if (
        cell.length ||
        row.length
    ) {

        row.push(
            cell
        );


        rows.push(
            row
        );
    }


    if (
        rows.length === 0
    ) {

        return [];
    }


    const headers =
        rows[0].map(
            h =>
                h
                    .trim()
                    .toLowerCase()
        );


    return rows
        .slice(1)
        .filter(
            r =>
                r.length > 1
        )
        .map(
            r => {

                const obj = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {

                        obj[header] =
                            (
                                r[index] ||
                                ""
                            ).trim();

                    }
                );


                return obj;
            }
        );
}


// ============================================================
// LAT/LON → PLANET POSITION
// ============================================================


function latLonToVector3(

    lat,
    lon,
    radius

) {

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );


    const theta =
        THREE.MathUtils.degToRad(
            lon + 180
        );


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    return new THREE.Vector3(
        x,
        y,
        z
    );
}


// ============================================================
// RESEARCH HOOP
// ============================================================


function createResearchPin(
    row,
    radius
) {

    const group =
        new THREE.Group();


    group.userData = {

        type:
            "research",

        country:
            row.country,

        title:
            row.title,

        url:
            row.url ||
            row.URL,

        lat:
            parseFloat(row.lat),

        lon:
            parseFloat(row.long)

    };


    /*
        THE HOOP

        RingGeometry normally lies flat
        in the XY plane.

        Its normal therefore points along Z.

        We rotate that Z direction so that
        it points along the radius from the
        centre of the planet to the location.

        Therefore:

        - hoop plane = tangent to planet
        - hoop normal = planet radius
        - hoop sits flush against surface
    */


    const ringGeometry =
        new THREE.RingGeometry(
            radius * 0.025,
            radius * 0.042,
            32
        );


    const ringMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffffff,

            transparent:
                true,

            opacity:
                0.9,

            side:
                THREE.DoubleSide,

            depthWrite:
                false

        });


    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );


    group.add(
        ring
    );


    /*
        Store the radius direction.

        We cannot calculate this from
        group.position here because the group
        has not yet been positioned.

        So we calculate it from latitude
        and longitude instead.
    */


    const surfaceNormal =
        latLonToVector3(

            parseFloat(row.lat),

            parseFloat(row.long),

            1

        ).normalize();


    /*
        RingGeometry's face normal is +Z.

        Rotate +Z to the surface normal.
    */


    ring.quaternion.setFromUnitVectors(

        new THREE.Vector3(
            0,
            0,
            1
        ),

        surfaceNormal

    );


    /*
        Tiny offset so the ring doesn't
        mathematically disappear inside
        the planet due to z-fighting.
    */

    group.position.copy(

        surfaceNormal
            .clone()
            .multiplyScalar(
                radius * 1.012
            )

    );


    return group;
}


// ============================================================
// BUILD UNIVERSE FROM SPREADSHEET
// ============================================================


function buildUniverse(
    data
) {

    /*
        Group spreadsheet rows by project.
    */

    data.forEach(
        row => {

            if (
                !row.project
            ) {

                return;
            }


            const project =
                row.project.trim();


            if (
                !project
            ) {

                return;
            }


            if (
                !projectData[project]
            ) {

                projectData[project] =
                    [];
            }


            projectData[project].push(
                row
            );
        }
    );


    const projectNames =
        Object.keys(
            projectData
        );


    /*
        Create one planet per project.
    */

    projectNames.forEach(
        (
            project,
            index
        ) => {

            const rows =
                projectData[project];


            /*
                Size comes from spreadsheet.

                If there isn't a size yet,
                default to 3.
            */

            let size =
                parseFloat(
                    rows[0].size
                );


            if (
                !Number.isFinite(size)
            ) {

                size = 3;
            }


            size =
                THREE.MathUtils.clamp(

                    Math.round(size),

                    1,

                    5

                );


            const isUNGA =
                project
                    .toUpperCase() ===
                "UNGA81";


            /*
                Position planets.
            */

            let position;


            if (
                projectNames.length === 1
            ) {

                position =
                    new THREE.Vector3(
                        0,
                        0,
                        0
                    );

            } else {

                const angle =
                    index *
                    Math.PI *
                    2 /
                    projectNames.length;


                const distance =
                    6 +
                    (
                        index % 2
                    ) * 2;


                position =
                    new THREE.Vector3(

                        Math.cos(angle) *
                            distance,

                        (
                            index % 3 -
                            1
                        ) * 3,

                        Math.sin(angle) *
                            distance

                    );
            }


            const colour =
                projectColours[
                    index %
                    projectColours.length
                ];


            const planet =
                createProjectPlanet(

                    project,

                    size,

                    colour,

                    position,

                    isUNGA

                );


            planet.userData.rows =
                rows;


            createPlanetLabel(
                planet,
                project
            );


            /*
                Research points for this planet.
            */

            const pointsGroup =
                new THREE.Group();


            planet.add(
                pointsGroup
            );


            researchGroups[project] =
                pointsGroup;


            rows.forEach(
                row => {

                    const lat =
                        parseFloat(
                            row.lat
                        );


                    const lon =
                        parseFloat(
                            row.long
                        );


                    if (

                        !Number.isFinite(lat) ||
                        !Number.isFinite(lon)

                    ) {

                        return;
                    }


                    const pin =
                        createResearchPin(

                            row,

                            sizeToRadius(
                                size
                            )

                        );


                    pointsGroup.add(
                        pin
                    );
                }
            );
        }
    );
}

const DATA_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ23GJgYn3S8flelPGL3HDWtEOisQZJYHt6-Yt90P8mEYladNlO2N4xCEx9Zj03Z3GQNCNG0PihZYlN/pub?gid=0&single=true&output=csv";


fetch(
    DATA_URL
)

.then(
    response => {

        if (
            !response.ok
        ) {

            throw new Error(
                "Could not load spreadsheet"
            );
        }


        return response.text();
    }
)

.then(
    text => {

        const data =
            parseCSV(
                text
            );


        buildUniverse(
            data
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";
    }
)

.catch(
    error => {

        console.error(
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "RESEARCH DATA COULD NOT BE LOADED";
    }
);


// ============================================================
// MOUSE
// ============================================================


function getMouse(
    event
) {

    mouse.x =
        (
            event.clientX /
            window.innerWidth
        ) * 2 - 1;


    mouse.y =
        -(
            event.clientY /
            window.innerHeight
        ) * 2 + 1;
}


const mouse =
    new THREE.Vector2();


const raycaster =
    new THREE.Raycaster();


// ============================================================
// HOVER PLANETS
// ============================================================


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (
            isDragging
        ) {

            return;
        }


        getMouse(
            event
        );


        raycaster.setFromCamera(
            mouse,
            camera
        );


        if (
            mode === "galaxy"
        ) {

            const hits =
                raycaster.intersectObjects(
                    planets,
                    false
                );


            if (
                hits.length > 0
            ) {

                hoveredPlanet =
                    hits[0].object;

            } else {

                hoveredPlanet =
                    null;
            }
        }
    }
);


// ============================================================
// DRAG
// ============================================================


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        isDragging =
            false;


        previousMouse.x =
            event.clientX;


        previousMouse.y =
            event.clientY;


        pointerDownPosition.x =
            event.clientX;


        pointerDownPosition.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        const dx =
            event.clientX -
            pointerDownPosition.x;


        const dy =
            event.clientY -
            pointerDownPosition.y;


        if (
            Math.sqrt(
                dx * dx +
                dy * dy
            ) > 4
        ) {

            isDragging =
                true;
        }


        if (
            !isDragging ||
            cameraAnimating
        ) {

            return;
        }


        const deltaX =
            event.clientX -
            previousMouse.x;


        const deltaY =
            event.clientY -
            previousMouse.y;


        if (
            mode === "galaxy"
        ) {

            galaxy.rotation.y +=
                deltaX * 0.005;


            galaxy.rotation.x +=
                deltaY * 0.005;

        } else if (
            selectedPlanet
        ) {

            selectedPlanet.rotation.y +=
                deltaX * 0.005;


            selectedPlanet.rotation.x +=
                deltaY * 0.005;
        }


        previousMouse.x =
            event.clientX;


        previousMouse.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    () => {

        setTimeout(
            () => {

                isDragging =
                    false;

            },
            10
        );
    }
);


// ============================================================
// ZOOM
// ============================================================


renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (
            cameraAnimating
        ) {

            return;
        }


        camera.position.z +=
            event.deltaY * 0.01;


        if (
            mode === "galaxy"
        ) {

            camera.position.z =
                THREE.MathUtils.clamp(

                    camera.position.z,

                    8,

                    40

                );

        } else {

            camera.position.z =
                THREE.MathUtils.clamp(

                    camera.position.z,

                    3.5,

                    15

                );
        }

    },
    {
        passive: false
    }
);


// ============================================================
// CLICK
// ============================================================


renderer.domElement.addEventListener(
    "click",
    event => {

        if (
            isDragging
        ) {

            return;
        }


        getMouse(
            event
        );


        raycaster.setFromCamera(
            mouse,
            camera
        );


        /*
            GALAXY MODE

            IMPORTANT:

            Only planets are clickable.

            Research hoops are completely
            ignored here.
        */

        if (
            mode === "galaxy"
        ) {

            const hits =
                raycaster.intersectObjects(
                    planets,
                    false
                );


            if (
                hits.length > 0 &&
                !cameraAnimating
            ) {

                enterPlanet(
                    hits[0].object
                );
            }


            return;
        }


        /*
            PLANET MODE

            Now research hoops become
            clickable.
        */

        if (
            mode === "planet" &&
            selectedPlanet
        ) {

            const project =
                selectedPlanet
                    .userData
                    .project;


            const pointsGroup =
                researchGroups[
                    project
                ];


            if (
                !pointsGroup
            ) {

                return;
            }


            const hits =
                raycaster.intersectObjects(
                    pointsGroup.children,
                    true
                );


            if (
                hits.length > 0
            ) {

                let point =
                    hits[0].object;


                /*
                    Walk back up to the
                    research group.
                */

                while (

                    point.parent &&
                    !point.userData.type

                ) {

                    point =
                        point.parent;
                }


                if (
                    point.userData.type ===
                    "research"
                ) {

                    showResearchPin(
                        point
                    );
                }
            }
        }
    }
);


// ============================================================
// ENTER PLANET
// ============================================================


function enterPlanet(
    planet
) {

    selectedPlanet =
        planet;


    hoveredPlanet =
        null;


    mode =
        "planet";


    cameraAnimating =
        true;


    document.getElementById(
        "backButton"
    ).style.display =
        "block";


    document.getElementById(
        "instructions"
    ).textContent =
        "DRAG TO ROTATE · SCROLL TO ZOOM · SELECT A LOCATION";


    /*
        Hide all other planets.
    */

    planets.forEach(
        other => {

            if (
                other === planet
            ) {

                other.userData
                    .targetOpacity =

                    other.userData
                        .project
                        .toUpperCase() ===
                    "UNGA81"

                        ? 0.92
                        : 0.68;

            } else {

                other.userData
                    .targetOpacity =
                    0;
            }
        }
    );


    /*
        Get the planet's actual world
        position.
    */

    const worldPosition =
        new THREE.Vector3();


    planet.getWorldPosition(
        worldPosition
    );


    /*
        Camera direction.
    */

    const direction =
        new THREE.Vector3()
            .subVectors(

                camera.position,

                worldPosition

            )
            .normalize();


    const radius =
        planet.geometry
            .parameters.radius;


    const distance =
        radius * 2.7;


    const destination =
        worldPosition.clone()
            .add(

                direction.multiplyScalar(
                    distance
                )

            );


    animateCameraTo(

        destination,

        worldPosition,

        () => {

            cameraAnimating =
                false;
        }
    );
}


// ============================================================
// CAMERA ANIMATION
// ============================================================


function animateCameraTo(

    destination,
    target,
    callback

) {

    const startPosition =
        camera.position.clone();


    const startTime =
        performance.now();


    const duration =
        1600;


    function animateCamera() {

        const elapsed =
            performance.now() -
            startTime;


        let progress =
            elapsed /
            duration;


        progress =
            Math.min(
                progress,
                1
            );


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        camera.position.lerpVectors(

            startPosition,

            destination,

            eased

        );


        camera.lookAt(
            target
        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animateCamera
            );

        } else {

            callback();
        }
    }


    animateCamera();
}


// ============================================================
// SHOW RESEARCH CARD
// ============================================================


function showResearchPin(
    point
) {

    const data =
        point.userData;


    document.getElementById(
        "pinCountry"
    ).textContent =
        data.country;


    document.getElementById(
        "pinTitle"
    ).textContent =
        data.title;


    document.getElementById(
        "pinLink"
    ).href =
        data.url ||
        "#";


    document.getElementById(
        "pin"
    ).style.display =
        "block";
}


// ============================================================
// BACK TO GALAXY
// ============================================================


document.getElementById(
    "backButton"
).addEventListener(
    "click",
    () => {

        mode =
            "galaxy";


        selectedPlanet =
            null;


        hoveredPlanet =
            null;


        cameraAnimating =
            false;


        document.getElementById(
            "backButton"
        ).style.display =
            "none";


        document.getElementById(
            "pin"
        ).style.display =
            "none";


        document.getElementById(
            "instructions"
        ).textContent =
            "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


        /*
            Restore all planets.
        */

        planets.forEach(
            planet => {

                planet.userData
                    .targetOpacity =

                    planet.userData
                        .project
                        .toUpperCase() ===
                    "UNGA81"

                        ? 0.92
                        : 0.68;
            }
        );


        animateCameraTo(

            new THREE.Vector3(
                0,
                2,
                20
            ),

            new THREE.Vector3(
                0,
                0,
                0
            ),

            () => {}
        );
    }
);


// ============================================================
// PLANET OPACITY
// ============================================================


function updatePlanetOpacity() {

    planets.forEach(
        planet => {

            if (
                planet.material &&
                planet.material.transparent
            ) {

                const target =
                    planet.userData
                        .targetOpacity;


                planet.material.opacity +=

                    (
                        target -
                        planet.material.opacity
                    ) * 0.08;
            }
        }
    );
}


// ============================================================
// ANIMATION
// ============================================================


function animate() {

    requestAnimationFrame(
        animate
    );


    /*
        Slowly rotate galaxy.
    */

    if (

        mode === "galaxy" &&
        !isDragging &&
        !cameraAnimating

    ) {

        galaxy.rotation.y +=
            0.0005;
    }


    /*
        Slowly rotate planets.
    */

    planets.forEach(
        planet => {

            planet.rotation.y +=
                0.0007;


            /*
                Clouds rotate slightly
                faster than Earth.
            */

            planet.children.forEach(
                child => {

                    if (
                        child.userData
                            .isClouds
                    ) {

                        child.rotation.y +=
                            0.0012;
                    }
                }
            );
        }
    );


    updatePlanetOpacity();

    updateLabels();


    renderer.render(
        scene,
        camera
    );
}


animate();


// ============================================================
// RESIZE
// ============================================================


window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );
    }
);

</script>
