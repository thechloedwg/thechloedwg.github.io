<body>

<div id="container"></div>

<div id="title">CHLOE DWG — RESEARCH UNIVERSE</div>

<div id="instructions">
    DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD
</div>

<button id="backButton">← BACK TO UNIVERSE</button>

<div id="pin">
    <div id="pinCountry"></div>
    <div id="pinTitle"></div>
    <a id="pinLink" href="#" target="_blank">
        READ THE FULL ANALYSIS →
    </a>
</div>

<div id="loading">LOADING RESEARCH UNIVERSE</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

//
// ------------------------------------------------------------
// BASIC SETUP
// ------------------------------------------------------------
//

const container = document.getElementById("container");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 2, 20);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

container.appendChild(renderer.domElement);


//
// ------------------------------------------------------------
// GALAXY GROUP
// ------------------------------------------------------------
//

const galaxy = new THREE.Group();

scene.add(galaxy);


//
// ------------------------------------------------------------
// LIGHT
// ------------------------------------------------------------
//

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.7
);

scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

directionalLight.position.set(
    5,
    8,
    10
);

scene.add(directionalLight);


//
// ------------------------------------------------------------
// TEXTURE LOADER
// ------------------------------------------------------------
//

const textureLoader = new THREE.TextureLoader();

const earthTexture = textureLoader.load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);


//
// ------------------------------------------------------------
// EARTH
// ------------------------------------------------------------
//

const earthGeometry = new THREE.SphereGeometry(
    3,
    64,
    64
);

const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture,
    transparent: true,
    opacity: 0.92
});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

earth.position.set(
    0,
    0,
    0
);

earth.userData.name = "UNGA81";

galaxy.add(earth);


//
// ------------------------------------------------------------
// EARTH ATMOSPHERE
// ------------------------------------------------------------
//

const atmosphereGeometry =
    new THREE.SphereGeometry(
        3.12,
        64,
        64
    );

const atmosphereMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x66ccff,
        transparent: true,
        opacity: 0.08,
        side: THREE.BackSide
    });

const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

earth.add(atmosphere);


//
// ------------------------------------------------------------
// LAT/LONG GRID
// ------------------------------------------------------------
//

const gridGroup = new THREE.Group();

earth.add(gridGroup);

const gridMaterial =
    new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.08
    });


//
// Latitude lines
//

for (let lat = -80; lat <= 80; lat += 20) {

    const points = [];

    const radius = 3.025;

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );

    const y =
        radius * Math.cos(phi);

    const r =
        radius * Math.sin(phi);

    for (
        let lon = 0;
        lon <= 360;
        lon += 5
    ) {

        const theta =
            THREE.MathUtils.degToRad(lon);

        points.push(
            new THREE.Vector3(
                r * Math.cos(theta),
                y,
                r * Math.sin(theta)
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const line =
        new THREE.Line(
            geometry,
            gridMaterial
        );

    gridGroup.add(line);
}


//
// Longitude lines
//

for (let lon = 0; lon < 360; lon += 20) {

    const points = [];

    const theta =
        THREE.MathUtils.degToRad(lon);

    for (
        let lat = -90;
        lat <= 90;
        lat += 5
    ) {

        const phi =
            THREE.MathUtils.degToRad(lat);

        const radius = 3.025;

        const x =
            radius *
            Math.cos(phi) *
            Math.cos(theta);

        const y =
            radius *
            Math.sin(phi);

        const z =
            radius *
            Math.cos(phi) *
            Math.sin(theta);

        points.push(
            new THREE.Vector3(
                x,
                y,
                z
            )
        );
    }

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const line =
        new THREE.Line(
            geometry,
            gridMaterial
        );

    gridGroup.add(line);
}


//
// ------------------------------------------------------------
// OTHER RESEARCH PLANETS
// ------------------------------------------------------------
//

function createPlanet(
    name,
    position,
    color,
    size = 2
) {

    const geometry =
        new THREE.SphereGeometry(
            size,
            48,
            48
        );

    const material =
        new THREE.MeshPhongMaterial({
            color: color,
            transparent: true,
            opacity: 0.75
        });

    const planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.position.copy(position);

    planet.userData.name = name;

    galaxy.add(planet);

    return planet;
}


const copPlanet =
    createPlanet(
        "COP",
        new THREE.Vector3(
            -7,
            3,
            -4
        ),
        0x35d07f,
        1.7
    );


const refugeePlanet =
    createPlanet(
        "REFUGEE",
        new THREE.Vector3(
            7,
            -2,
            -5
        ),
        0xff405f,
        1.8
    );


const futurePlanet =
    createPlanet(
        "FUTURE",
        new THREE.Vector3(
            -4,
            -5,
            -7
        ),
        0xffc84a,
        1.5
    );


const planets = [
    earth,
    copPlanet,
    refugeePlanet,
    futurePlanet
];


//
// ------------------------------------------------------------
// PLANET LABELS
// ------------------------------------------------------------
//

const labels = [];

function createPlanetLabel(
    planet,
    name
) {

    const label =
        document.createElement("div");

    label.className =
        "planet-label";

    label.textContent =
        name;

    document.body.appendChild(
        label
    );

    labels.push({
        element: label,
        object: planet
    });
}


createPlanetLabel(
    earth,
    "UNGA 81"
);

createPlanetLabel(
    copPlanet,
    "COP"
);

createPlanetLabel(
    refugeePlanet,
    "REFUGEE CAMPS"
);

createPlanetLabel(
    futurePlanet,
    "FUTURE RESEARCH"
);


//
// ------------------------------------------------------------
// LABEL POSITIONING
// ------------------------------------------------------------
//

function updateLabels() {

    labels.forEach(item => {

        const worldPosition =
            new THREE.Vector3();

        item.object.getWorldPosition(
            worldPosition
        );

        //
        // Put the label above
        // the actual planet.
        //

        const offset =
            item.object === earth
                ? 3.7
                : item.object.geometry.parameters.radius + 0.7;

        worldPosition.y += offset;

        worldPosition.project(
            camera
        );

        const x =
            (worldPosition.x * 0.5 + 0.5)
            * window.innerWidth;

        const y =
            (-worldPosition.y * 0.5 + 0.5)
            * window.innerHeight;

        item.element.style.left =
            `${x}px`;

        item.element.style.top =
            `${y}px`;

        //
        // Hide labels when they are
        // behind the camera.
        //

        if (worldPosition.z > 1) {

            item.element.style.opacity =
                "0";

        } else {

            //
            // In planet mode only show
            // the selected planet label.
            //

            if (
                mode === "planet" &&
                item.object !== selectedPlanet
            ) {

                item.element.style.opacity =
                    "0";

            } else {

                item.element.style.opacity =
                    "1";
            }
        }
    });
}


//
// ------------------------------------------------------------
// STARS
// ------------------------------------------------------------
//

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 5000; i++) {

    starPositions.push(
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.08,
        transparent: true,
        opacity: 0.6
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


//
// ------------------------------------------------------------
// CSV DATA
// ------------------------------------------------------------
//

const DATA_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ23GJgYn3S8flelPGL3HDWtEOisQZJYHt6-Yt90P8mEYladNlO2N4xCEx9Zj03Z3GQNCNG0PihZYlN/pub?gid=0&single=true&output=csv";


let researchData = [];

const researchPoints =
    new THREE.Group();

earth.add(
    researchPoints
);


//
// ------------------------------------------------------------
// CSV PARSER
// ------------------------------------------------------------
//

function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];

        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            cell += '"';

            i++;

        } else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(cell);

            cell = "";

        } else if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {
                i++;
            }

            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

        } else {

            cell += char;
        }
    }

    if (
        cell.length ||
        row.length
    ) {

        row.push(cell);

        rows.push(row);
    }

    if (
        rows.length === 0
    ) {
        return [];
    }

    const headers =
        rows[0].map(
            h => h.trim().toLowerCase()
        );

    return rows
        .slice(1)
        .filter(
            r => r.length > 1
        )
        .map(r => {

            const obj = {};

            headers.forEach(
                (header, index) => {

                    obj[header] =
                        (r[index] || "").trim();
                }
            );

            return obj;
        });
}


//
// ------------------------------------------------------------
// LAT/LON → 3D
// ------------------------------------------------------------
//

function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );

    const theta =
        THREE.MathUtils.degToRad(
            lon + 180
        );

    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.cos(phi);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    return new THREE.Vector3(
        x,
        y,
        z
    );
}


//
// ------------------------------------------------------------
// CREATE RESEARCH POINTS
// ------------------------------------------------------------
//

function createResearchPoints(
    data
) {

    researchPoints.clear();

    researchData =
        data.filter(row => {

            return (
                row.project &&
                row.project.toUpperCase() ===
                    "UNGA81" &&

                row.country &&

                row.lat &&

                row.long
            );
        });


    researchData.forEach(
        (item, index) => {

            const lat =
                parseFloat(item.lat);

            const lon =
                parseFloat(item.long);

            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lon)
            ) {
                return;
            }


            const geometry =
                new THREE.SphereGeometry(
                    0.065,
                    16,
                    16
                );


            const material =
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.25
                });


            const point =
                new THREE.Mesh(
                    geometry,
                    material
                );


            point.position.copy(
                latLonToVector3(
                    lat,
                    lon,
                    3.08
                )
            );


            point.userData = {

                type: "research",

                country:
                    item.country,

                title:
                    item.title,

                url:
                    item.url || item.URL,

                lat:
                    lat,

                lon:
                    lon
            };


            researchPoints.add(
                point
            );
        }
    );
}


//
// ------------------------------------------------------------
// LOAD SPREADSHEET
// ------------------------------------------------------------
//

fetch(DATA_URL)
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Could not load spreadsheet"
            );
        }

        return response.text();
    })

    .then(text => {

        const data =
            parseCSV(text);

        createResearchPoints(
            data
        );

        document.getElementById(
            "loading"
        ).style.display =
            "none";
    })

    .catch(error => {

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "RESEARCH DATA COULD NOT BE LOADED";
    });


//
// ------------------------------------------------------------
// INTERACTION STATE
// ------------------------------------------------------------
//

let mode =
    "galaxy";

let selectedPlanet =
    null;

let cameraAnimating =
    false;


//
// ------------------------------------------------------------
// DRAGGING
// ------------------------------------------------------------
//

let isDragging =
    false;

let previousMouse =
    {
        x: 0,
        y: 0
    };


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        isDragging =
            true;

        previousMouse.x =
            event.clientX;

        previousMouse.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (!isDragging) {
            return;
        }

        const deltaX =
            event.clientX -
            previousMouse.x;

        const deltaY =
            event.clientY -
            previousMouse.y;


        if (
            mode === "galaxy"
        ) {

            galaxy.rotation.y +=
                deltaX * 0.005;

            galaxy.rotation.x +=
                deltaY * 0.005;

        } else {

            //
            // In planet mode rotate
            // the selected planet.
            //

            if (
                selectedPlanet
            ) {

                selectedPlanet.rotation.y +=
                    deltaX * 0.005;

                selectedPlanet.rotation.x +=
                    deltaY * 0.005;
            }
        }


        previousMouse.x =
            event.clientX;

        previousMouse.y =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    () => {

        isDragging =
            false;
    }
);


renderer.domElement.addEventListener(
    "pointerleave",
    () => {

        isDragging =
            false;
    }
);


//
// ------------------------------------------------------------
// ZOOM
// ------------------------------------------------------------
//

renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        if (
            cameraAnimating
        ) {
            return;
        }

        camera.position.z +=
            event.deltaY * 0.01;


        if (
            mode === "galaxy"
        ) {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    8,
                    40
                );

        } else {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    3.8,
                    15
                );
        }
    },
    {
        passive: false
    }
);


//
// ------------------------------------------------------------
// RAYCASTING
// ------------------------------------------------------------
//

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


function getMouse(event) {

    mouse.x =
        (event.clientX /
            window.innerWidth) *
            2 - 1;

    mouse.y =
        -(event.clientY /
            window.innerHeight) *
            2 + 1;
}


//
// ------------------------------------------------------------
// CLICK
// ------------------------------------------------------------
//

renderer.domElement.addEventListener(
    "click",
    event => {

        //
        // GALAXY MODE
        //

        if (
            mode === "galaxy"
        ) {

            getMouse(event);

            raycaster.setFromCamera(
                mouse,
                camera
            );


            //
            // IMPORTANT:
            // Only planets are clickable.
            // Research points are ignored.
            //

            const objects = [
                earth,
                copPlanet,
                refugeePlanet,
                futurePlanet
            ];


            const hits =
                raycaster.intersectObjects(
                    objects,
                    false
                );


            if (
                hits.length > 0 &&
                !cameraAnimating
            ) {

                enterPlanet(
                    hits[0].object
                );
            }

            return;
        }


        //
        // PLANET MODE
        //

        if (
            mode === "planet"
        ) {

            getMouse(event);

            raycaster.setFromCamera(
                mouse,
                camera
            );


            const hits =
                raycaster.intersectObjects(
                    researchPoints.children,
                    false
                );


            if (
                hits.length > 0
            ) {

                showResearchPin(
                    hits[0].object
                );
            }
        }
    }
);


//
// ------------------------------------------------------------
// ENTER PLANET
// ------------------------------------------------------------
//

function enterPlanet(
    planet
) {

    selectedPlanet =
        planet;

    mode =
        "planet";

    cameraAnimating =
        true;


    document.getElementById(
        "backButton"
    ).style.display =
        "block";


    document.getElementById(
        "instructions"
    ).textContent =
        "DRAG TO ROTATE · SCROLL TO ZOOM · SELECT A LOCATION";


    //
    // Hide the other planets.
    //

    planets.forEach(
        otherPlanet => {

            if (
                otherPlanet !==
                selectedPlanet
            ) {

                otherPlanet.userData.targetOpacity =
                    0;

            } else {

                otherPlanet.userData.targetOpacity =
                    otherPlanet === earth
                        ? 0.92
                        : 0.75;
            }
        }
    );


    //
    // Hide the other planet labels.
    //

    labels.forEach(
        item => {

            if (
                item.object !==
                selectedPlanet
            ) {

                item.element.style.opacity =
                    "0";
            }
        }
    );


    //
    // Calculate the planet's
    // current WORLD position.
    //

    const planetWorldPosition =
        new THREE.Vector3();

    selectedPlanet.getWorldPosition(
        planetWorldPosition
    );


    //
    // Camera should move toward
    // the planet from the direction
    // of the current camera.
    //

    const direction =
        new THREE.Vector3()
            .subVectors(
                camera.position,
                planetWorldPosition
            )
            .normalize();


    //
    // Distance from planet.
    //

    const distance =
        selectedPlanet === earth
            ? 9
            : 6;


    const destination =
        planetWorldPosition.clone()
            .add(
                direction.multiplyScalar(
                    distance
                )
            );


    animateCameraTo(
        destination,
        planetWorldPosition,
        () => {

            cameraAnimating =
                false;

            //
            // Make research points
            // visible once we've arrived.
            //

            if (
                selectedPlanet === earth
            ) {

                researchPoints.children
                    .forEach(point => {

                        point.material.opacity =
                            0.9;
                    });
            }
        }
    );
}


//
// ------------------------------------------------------------
// CAMERA ANIMATION
// ------------------------------------------------------------
//

function animateCameraTo(
    destination,
    target,
    callback
) {

    const startPosition =
        camera.position.clone();

    const startTime =
        performance.now();

    const duration =
        1600;


    function animateCamera() {

        const elapsed =
            performance.now() -
            startTime;

        let progress =
            elapsed / duration;


        progress =
            Math.min(
                progress,
                1
            );


        //
        // Smooth easing.
        //

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        camera.position.lerpVectors(
            startPosition,
            destination,
            eased
        );


        camera.lookAt(
            target
        );


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animateCamera
            );

        } else {

            callback();
        }
    }


    animateCamera();
}


//
// ------------------------------------------------------------
// RESEARCH PIN
// ------------------------------------------------------------
//

function showResearchPin(
    point
) {

    const data =
        point.userData;


    document.getElementById(
        "pinCountry"
    ).textContent =
        data.country;


    document.getElementById(
        "pinTitle"
    ).textContent =
        data.title;


    const link =
        document.getElementById(
            "pinLink"
        );


    link.href =
        data.url || "#";


    document.getElementById(
        "pin"
    ).style.display =
        "block";
}


//
// ------------------------------------------------------------
// BACK TO GALAXY
// ------------------------------------------------------------
//

document.getElementById(
    "backButton"
).addEventListener(
    "click",
    () => {

        mode =
            "galaxy";

        selectedPlanet =
            null;

        cameraAnimating =
            false;


        document.getElementById(
            "backButton"
        ).style.display =
            "none";


        document.getElementById(
            "pin"
        ).style.display =
            "none";


        document.getElementById(
            "instructions"
        ).textContent =
            "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


        //
        // Restore all planets.
        //

        planets.forEach(
            planet => {

                planet.userData.targetOpacity =
                    planet === earth
                        ? 0.92
                        : 0.75;
            }
        );


        //
        // Restore labels.
        //

        labels.forEach(
            item => {

                item.element.style.opacity =
                    "1";
            }
        );


        //
        // Return camera.
        //

        animateCameraTo(
            new THREE.Vector3(
                0,
                2,
                20
            ),
            new THREE.Vector3(
                0,
                0,
                0
            ),
            () => {}
        );
    }
);


//
// ------------------------------------------------------------
// PLANET FADE SYSTEM
// ------------------------------------------------------------
//

planets.forEach(
    planet => {

        planet.userData.targetOpacity =
            planet === earth
                ? 0.92
                : 0.75;
    }
);


function updatePlanetOpacity() {

    planets.forEach(
        planet => {

            if (
                planet.material &&
                planet.material.transparent
            ) {

                const target =
                    planet.userData
                        .targetOpacity;

                planet.material.opacity +=
                    (
                        target -
                        planet.material.opacity
                    ) * 0.08;
            }
        }
    );
}


//
// ------------------------------------------------------------
// ANIMATION
// ------------------------------------------------------------
//

function animate() {

    requestAnimationFrame(
        animate
    );


    //
    // Slow galaxy movement.
    //

    if (
        mode === "galaxy" &&
        !isDragging &&
        !cameraAnimating
    ) {

        galaxy.rotation.y +=
            0.0005;
    }


    //
    // Slow planet rotation.
    //

    earth.rotation.y +=
        0.0008;


    copPlanet.rotation.y +=
        0.0006;


    refugeePlanet.rotation.y +=
        0.0007;


    futurePlanet.rotation.y +=
        0.0005;


    //
    // Fade planets.
    //

    updatePlanetOpacity();


    //
    // Update labels using
    // WORLD coordinates.
    //

    updateLabels();


    renderer.render(
        scene,
        camera
    );
}


animate();


//
// ------------------------------------------------------------
// RESIZE
// ------------------------------------------------------------
//

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>
