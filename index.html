<div id="app"></div>

</div>

<div id="error"></div>


<!-- =======================================================
     GALAXY INTERFACE

<div id="galaxy-ui">

    <div id="site-title"></div>

<!-- =======================================================
     THREE.JS
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>


<script>

/* =========================================================
   GOOGLE SHEETS
   =========================================================

   MARKERS
   gid = 874912780

   PLANETS
   gid = 603501729

   The remaining sheet tabs will be added once their GIDs
   are known.
   ========================================================= */


const SHEET_ID =
    "2PACX-1vQ23GJgYn3S8flelPGL3HDWtEOisQZJYHt6-Yt90P8mEYladNlO2N4xCEx9Zj03Z3GQNCNG0PihZYlN";


const MARKERS_CSV =
    "https://docs.google.com/spreadsheets/d/e/" +
    SHEET_ID +
    "/pub?gid=874912780&single=true&output=csv";


const PLANETS_CSV =
    "https://docs.google.com/spreadsheets/d/e/" +
    SHEET_ID +
    "/pub?gid=603501729&single=true&output=csv";


/*
   We will add:

   GLOBAL_CSV
   INTERFACE_CSV
   LISTS_CSV

   once we have their Google Sheet GIDs.
*/


/* =========================================================
   DATA
   ========================================================= */

let globalData = {};
let interfaceData = {};
let listsData = {};

let planetData = [];
let markerData = [];


/* =========================================================
   THREE.JS
   ========================================================= */

let scene;
let camera;
let renderer;

let galaxyGroup;
let planetGroup;

let raycaster;
let mouse;

let selectedPlanet = null;
let selectedPlanetData = null;

let planetView = false;


/* =========================================================
   CAMERA
   ========================================================= */

let galaxyCameraPosition = new THREE.Vector3();
let planetCameraPosition = new THREE.Vector3();

let targetCameraPosition = new THREE.Vector3();

let cameraMode = "galaxy";


/* =========================================================
   INTERACTION
   ========================================================= */

let isDragging = false;
let previousMouse = {
    x: 0,
    y: 0
};


/* =========================================================
   HELPERS
   ========================================================= */

function normaliseHeader(header) {

    return String(header || "")
        .trim()
        .toLowerCase()
        .replace(/[\s\-]+/g, "_")
        .replace(/[^a-z0-9_]/g, "");

}


function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        if (char === '"') {

            if (
                insideQuotes &&
                text[i + 1] === '"'
            ) {

                cell += '"';
                i++;

            } else {

                insideQuotes = !insideQuotes;

            }

        } else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(cell);
            cell = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && text[i + 1] === "\n") {
                i++;
            }

            row.push(cell);
            rows.push(row);

            row = [];
            cell = "";

        } else {

            cell += char;

        }

    }

    if (cell.length || row.length) {

        row.push(cell);
        rows.push(row);

    }


    if (!rows.length) {
        return [];
    }


    const headers =
        rows[0].map(normaliseHeader);


    return rows
        .slice(1)
        .filter(row =>
            row.some(value =>
                String(value || "").trim() !== ""
            )
        )
        .map(row => {

            const object = {};

            headers.forEach((header, index) => {

                object[header] =
                    String(row[index] ?? "").trim();

            });

            return object;

        });

}


/* =========================================================
   VALUE HELPERS
   ========================================================= */

function number(value, fallback = 0) {

    const n = parseFloat(value);

    return Number.isFinite(n)
        ? n
        : fallback;

}


function bool(value, fallback = false) {

    const v =
        String(value ?? "")
            .trim()
            .toLowerCase();

    if ([
        "yes",
        "true",
        "1",
        "on"
    ].includes(v)) {

        return true;

    }

    if ([
        "no",
        "false",
        "0",
        "off"
    ].includes(v)) {

        return false;

    }

    return fallback;

}


function getSetting(name, fallback = "") {

    return globalData[name] ?? fallback;

}


function getInterface(key, fallback = "") {

    return interfaceData[key] ?? fallback;

}


/* =========================================================
   GOOGLE SHEETS LOADING
   ========================================================= */

async function loadCSV(url, name) {

    console.log("Loading:", name);

    const response = await fetch(
        url + "&cache=" + Date.now()
    );

    console.log(
        name,
        response.status,
        response.statusText
    );

    if (!response.ok) {

        throw new Error(
            `${name} sheet failed: ${response.status} ${response.statusText}`
        );

    }

    const text = await response.text();

    console.log(
        `${name} response:`,
        text.substring(0, 300)
    );


    if (
        text.trim().startsWith("<!DOCTYPE") ||
        text.trim().startsWith("<html")
    ) {

        throw new Error(
            `${name} returned HTML instead of CSV. Check that the sheet is published.`
        );

    }


    const data = parseCSV(text);

    console.log(
        `${name} rows:`,
        data.length
    );

    return data;

}


/* =========================================================
   LOAD ALL DATA
   ========================================================= */

async function loadData() {

    const loading =
        document.getElementById("loading");

    try {

        loading.textContent =
            "Loading planets";


        planetData =
            await loadCSV(
                PLANETS_CSV,
                "PLANETS"
            );


        loading.textContent =
            "Loading markers";


        markerData =
            await loadCSV(
                MARKERS_CSV,
                "MARKERS"
            );


        /*
           GLOBAL / INTERFACE / LISTS will be
           loaded here once their GIDs are added.
        */


        if (!planetData.length) {

            throw new Error(
                "PLANETS sheet contains no rows."
            );

        }


        buildUniverse();


        loading.classList.add("hidden");


        console.log(
            "Research universe loaded successfully."
        );

    } catch (error) {

        console.error(
            "RESEARCH UNIVERSE ERROR:",
            error
        );

        showError(error.message);

    }

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        "RESEARCH UNIVERSE ERROR\n\n" +
        message;

    error.classList.add("visible");

    document.getElementById(
        "loading"
    ).classList.add("hidden");

}


/* =========================================================
   INITIALISE THREE.JS
   ========================================================= */

function initialiseThree() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            getSetting(
                "background_colour",
                "#000000"
            )
        );


    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );


    camera.position.set(
        0,
        0,
        number(
            getSetting(
                "galaxy_camera_distance",
                20
            ),
            20
        )
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document
        .getElementById("app")
        .appendChild(renderer.domElement);


    galaxyGroup =
        new THREE.Group();


    planetGroup =
        new THREE.Group();


    galaxyGroup.add(
        planetGroup
    );


    scene.add(
        galaxyGroup
    );


    raycaster =
        new THREE.Raycaster();


    mouse =
        new THREE.Vector2();


    window.addEventListener(
        "resize",
        onResize
    );


    renderer.domElement.addEventListener(
        "pointerdown",
        onPointerDown
    );


    renderer.domElement.addEventListener(
        "pointermove",
        onPointerMove
    );


    renderer.domElement.addEventListener(
        "pointerup",
        onPointerUp
    );


    renderer.domElement.addEventListener(
        "click",
        onClick
    );


    document
        .getElementById("back-button")
        .addEventListener(
            "click",
            returnToGalaxy
        );

}


/* =========================================================
   BUILD UNIVERSE
   ========================================================= */

function buildUniverse() {

    initialiseThree();

    buildStars();

    buildPlanets();

    updateGalaxyInterface();

    animate();

}


/* =========================================================
   STARS
   ========================================================= */

function buildStars() {

    const density =
        Math.max(
            0,
            number(
                getSetting(
                    "star_density",
                    1000
                ),
                1000
            )
        );


    const size =
        number(
            getSetting(
                "star_size",
                1
            ),
            1
        );


    const geometry =
        new THREE.BufferGeometry();


    const positions =
        new Float32Array(
            density * 3
        );


    for (
        let i = 0;
        i < density;
        i++
    ) {

        positions[i * 3] =
            (Math.random() - 0.5) * 100;

        positions[i * 3 + 1] =
            (Math.random() - 0.5) * 100;

        positions[i * 3 + 2] =
            (Math.random() - 0.5) * 100;

    }


    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({
            color: 0xffffff,
            size: size,
            sizeAttenuation: true
        });


    const stars =
        new THREE.Points(
            geometry,
            material
        );


    galaxyGroup.add(
        stars
    );

}


/* =========================================================
   BUILD PLANETS
   ========================================================= */

function buildPlanets() {

    planetGroup.clear();


    const enabledPlanets =
        planetData
            .filter(row =>
                bool(row.enabled, true)
            )
            .sort((a, b) =>
                number(a.order) -
                number(b.order)
            );


    enabledPlanets.forEach(
        planet => {

            const object =
                createPlanet(
                    planet
                );

            planetGroup.add(
                object
            );

        }
    );

}


/* =========================================================
   CREATE PLANET
   ========================================================= */

function createPlanet(data) {

    const group =
        new THREE.Group();


    group.userData.type =
        "planet";


    group.userData.data =
        data;


    const size =
        number(
            data.size,
            2
        );


    const geometry =
        new THREE.SphereGeometry(
            size,
            64,
            64
        );


    const materialSettings = {

        color:
            new THREE.Color(
                data.colour ||
                "#ffffff"
            ),

        transparent:
            number(
                data.surface_opacity,
                1
            ) < 1,

        opacity:
            number(
                data.surface_opacity,
                1
            ),

        roughness: 1

    };


    /*
       Texture
    */

    if (
        data.surface_texture_url
    ) {

        const loader =
            new THREE.TextureLoader();


        materialSettings.map =
            loader.load(
                data.surface_texture_url,
                texture => {

                    texture.anisotropy =
                        renderer.capabilities
                            .getMaxAnisotropy();

                },
                undefined,
                error => {

                    console.warn(
                        "Could not load planet texture:",
                        error
                    );

                }
            );

    }


    const material =
        new THREE.MeshStandardMaterial(
            materialSettings
        );


    const sphere =
        new THREE.Mesh(
            geometry,
            material
        );


    sphere.userData.type =
        "planet";

    sphere.userData.data =
        data;


    group.add(
        sphere
    );


    /*
       Basic lighting
    */

    const light =
        new THREE.PointLight(
            0xffffff,
            2,
            100
        );


    light.position.set(
        10,
        10,
        10
    );


    group.add(
        light
    );


    /*
       Position from spreadsheet
    */

    group.position.set(

        number(data.galaxy_x),

        number(data.galaxy_y),

        number(data.galaxy_z)

    );


    /*
       Planet name
    */

    const label =
        createPlanetLabel(
            data.name ||
            data.project ||
            ""
        );


    label.position.set(
        0,
        size + 0.5,
        0
    );


    group.add(
        label
    );


    /*
       Markers belonging to this planet
    */

    const markers =
        markerData.filter(
            marker =>
                marker.project ===
                data.project
        );


    markers.forEach(
        marker => {

            const pin =
                createMarker(
                    marker,
                    data,
                    size
                );

            sphere.add(
                pin
            );

        }
    );


    return group;

}


/* =========================================================
   PLANET LABEL
   ========================================================= */

function createPlanetLabel(text) {

    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext("2d");


    canvas.width = 512;
    canvas.height = 128;


    context.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    context.fillStyle =
        "#ffffff";


    context.font =
        "28px Arial";


    context.textAlign =
        "center";


    context.textBaseline =
        "middle";


    context.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        4,
        1,
        1
    );


    sprite.userData.type =
        "planet-label";


    return sprite;

}


/* =========================================================
   CREATE MARKER
   ========================================================= */

function createMarker(
    marker,
    planet,
    planetRadius
) {

    const size =
        number(
            getSetting(
                "marker_size",
                0.12
            ),
            0.12
        );


    const colour =
        planet.colour ||
        "#ffffff";


    const lat =
        number(
            marker.lat
        );


    const lon =
        number(
            marker.long
        );


    const phi =
        (90 - lat) *
        Math.PI /
        180;


    const theta =
        (lon + 180) *
        Math.PI /
        180;


    const radius =
        planetRadius *
        1.015;


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    const markerObject =
        createPointStyle(
            planet.point_style ||
            "dot",
            size,
            colour
        );


    markerObject.position.set(
        x,
        y,
        z
    );


    markerObject.userData.type =
        "marker";


    markerObject.userData.data =
        marker;


    markerObject.userData.project =
        marker.project;


    return markerObject;

}


/* =========================================================
   MARKER STYLE
   ========================================================= */

function createPointStyle(
    style,
    size,
    colour
) {

    const group =
        new THREE.Group();


    const material =
        new THREE.MeshBasicMaterial({
            color:
                new THREE.Color(
                    colour
                )
        });


    if (style === "crosshair") {

        const horizontal =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    size * 4,
                    size * 0.3,
                    size * 0.3
                ),
                material
            );


        const vertical =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    size * 0.3,
                    size * 4,
                    size * 0.3
                ),
                material
            );


        group.add(
            horizontal
        );

        group.add(
            vertical
        );

    } else {

        const geometry =
            new THREE.SphereGeometry(
                size,
                12,
                12
            );


        const dot =
            new THREE.Mesh(
                geometry,
                material
            );


        group.add(
            dot
        );

    }


    return group;

}


/* =========================================================
   INTERFACE
   ========================================================= */

function updateGalaxyInterface() {

    document.getElementById(
        "site-title"
    ).textContent =
        getInterface(
            "site_title",
            "RESEARCH UNIVERSE"
        );


    document.getElementById(
        "galaxy-instruction"
    ).textContent =
        getInterface(
            "galaxy_instruction",
            "DRAG TO EXPLORE · CLICK A WORLD"
        );


    document.getElementById(
        "back-button"
    ).textContent =
        getInterface(
            "back_button",
            "RETURN TO UNIVERSE"
        );

}


/* =========================================================
   ENTER PLANET
   ========================================================= */

function enterPlanet(
    planetObject
) {

    selectedPlanet =
        planetObject;


    selectedPlanetData =
        planetObject.userData.data;


    planetView =
        true;


    cameraMode =
        "planet";


    document
        .getElementById(
            "planet-ui"
        )
        .classList.add(
            "visible"
        );


    document.getElementById(
        "planet-name"
    ).textContent =
        selectedPlanetData.name ||
        selectedPlanetData.project;


    document.getElementById(
        "planet-mode"
    ).textContent =
        selectedPlanetData.mode_label ||
        "";


    document.getElementById(
        "planet-focus"
    ).textContent =
        selectedPlanetData.focus ||
        "";


    document.getElementById(
        "planet-question"
    ).textContent =
        selectedPlanetData.question ||
        "";


    document
        .getElementById(
            "marker-card"
        )
        .classList.remove(
            "visible"
        );


    const distance =
        number(
            getSetting(
                "planet_camera_distance",
                8
            ),
            8
        );


    targetCameraPosition.set(
        distance,
        distance * 0.15,
        distance
    );

}


/* =========================================================
   RETURN TO GALAXY
   ========================================================= */

function returnToGalaxy() {

    planetView =
        false;


    selectedPlanet =
        null;


    selectedPlanetData =
        null;


    cameraMode =
        "galaxy";


    document
        .getElementById(
            "planet-ui"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "marker-card"
        )
        .classList.remove(
            "visible"
        );


    targetCameraPosition.set(
        0,
        0,
        number(
            getSetting(
                "galaxy_camera_distance",
                20
            ),
            20
        )
    );

}


/* =========================================================
   CLICK
   ========================================================= */

function onClick(event) {

    if (isDragging) {
        return;
    }


    mouse.x =
        (event.clientX /
            window.innerWidth) *
            2 -
        1;


    mouse.y =
        -(event.clientY /
            window.innerHeight) *
            2 +
        1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    if (!planetView) {

        const objects =
            planetGroup.children;


        const hits =
            raycaster.intersectObjects(
                objects,
                true
            );


        for (const hit of hits) {

            let object =
                hit.object;


            while (
                object &&
                object.parent &&
                object.userData.type !==
                    "planet"
            ) {

                object =
                    object.parent;

            }


            if (
                object &&
                object.userData.type ===
                    "planet"
            ) {

                enterPlanet(
                    object
                );

                return;

            }

        }

    } else {

        if (
            !selectedPlanet
        ) {
            return;
        }


        const hits =
            raycaster.intersectObjects(
                selectedPlanet.children,
                true
            );


        for (const hit of hits) {

            let object =
                hit.object;


            while (
                object &&
                object.parent &&
                object.userData.type !==
                    "marker"
            ) {

                object =
                    object.parent;

            }


            if (
                object &&
                object.userData.type ===
                    "marker"
            ) {

                showMarker(
                    object.userData.data
                );

                return;

            }

        }

    }

}


/* =========================================================
   MARKER CARD
   ========================================================= */

function showMarker(
    marker
) {

    document.getElementById(
        "marker-country"
    ).textContent =
        marker.country ||
        "";


    document.getElementById(
        "marker-title"
    ).textContent =
        marker.title ||
        "";


    const link =
        document.getElementById(
            "marker-link"
        );


    link.textContent =
        getInterface(
            "read_article",
            "READ ARTICLE"
        );


    link.href =
        marker.url ||
        "#";


    document
        .getElementById(
            "marker-card"
        )
        .classList.add(
            "visible"
        );

}


/* =========================================================
   DRAGGING
   ========================================================= */

function onPointerDown(
    event
) {

    isDragging =
        false;


    previousMouse.x =
        event.clientX;


    previousMouse.y =
        event.clientY;

}


function onPointerMove(
    event
) {

    const dx =
        event.clientX -
        previousMouse.x;


    const dy =
        event.clientY -
        previousMouse.y;


    if (
        Math.abs(dx) > 2 ||
        Math.abs(dy) > 2
    ) {

        isDragging =
            true;

    }


    previousMouse.x =
        event.clientX;


    previousMouse.y =
        event.clientY;


    if (
        !planetView
    ) {

        galaxyGroup.rotation.y +=
            dx *
            number(
                getSetting(
                    "galaxy_drag_sensitivity",
                    0.005
                ),
                0.005
            );


        galaxyGroup.rotation.x +=
            dy *
            number(
                getSetting(
                    "galaxy_drag_sensitivity",
                    0.005
                ),
                0.005
            );

    } else if (
        selectedPlanet
    ) {

        selectedPlanet.rotation.y +=
            dx *
            0.005;


        selectedPlanet.rotation.x +=
            dy *
            0.005;

    }

}


function onPointerUp() {

    setTimeout(
        () => {
            isDragging = false;
        },
        50
    );

}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera() {

    camera.position.lerp(
        targetCameraPosition,
        number(
            getSetting(
                "transition_speed",
                0.08
            ),
            0.08
        )
    );


    camera.lookAt(
        0,
        0,
        0
    );

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCamera();


    if (
        planetView &&
        selectedPlanet
    ) {

        selectedPlanet.children.forEach(
            child => {

                if (
                    child.userData.type ===
                    "planet"
                ) {

                    child.rotation.y +=
                        0.002;

                }

            }
        );

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   START
   ========================================================= */

loadData();

</script>
