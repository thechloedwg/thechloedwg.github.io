<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   GOOGLE SHEETS
   ========================================================= */

const POINTS_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ23GJgYn3S8flelPGL3HDWtEOisQZJYHt6-Yt90P8mEYladNlO2N4xCEx9Zj03Z3GQNCNG0PihZYlN/pub?gid=0&single=true&output=csv";

const APPEARANCE_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQcC28Cc8ZZYN9c7QRlzZWTPYIGmMHUoaYlJ_hJKY_qlcrUeHf2hGVzji-DgeQrvAnUf9UOPO_EeY23/pub?gid=0&single=true&output=csv";


/* =========================================================
   BASIC THREE.JS SETUP
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 2, 20);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.1
);

scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    1.8
);

directionalLight.position.set(5, 4, 8);

scene.add(directionalLight);


/* =========================================================
   STARS
   ========================================================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 5000;

const starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {

    const radius = 70 + Math.random() * 100;

    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    starPositions[i * 3] =
        radius * Math.sin(phi) * Math.cos(theta);

    starPositions[i * 3 + 1] =
        radius * Math.sin(phi) * Math.sin(theta);

    starPositions[i * 3 + 2] =
        radius * Math.cos(phi);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.055,
    transparent: true,
    opacity: 0.65
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);


/* =========================================================
   TEXTURES
   ========================================================= */

const textureLoader = new THREE.TextureLoader();

const earthTexture = textureLoader.load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const cloudTexture = textureLoader.load(
    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
);


/* =========================================================
   DATA
   ========================================================= */

let pointData = [];
let appearanceData = [];

const planets = [];
const projectObjects = {};

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

let selectedProject = null;

let hoveredPlanet = null;

let planetMode = false;

let cameraAnimating = false;

let cameraAnimationStart = 0;

let cameraStartPosition = new THREE.Vector3();

let cameraTargetPosition = new THREE.Vector3();

let selectedPlanet = null;

let didDrag = false;


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {

            value += '"';
            i++;

        } else if (char === '"') {

            insideQuotes = !insideQuotes;

        } else if (char === "," && !insideQuotes) {

            row.push(value.trim());
            value = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(value.trim());
            value = "";

            if (row.some(cell => cell !== "")) {
                rows.push(row);
            }

            row = [];

        } else {

            value += char;
        }
    }

    if (value.length || row.length) {

        row.push(value.trim());

        if (row.some(cell => cell !== "")) {
            rows.push(row);
        }
    }

    if (!rows.length) {
        return [];
    }

    const headers = rows[0].map(h =>
        h.trim().toLowerCase()
    );

    return rows.slice(1).map(row => {

        const object = {};

        headers.forEach((header, index) => {
            object[header] = row[index] || "";
        });

        return object;
    });
}


/* =========================================================
   HELPERS
   ========================================================= */

function clean(value) {

    return String(value || "").trim();
}


function hexToNumber(hex, fallback = 0xffffff) {

    if (!hex) return fallback;

    let cleaned = String(hex)
        .trim()
        .replace("#", "");

    if (cleaned.length === 3) {

        cleaned =
            cleaned[0] +
            cleaned[0] +
            cleaned[1] +
            cleaned[1] +
            cleaned[2] +
            cleaned[2];
    }

    const number = parseInt(cleaned, 16);

    return Number.isNaN(number)
        ? fallback
        : number;
}


function sizeToRadius(size) {

    const n = Number(size) || 3;

    const sizes = {
        1: 0.9,
        2: 1.25,
        3: 1.7,
        4: 2.25,
        5: 3.0
    };

    return sizes[n] || sizes[3];
}


/* =========================================================
   LAT/LONG → PLANET POSITION
   ========================================================= */

function latLonToVector3(lat, lon, radius) {

    const phi =
        THREE.MathUtils.degToRad(90 - lat);

    const theta =
        THREE.MathUtils.degToRad(lon + 180);

    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.cos(phi);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    return new THREE.Vector3(x, y, z);
}


/* =========================================================
   HOLOGRAPHIC GRID
   ========================================================= */

function createLatitudeLongitudeGrid(
    radius,
    colour,
    opacity,
    density
) {

    const group = new THREE.Group();

    let latitudeLines = 9;
    let longitudeLines = 18;

    if (density === "light") {

        latitudeLines = 5;
        longitudeLines = 10;

    } else if (density === "medium") {

        latitudeLines = 9;
        longitudeLines = 18;

    } else if (density === "dense") {

        latitudeLines = 17;
        longitudeLines = 36;
    }

    const material = new THREE.LineBasicMaterial({
        color: colour,
        transparent: true,
        opacity: opacity,
        depthWrite: false
    });

    /* Latitude */

    for (let i = 1; i < latitudeLines; i++) {

        const lat =
            -90 +
            (180 / latitudeLines) * i;

        const phi =
            THREE.MathUtils.degToRad(90 - lat);

        const y =
            radius * Math.cos(phi);

        const circleRadius =
            radius * Math.sin(phi);

        const points = [];

        for (let j = 0; j <= 64; j++) {

            const theta =
                (j / 64) * Math.PI * 2;

            points.push(
                new THREE.Vector3(
                    circleRadius * Math.cos(theta),
                    y,
                    circleRadius * Math.sin(theta)
                )
            );
        }

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const line =
            new THREE.Line(
                geometry,
                material
            );

        group.add(line);
    }

    /* Longitude */

    for (let i = 0; i < longitudeLines; i++) {

        const theta =
            (i / longitudeLines) * Math.PI * 2;

        const points = [];

        for (let j = 0; j <= 64; j++) {

            const phi =
                (j / 64) * Math.PI;

            const x =
                radius *
                Math.sin(phi) *
                Math.cos(theta);

            const y =
                radius *
                Math.cos(phi);

            const z =
                radius *
                Math.sin(phi) *
                Math.sin(theta);

            points.push(
                new THREE.Vector3(x, y, z)
            );
        }

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const line =
            new THREE.Line(
                geometry,
                material
            );

        group.add(line);
    }

    return group;
}


/* =========================================================
   ATMOSPHERE
   ========================================================= */

function createAtmosphere(
    radius,
    colour,
    strength
) {

    let opacity = 0.08;

    if (strength === "medium") {
        opacity = 0.12;
    }

    if (strength === "strong") {
        opacity = 0.18;
    }

    const material = new THREE.MeshBasicMaterial({
        color: colour,
        transparent: true,
        opacity: opacity,
        side: THREE.BackSide,
        depthWrite: false
    });

    const geometry =
        new THREE.SphereGeometry(
            radius * 1.06,
            64,
            64
        );

    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   GLOW
   ========================================================= */

function createGlow(
    radius,
    colour,
    strength
) {

    let scale = 1.10;
    let opacity = 0.08;

    if (strength === "medium") {

        scale = 1.14;
        opacity = 0.11;

    } else if (strength === "strong") {

        scale = 1.19;
        opacity = 0.15;
    }

    const material =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity: opacity,
            side: THREE.BackSide,
            depthWrite: false
        });

    const geometry =
        new THREE.SphereGeometry(
            radius * scale,
            48,
            48
        );

    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   RINGS
   ========================================================= */

function createPlanetRings(
    radius,
    colour,
    type,
    density
) {

    const group = new THREE.Group();

    if (!type || type === "none") {
        return group;
    }

    let ringCount = 1;

    if (type === "double") {
        ringCount = 2;
    }

    if (type === "complex") {
        ringCount = 4;
    }

    if (density && Number(density) > 0) {
        ringCount = Math.max(
            ringCount,
            Number(density)
        );
    }

    for (let i = 0; i < ringCount; i++) {

        const scale =
            1.35 +
            i * 0.12;

        const geometry =
            new THREE.RingGeometry(
                radius * scale,
                radius * scale + radius * 0.012,
                96
            );

        const material =
            new THREE.MeshBasicMaterial({
                color: colour,
                transparent: true,
                opacity:
                    type === "complex"
                        ? 0.25
                        : 0.18,
                side: THREE.DoubleSide,
                depthWrite: false
            });

        const ring =
            new THREE.Mesh(
                geometry,
                material
            );

        ring.rotation.x =
            THREE.MathUtils.degToRad(
                65 + i * 7
            );

        ring.rotation.z =
            i * 0.25;

        group.add(ring);
    }

    return group;
}


/* =========================================================
   SCAN LINES
   ========================================================= */

function createScanLines(
    radius,
    colour,
    intensity
) {

    const group = new THREE.Group();

    if (!intensity || intensity === "none") {
        return group;
    }

    const count =
        intensity === "high"
            ? 5
            : 3;

    for (let i = 0; i < count; i++) {

        const geometry =
            new THREE.RingGeometry(
                radius * 1.025,
                radius * 1.032,
                96
            );

        const material =
            new THREE.MeshBasicMaterial({
                color: colour,
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide,
                depthWrite: false
            });

        const line =
            new THREE.Mesh(
                geometry,
                material
            );

        line.rotation.x =
            Math.PI / 2;

        line.userData.offset =
            i / count;

        group.add(line);
    }

    return group;
}


/* =========================================================
   PARTICLES
   ========================================================= */

function createParticles(
    radius,
    colour,
    density
) {

    const group = new THREE.Group();

    if (!density || density === "none") {
        return group;
    }

    let count = 20;

    if (density === "medium") {
        count = 40;
    }

    if (density === "high") {
        count = 75;
    }

    const geometry =
        new THREE.BufferGeometry();

    const positions =
        new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {

        const r =
            radius *
            (1.18 + Math.random() * 0.25);

        const theta =
            Math.random() * Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        positions[i * 3] =
            r *
            Math.sin(phi) *
            Math.cos(theta);

        positions[i * 3 + 1] =
            r *
            Math.cos(phi);

        positions[i * 3 + 2] =
            r *
            Math.sin(phi) *
            Math.sin(theta);
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({
            color: colour,
            size: radius * 0.018,
            transparent: true,
            opacity: 0.65,
            depthWrite: false
        });

    group.add(
        new THREE.Points(
            geometry,
            material
        )
    );

    return group;
}


/* =========================================================
   CLOUDS
   ========================================================= */

function createCloudLayer(
    radius,
    enabled
) {

    if (
        enabled !== "yes" &&
        enabled !== "true" &&
        enabled !== "1"
    ) {
        return null;
    }

    const geometry =
        new THREE.SphereGeometry(
            radius * 1.012,
            64,
            64
        );

    const material =
        new THREE.MeshPhongMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.42,
            depthWrite: false
        });

    return new THREE.Mesh(
        geometry,
        material
    );
}


/* =========================================================
   CREATE PLANET
   ========================================================= */

function createProjectPlanet(
    appearance,
    position
) {

    const project =
        clean(appearance.project);

    const name =
        clean(appearance.name) ||
        project;

    const colour =
        hexToNumber(
            appearance.colour,
            0x35d07f
        );

    const radius =
        sizeToRadius(
            appearance.size
        );

    const planetGroup =
        new THREE.Group();

    planetGroup.position.copy(position);

    planetGroup.userData = {
        type: "planet",
        project: project,
        name: name,
        radius: radius,
        colour: colour,
        targetOpacity: 1
    };


    /* -----------------------------------------------------
       EARTH
       ----------------------------------------------------- */

    const surfaceOpacity =
        Number(
            appearance["surface opacity"]
        ) || 0.9;

    const surfaceMaterial =
        new THREE.MeshPhongMaterial({
            map: earthTexture,
            color: colour,
            transparent: true,
            opacity: surfaceOpacity,
            shininess: 8
        });

    const sphereGeometry =
        new THREE.SphereGeometry(
            radius,
            64,
            64
        );

    const sphere =
        new THREE.Mesh(
            sphereGeometry,
            surfaceMaterial
        );

    sphere.userData.isPlanetSurface = true;

    planetGroup.add(sphere);


    /* -----------------------------------------------------
       COLOUR OVERLAY
       ----------------------------------------------------- */

    const colourOverlayMaterial =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity:
                appearance.surface === "Earth"
                    ? 0.18
                    : 0.28,
            depthWrite: false
        });

    const colourOverlay =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                radius * 1.003,
                64,
                64
            ),
            colourOverlayMaterial
        );

    planetGroup.add(
        colourOverlay
    );


    /* -----------------------------------------------------
       GRID
       ----------------------------------------------------- */

    const grid =
        createLatitudeLongitudeGrid(
            radius * 1.008,
            colour,
            Number(
                appearance["grid opacity"]
            ) || 0.35,
            clean(
                appearance.grid
            ).toLowerCase()
        );

    planetGroup.add(grid);


    /* -----------------------------------------------------
       ATMOSPHERE
       ----------------------------------------------------- */

    const atmosphere =
        clean(
            appearance.atmosphere
        ).toLowerCase();

    if (
        atmosphere &&
        atmosphere !== "none"
    ) {

        planetGroup.add(
            createAtmosphere(
                radius,
                colour,
                clean(
                    appearance.glow
                ).toLowerCase()
            )
        );
    }


    /* -----------------------------------------------------
       GLOW
       ----------------------------------------------------- */

    const glowStrength =
        clean(
            appearance.glow
        ).toLowerCase();

    if (
        glowStrength &&
        glowStrength !== "none"
    ) {

        planetGroup.add(
            createGlow(
                radius,
                colour,
                glowStrength
            )
        );
    }


    /* -----------------------------------------------------
       CLOUDS
       ----------------------------------------------------- */

    const clouds =
        createCloudLayer(
            radius,
            clean(
                appearance.clouds
            ).toLowerCase()
        );

    if (clouds) {

        clouds.userData.isCloudLayer =
            true;

        planetGroup.add(clouds);
    }


    /* -----------------------------------------------------
       RINGS
       ----------------------------------------------------- */

    const rings =
        createPlanetRings(
            radius,
            hexToNumber(
                appearance["ring colour"],
                colour
            ),
            clean(
                appearance.rings
            ).toLowerCase(),
            appearance["ring density"]
        );

    planetGroup.add(rings);


    /* -----------------------------------------------------
       SCAN LINES
       ----------------------------------------------------- */

    const scanLines =
        createScanLines(
            radius,
            colour,
            clean(
                appearance["scan lines"]
            ).toLowerCase()
        );

    planetGroup.add(scanLines);


    /* -----------------------------------------------------
       PARTICLES
       ----------------------------------------------------- */

    const particles =
        createParticles(
            radius,
            colour,
            clean(
                appearance.particles
            ).toLowerCase()
        );

    planetGroup.add(particles);


    /* -----------------------------------------------------
       RESEARCH POINT GROUP
       ----------------------------------------------------- */

    const pointsGroup =
        new THREE.Group();

    pointsGroup.name =
        "Research Points";

    planetGroup.add(
        pointsGroup
    );


    /* -----------------------------------------------------
       STORE
       ----------------------------------------------------- */

    planetGroup.userData.radius =
        radius;

    planetGroup.userData.colour =
        colour;

    planetGroup.userData.spin =
        clean(
            appearance.spin
        ).toLowerCase();

    planetGroup.userData.pointStyle =
        clean(
            appearance["point style"]
        ).toLowerCase();

    planetGroup.userData.appearance =
        appearance;

    scene.add(
        planetGroup
    );

    planets.push(
        planetGroup
    );

    projectObjects[project] =
        planetGroup;

    return planetGroup;
}


/* =========================================================
   RESEARCH POINTS
   ========================================================= */

function createResearchPin(
    row,
    radius,
    colour,
    pointStyle
) {

    const group =
        new THREE.Group();

    group.userData = {

        type: "research",

        country:
            clean(row.country),

        title:
            clean(row.title),

        url:
            clean(row.url),

        lat:
            Number(row.lat),

        lon:
            Number(row.long)
    };


    const normal =
        latLonToVector3(
            Number(row.lat),
            Number(row.long),
            radius
        ).normalize();


    /* -----------------------------------------------------
       MAIN MARKER
       ----------------------------------------------------- */

    const ringGeometry =
        new THREE.RingGeometry(
            radius * 0.025,
            radius * 0.042,
            32
        );

    const ringMaterial =
        new THREE.MeshBasicMaterial({
            color: colour,
            transparent: true,
            opacity: 0.9,
            side: THREE.DoubleSide,
            depthWrite: false
        });

    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );

    ring.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        normal
    );

    ring.position.copy(
        normal.clone()
            .multiplyScalar(
                radius * 1.012
            )
    );

    ring.userData.isResearchMarker =
        true;

    group.add(ring);


    /* -----------------------------------------------------
       POINT STYLE
       ----------------------------------------------------- */

    if (pointStyle === "crosshair") {

        const size =
            radius * 0.075;

        const material =
            new THREE.LineBasicMaterial({
                color: colour,
                transparent: true,
                opacity: 0.7,
                depthWrite: false
            });

        const points = [
            new THREE.Vector3(-size, 0, 0),
            new THREE.Vector3(size, 0, 0),
            new THREE.Vector3(0, -size, 0),
            new THREE.Vector3(0, size, 0)
        ];

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const crosshair =
            new THREE.LineSegments(
                geometry,
                material
            );

        crosshair.quaternion.copy(
            ring.quaternion
        );

        crosshair.position.copy(
            ring.position
        );

        group.add(
            crosshair
        );
    }


    if (pointStyle === "pulse") {

        group.userData.pulse =
            Math.random() * Math.PI * 2;
    }


    return group;
}


/* =========================================================
   ATTACH POINTS TO PLANETS
   ========================================================= */

function attachResearchPoints() {

    pointData.forEach(row => {

        const project =
            clean(row.project);

        const planet =
            projectObjects[project];

        if (!planet) {
            return;
        }

        const pointsGroup =
            planet.children.find(
                child =>
                    child.name ===
                    "Research Points"
            );

        if (!pointsGroup) {
            return;
        }

        const radius =
            planet.userData.radius;

        const colour =
            planet.userData.colour;

        const pointStyle =
            planet.userData.pointStyle;

        const pin =
            createResearchPin(
                row,
                radius,
                colour,
                pointStyle
            );

        pointsGroup.add(
            pin
        );
    });
}


/* =========================================================
   BUILD GALAXY
   ========================================================= */

function buildGalaxy() {

    /* -----------------------------------------------------
       Find which projects actually have points
       ----------------------------------------------------- */

    const projectsWithPoints =
        new Set();

    pointData.forEach(row => {

        const project =
            clean(row.project);

        if (project) {
            projectsWithPoints.add(
                project
            );
        }
    });


    /* -----------------------------------------------------
       Only create planets with points
       ----------------------------------------------------- */

    const activeAppearances =
        appearanceData.filter(
            appearance =>
                projectsWithPoints.has(
                    clean(
                        appearance.project
                    )
                )
        );


    /* -----------------------------------------------------
       Planet positions
       ----------------------------------------------------- */

    const positions = [
        new THREE.Vector3(-6.2, 1.7, -1),
        new THREE.Vector3(0.2, -1.3, -3),
        new THREE.Vector3(6.0, 1.0, -1.5),
        new THREE.Vector3(-2.7, -3.2, -5),
        new THREE.Vector3(3.1, 3.4, -5.5),
        new THREE.Vector3(8, -2, -7),
        new THREE.Vector3(-8, -2, -6)
    ];


    activeAppearances.forEach(
        (appearance, index) => {

            const position =
                positions[
                    index %
                    positions.length
                ].clone();

            createProjectPlanet(
                appearance,
                position
            );
        }
    );


    attachResearchPoints();
}


/* =========================================================
   CAMERA ANIMATION
   ========================================================= */

function startCameraAnimation(
    targetPosition,
    duration = 1600
) {

    cameraAnimationStart =
        performance.now();

    cameraStartPosition.copy(
        camera.position
    );

    cameraTargetPosition.copy(
        targetPosition
    );

    cameraAnimating = true;

    cameraAnimationDuration =
        duration;
}

let cameraAnimationDuration =
    1600;


function updateCameraAnimation(
    now
) {

    if (!cameraAnimating) {
        return;
    }

    const elapsed =
        now -
        cameraAnimationStart;

    const t =
        Math.min(
            elapsed /
            cameraAnimationDuration,
            1
        );

    const eased =
        1 -
        Math.pow(
            1 - t,
            3
        );

    camera.position.lerpVectors(
        cameraStartPosition,
        cameraTargetPosition,
        eased
    );

    if (t >= 1) {
        cameraAnimating = false;
    }
}


/* =========================================================
   ENTER PLANET
   ========================================================= */

function enterPlanet(
    planet
) {

    if (planetMode || cameraAnimating) {
        return;
    }

    selectedPlanet =
        planet;

    selectedProject =
        planet.userData.project;

    planetMode = true;

    document
        .getElementById("backButton")
        .classList.add("visible");

    document
        .getElementById("instructions")
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A LOCATION";


    /* -----------------------------------------------------
       Fade other planets
       ----------------------------------------------------- */

    planets.forEach(other => {

        if (other === planet) {

            other.visible = true;

        } else {

            other.traverse(object => {

                if (
                    object.material &&
                    object.material.transparent !==
                    undefined
                ) {

                    object.userData.savedOpacity =
                        object.material.opacity;

                    object.material.opacity =
                        0;
                }
            });
        }
    });


    /* -----------------------------------------------------
       Move selected planet towards camera
       ----------------------------------------------------- */

    const worldPosition =
        new THREE.Vector3();

    planet.getWorldPosition(
        worldPosition
    );

    const direction =
        worldPosition
            .clone()
            .normalize();

    const target =
        worldPosition.clone()
            .add(
                direction.multiplyScalar(
                    -8
                )
            );

    startCameraAnimation(
        target,
        1600
    );
}


/* =========================================================
   EXIT PLANET
   ========================================================= */

function exitPlanet() {

    if (!planetMode) {
        return;
    }

    planetMode = false;

    selectedProject = null;
    selectedPlanet = null;

    document
        .getElementById("backButton")
        .classList.remove("visible");

    document
        .getElementById("instructions")
        .textContent =
        "DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD";


    /* -----------------------------------------------------
       Restore planets
       ----------------------------------------------------- */

    planets.forEach(planet => {

        planet.visible = true;

        planet.traverse(object => {

            if (
                object.material &&
                object.userData.savedOpacity !==
                undefined
            ) {

                object.material.opacity =
                    object.userData.savedOpacity;

                delete object.userData.savedOpacity;
            }
        });
    });


    hideResearchCard();

    startCameraAnimation(
        new THREE.Vector3(
            0,
            2,
            20
        ),
        1200
    );
}


/* =========================================================
   RESEARCH CARD
   ========================================================= */

function showResearchCard(
    data
) {

    document
        .getElementById("researchCountry")
        .textContent =
        data.country;

    document
        .getElementById("researchTitle")
        .textContent =
        data.title;

    const link =
        document.getElementById(
            "researchLink"
        );

    link.href =
        data.url || "#";

    document
        .getElementById("researchCard")
        .classList.add("visible");
}


function hideResearchCard() {

    document
        .getElementById("researchCard")
        .classList.remove("visible");
}


/* =========================================================
   PLANET LABEL
   ========================================================= */

function updatePlanetLabel() {

    const label =
        document.getElementById(
            "planetLabel"
        );

    if (
        !hoveredPlanet ||
        planetMode
    ) {

        label.classList.remove(
            "visible"
        );

        return;
    }

    const worldPosition =
        new THREE.Vector3();

    hoveredPlanet.getWorldPosition(
        worldPosition
    );

    const projected =
        worldPosition.clone()
            .project(camera);

    const x =
        (projected.x * 0.5 + 0.5) *
        window.innerWidth;

    const y =
        (-projected.y * 0.5 + 0.5) *
        window.innerHeight;

    label.style.left =
        `${x}px`;

    label.style.top =
        `${y - 20}px`;

    label.textContent =
        hoveredPlanet.userData.name;

    label.classList.add(
        "visible"
    );
}


/* =========================================================
   POINTER / NAVIGATION
   ========================================================= */

let isPointerDown = false;
let isDragging = false;

let pointerStartX = 0;
let pointerStartY = 0;

let previousPointerX = 0;
let previousPointerY = 0;

const DRAG_THRESHOLD = 6;
const DRAG_SENSITIVITY = 0.0035;


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        isPointerDown = true;
        isDragging = false;
        didDrag = false;

        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;

        previousPointerX =
            event.clientX;

        previousPointerY =
            event.clientY;

        renderer.domElement.setPointerCapture(
            event.pointerId
        );

        document.body.classList.add(
            "dragging"
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (!isPointerDown) {

            if (!planetMode) {

                mouse.x =
                    (event.clientX /
                        window.innerWidth) *
                        2 -
                    1;

                mouse.y =
                    -(event.clientY /
                        window.innerHeight) *
                        2 +
                    1;

                raycaster.setFromCamera(
                    mouse,
                    camera
                );

                const intersects =
                    raycaster.intersectObjects(
                        planets,
                        true
                    );

                hoveredPlanet = null;

                for (
                    let i = 0;
                    i < intersects.length;
                    i++
                ) {

                    let object =
                        intersects[i].object;

                    while (
                        object &&
                        !object.userData.project
                    ) {

                        object =
                            object.parent;
                    }

                    if (
                        object &&
                        object.userData.type ===
                        "planet"
                    ) {

                        hoveredPlanet =
                            object;

                        break;
                    }
                }

                updatePlanetLabel();
            }

            return;
        }


        const dx =
            event.clientX -
            pointerStartX;

        const dy =
            event.clientY -
            pointerStartY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            !isDragging &&
            distance >
            DRAG_THRESHOLD
        ) {

            isDragging = true;
            didDrag = true;
        }


        if (!isDragging) {
            return;
        }


        const movementX =
            event.clientX -
            previousPointerX;

        const movementY =
            event.clientY -
            previousPointerY;

        previousPointerX =
            event.clientX;

        previousPointerY =
            event.clientY;


        const targets =
            planetMode &&
            selectedPlanet
                ? [selectedPlanet]
                : planets;


        targets.forEach(planet => {

            planet.rotation.y +=
                movementX *
                DRAG_SENSITIVITY;

            planet.rotation.x +=
                movementY *
                DRAG_SENSITIVITY;

            planet.rotation.x =
                THREE.MathUtils.clamp(
                    planet.rotation.x,
                    -1.3,
                    1.3
                );
        });
    }
);


function finishPointer(event) {

    isPointerDown = false;
    isDragging = false;

    document.body.classList.remove(
        "dragging"
    );

    try {

        renderer.domElement.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {
        /* ignore */
    }
}


renderer.domElement.addEventListener(
    "pointerup",
    event => {

        finishPointer(event);

        if (didDrag) {

            didDrag = false;

            return;
        }

        handleClick(event);
    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    event => {

        finishPointer(event);

        didDrag = false;
    }
);


/* =========================================================
   CLICK
   ========================================================= */

function handleClick(event) {

    mouse.x =
        (event.clientX /
            window.innerWidth) *
            2 -
        1;

    mouse.y =
        -(event.clientY /
            window.innerHeight) *
            2 +
        1;

    raycaster.setFromCamera(
        mouse,
        camera
    );


    /* -----------------------------------------------------
       GALAXY MODE
       ----------------------------------------------------- */

    if (!planetMode) {

        const intersects =
            raycaster.intersectObjects(
                planets,
                true
            );

        for (
            let i = 0;
            i < intersects.length;
            i++
        ) {

            let object =
                intersects[i].object;

            while (
                object &&
                object.userData.type !==
                "planet"
            ) {

                object =
                    object.parent;
            }

            if (
                object &&
                object.userData.type ===
                "planet"
            ) {

                enterPlanet(object);

                return;
            }
        }

        return;
    }


    /* -----------------------------------------------------
       PLANET MODE
       ----------------------------------------------------- */

    if (!selectedPlanet) {
        return;
    }

    const pointsGroup =
        selectedPlanet.children.find(
            child =>
                child.name ===
                "Research Points"
        );

    if (!pointsGroup) {
        return;
    }

    const intersects =
        raycaster.intersectObjects(
            pointsGroup.children,
            true
        );

    for (
        let i = 0;
        i < intersects.length;
        i++
    ) {

        let object =
            intersects[i].object;

        while (
            object &&
            object.userData.type !==
            "research"
        ) {

            object =
                object.parent;
        }

        if (
            object &&
            object.userData.type ===
            "research"
        ) {

            showResearchCard(
                object.userData
            );

            return;
        }
    }
}


/* =========================================================
   ZOOM
   ========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        const zoomSpeed =
            planetMode
                ? 0.008
                : 0.012;

        camera.position.z +=
            event.deltaY *
            zoomSpeed;

        if (planetMode) {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    3.5,
                    15
                );

        } else {

            camera.position.z =
                THREE.MathUtils.clamp(
                    camera.position.z,
                    8,
                    40
                );
        }
    },
    {
        passive: false
    }
);


/* =========================================================
   BACK BUTTON
   ========================================================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        event => {

            event.stopPropagation();

            exitPlanet();
        }
    );


/* =========================================================
   ANIMATION
   ========================================================= */

let lastTime =
    performance.now();

function animate(now) {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            (now - lastTime) /
            1000,
            0.05
        );

    lastTime = now;


    /* -----------------------------------------------------
       Camera
       ----------------------------------------------------- */

    updateCameraAnimation(
        now
    );


    /* -----------------------------------------------------
       Automatic planet rotation
       ----------------------------------------------------- */

    if (
        !isPointerDown &&
        !isDragging &&
        !cameraAnimating
    ) {

        planets.forEach(
            planet => {

                let speed =
                    0.05;

                if (
                    planet.userData.spin ===
                    "slow"
                ) {

                    speed =
                        0.025;

                } else if (
                    planet.userData.spin ===
                    "fast"
                ) {

                    speed =
                        0.09;
                }

                if (
                    planetMode &&
                    planet !==
                    selectedPlanet
                ) {
                    return;
                }

                planet.rotation.y +=
                    speed *
                    delta;
            }
        );
    }


    /* -----------------------------------------------------
       Cloud rotation
       ----------------------------------------------------- */

    planets.forEach(
        planet => {

            planet.children.forEach(
                child => {

                    if (
                        child.userData &&
                        child.userData.isCloudLayer
                    ) {

                        child.rotation.y +=
                            0.012 *
                            delta;
                    }
                }
            );
        }
    );


    /* -----------------------------------------------------
       Point pulses
       ----------------------------------------------------- */

    planets.forEach(
        planet => {

            const pointsGroup =
                planet.children.find(
                    child =>
                        child.name ===
                        "Research Points"
                );

            if (!pointsGroup) {
                return;
            }

            pointsGroup.children.forEach(
                pin => {

                    if (
                        pin.userData &&
                        pin.userData.pulse !==
                        undefined
                    ) {

                        pin.userData.pulse +=
                            delta * 3;

                        const scale =
                            1 +
                            Math.sin(
                                pin.userData.pulse
                            ) *
                            0.25;

                        pin.scale.set(
                            scale,
                            scale,
                            scale
                        );
                    }
                }
            );
        }
    );


    /* -----------------------------------------------------
       Scan-line animation
       ----------------------------------------------------- */

    planets.forEach(
        planet => {

            planet.children.forEach(
                child => {

                    if (
                        child.children &&
                        child.children.length &&
                        child !==
                        planet.children.find(
                            c =>
                                c.name ===
                                "Research Points"
                        )
                    ) {

                        child.children.forEach(
                            object => {

                                if (
                                    object.userData &&
                                    object.userData.offset !==
                                    undefined
                                ) {

                                    object.rotation.y +=
                                        delta *
                                        0.15;
                                }
                            }
                        );
                    }
                }
            );
        }
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {

    try {

        const [
            pointsResponse,
            appearanceResponse
        ] =
            await Promise.all([

                fetch(
                    POINTS_CSV +
                    "&cache=" +
                    Date.now()
                ),

                fetch(
                    APPEARANCE_CSV +
                    "&cache=" +
                    Date.now()
                )
            ]);


        if (
            !pointsResponse.ok ||
            !appearanceResponse.ok
        ) {

            throw new Error(
                "Could not load Google Sheets."
            );
        }


        const pointsText =
            await pointsResponse.text();

        const appearanceText =
            await appearanceResponse.text();


        pointData =
            parseCSV(pointsText);

        appearanceData =
            parseCSV(appearanceText);


        console.log(
            "Research points:",
            pointData
        );

        console.log(
            "Planet appearances:",
            appearanceData
        );


        buildGalaxy();


        document
            .getElementById("loading")
            .classList.add("hidden");


    } catch (error) {

        console.error(error);

        document
            .getElementById("loading")
            .textContent =
            "Could not load research universe";
    }
}


/* =========================================================
   START
   ========================================================= */

loadData();

animate(
    performance.now()
);

</script>
