<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chloe DWG — Research Universe</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020207;
      font-family: Arial, Helvetica, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 30px;
      left: 35px;
      z-index: 10;

      color: white;
      font-size: 14px;
      letter-spacing: 4px;
      font-weight: 400;
    }

    .instructions {
      position: fixed;
      bottom: 28px;
      left: 35px;
      z-index: 10;

      color: rgba(255,255,255,0.55);
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div id="canvas-container"></div>

  <div class="title">
    CHLOE DWG — RESEARCH UNIVERSE
  </div>

  <div class="instructions">
    DRAG TO EXPLORE · SCROLL TO ZOOM · SELECT A WORLD
  </div>


  <!-- THREE.JS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


  <script>

    // ==================================================
    // SCENE
    // ==================================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x020207);


    // ==================================================
    // CAMERA
    // ==================================================

    const camera =
      new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

    camera.position.set(
      0,
      2,
      20
    );


    // ==================================================
    // RENDERER
    // ==================================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    document
      .getElementById(
        "canvas-container"
      )
      .appendChild(
        renderer.domElement
      );


    // ==================================================
    // LIGHTING
    // ==================================================

    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        0.45
      );

    scene.add(
      ambient
    );


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    sun.position.set(
      8,
      5,
      10
    );

    scene.add(
      sun
    );


    // ==================================================
    // TEXTURE LOADER
    // ==================================================

    const loader =
      new THREE.TextureLoader();


    // ==================================================
    // CREATE EARTH
    // ==================================================

    const earthGeometry =
      new THREE.SphereGeometry(
        3,
        64,
        64
      );


    /*
      NASA-style public Earth texture.
    */

    const earthTexture =
      loader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
      );


    const earthMaterial =
      new THREE.MeshPhongMaterial({
        map: earthTexture,
        shininess: 8
      });


    const earth =
      new THREE.Mesh(
        earthGeometry,
        earthMaterial
      );

    earth.position.set(
      0,
      0,
      0
    );

    scene.add(
      earth
    );


    // ==================================================
    // EARTH ATMOSPHERE
    // ==================================================

    const atmosphereGeometry =
      new THREE.SphereGeometry(
        3.12,
        64,
        64
      );


    const atmosphereMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x4f8cff,
        transparent: true,
        opacity: 0.16,
        side: THREE.BackSide
      });


    const atmosphere =
      new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
      );

    scene.add(
      atmosphere
    );


    // ==================================================
    // PLANET CREATOR
    // ==================================================

    function createPlanet(
      x,
      y,
      z,
      radius,
      colour
    ) {

      const geometry =
        new THREE.SphereGeometry(
          radius,
          48,
          48
        );


      const material =
        new THREE.MeshStandardMaterial({
          color: colour,
          roughness: 0.75,
          metalness: 0.05
        });


      const planet =
        new THREE.Mesh(
          geometry,
          material
        );


      planet.position.set(
        x,
        y,
        z
      );


      scene.add(
        planet
      );


      return planet;

    }


    // ==================================================
    // OTHER RESEARCH WORLDS
    // ==================================================

    const cop =
      createPlanet(
        -7,
        3,
        -4,
        1.7,
        0x3d8f68
      );


    const refugee =
      createPlanet(
        7,
        -2,
        -5,
        2,
        0xa95757
      );


    const future =
      createPlanet(
        -4,
        -5,
        -7,
        1.2,
        0xb58b3d
      );


    // ==================================================
    // PLANET ATMOSPHERES
    // ==================================================

    function addGlow(
      planet,
      colour
    ) {

      const geometry =
        new THREE.SphereGeometry(
          planet.geometry.parameters.radius * 1.08,
          32,
          32
        );


      const material =
        new THREE.MeshBasicMaterial({
          color: colour,
          transparent: true,
          opacity: 0.10,
          side: THREE.BackSide
        });


      const glow =
        new THREE.Mesh(
          geometry,
          material
        );


      planet.add(
        glow
      );

    }


    addGlow(
      cop,
      0x4fc58a
    );


    addGlow(
      refugee,
      0xff7777
    );


    addGlow(
      future,
      0xe8b95a
    );


    // ==================================================
    // STARS
    // ==================================================

    const starGeometry =
      new THREE.BufferGeometry();


    const starCount =
      5000;


    const positions =
      new Float32Array(
        starCount * 3
      );


    for (
      let i = 0;
      i < starCount * 3;
      i++
    ) {

      positions[i] =
        (Math.random() - 0.5) * 300;

    }


    starGeometry.setAttribute(
      "position",

      new THREE.BufferAttribute(
        positions,
        3
      )
    );


    const starMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.07,
        transparent: true,
        opacity: 0.85
      });


    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );


    scene.add(
      stars
    );


    // ==================================================
    // ANIMATION
    // ==================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      // Earth

      earth.rotation.y +=
        0.0015;


      atmosphere.rotation.y +=
        0.0005;


      // Other worlds

      cop.rotation.y +=
        0.001;


      refugee.rotation.y +=
        0.0012;


      future.rotation.y +=
        0.001;


      // Stars

      stars.rotation.y +=
        0.00008;


      // Render

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // ==================================================
    // RESIZE
    // ==================================================

    window.addEventListener(
      "resize",

      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
