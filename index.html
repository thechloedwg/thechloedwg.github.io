/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {

            cell += '"';
            i++;

        } else if (char === '"') {

            quoted = !quoted;

        } else if (char === "," && !quoted) {

            row.push(cell);
            cell = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !quoted
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell);
            cell = "";

            if (
                row.length > 1 ||
                row[0].trim() !== ""
            ) {
                rows.push(row);
            }

            row = [];

        } else {

            cell += char;
        }
    }

    if (cell.length || row.length) {

        row.push(cell);
        rows.push(row);
    }

    if (!rows.length) {
        return [];
    }


    const headers =
        rows[0].map(normaliseHeader);


    return rows
        .slice(1)
        .map(values => {

            const object = {};

            headers.forEach((header, index) => {

                object[header] =
                    values[index] !== undefined
                        ? values[index].trim()
                        : "";

            });

            return object;
        });

}


/* =========================================================
   HEADER NORMALISATION
   ========================================================= */

function normaliseHeader(value) {

    return value
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_")
        .replace(/[^\w]/g, "");
}


/* =========================================================
   HELPERS
   ========================================================= */

function number(value, fallback = 0) {

    const n = parseFloat(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


function boolean(value, fallback = false) {

    if (value === undefined || value === "") {
        return fallback;
    }

    return [
        "true",
        "yes",
        "1",
        "on"
    ].includes(
        String(value).toLowerCase()
    );
}


function getSetting(key, fallback) {

    return globalData[key] !== undefined
        ? globalData[key]
        : fallback;
}


/* =========================================================

async function loadCSV(url) {

    const response =
        await fetch(url + "&cache=" + Date.now());

    if (!response.ok) {

        throw new Error(
            "CSV failed: " +
            response.status +
            " — " +
            url
        );
    }

    const text =
        await response.text();

    return parseCSV(text);
}

/* =========================================================
   BACKGROUND STARS
   =========================================================

   These are intentionally subtle.

   They are:
   - very small
   - very far away
   - non-interactive
   - excluded from raycasting

   They exist only to give the universe depth.
   ========================================================= */

function createStars() {

    const count = 1800;

    const positions =
        new Float32Array(count * 3);


    for (let i = 0; i < count; i++) {

        const radius =
            700 +
            Math.random() * 1000;

        const theta =
            Math.random() *
            Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );


        positions[i * 3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        positions[i * 3 + 1] =
            radius *
            Math.cos(phi);

        positions[i * 3 + 2] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: 0xffffff,

            size: 0.65,

            sizeAttenuation: true,

            transparent: true,

            opacity: 0.28,

            depthWrite: false
        });


    const stars =
        new THREE.Points(
            geometry,
            material
        );


    /*
       IMPORTANT:

       Put stars directly into the scene,
       NOT galaxyGroup.

       This means they are never treated
       as selectable research objects.
    */

    scene.add(stars);
}

/* =========================================================
   CREATE PLANET
   ========================================================= */

function createPlanet(data) {

    if (

/* =========================================================
   CREATE PLANET MARKERS
   ========================================================= */

function createPlanetMarkers(
    planet
) {

    /*
       Remove old markers.
    */

    galaxyGroup.children
        .filter(
            child =>
                child.userData &&
                child.userData.type ===
                "marker"
        )
        .forEach(
            marker =>
                galaxyGroup.remove(
                    marker
                )
        );


    const project =
        planet.userData.data.project;


    const markers =
        markerData.filter(
            marker =>
                marker.project ===
                project
        );


    const radius =
        Math.max(
            0.25,
            number(
                planet.userData.data.size,
                1
            )
        );


    markers.forEach(
        marker => {

            createMarker(
                marker,
                planet,
                radius
            );

        }
    );
}


/* =========================================================
   CREATE MARKER
   ========================================================= */

function createMarker(
    data,
    planet,
    radius
) {

    const size =
        number(
            getSetting(
                "marker_size",
                0.12
            ),
            0.12
        );


    const geometry =
        new THREE.SphereGeometry(
            size,
            12,
            12
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                planet.userData.data.colour ||
                0xffffff
        });


    const marker =
        new THREE.Mesh(
            geometry,
            material
        );


    /*
       Convert latitude / longitude
       into a position on the planet.
    */

    const lat =
        number(data.lat);

    const lon =
        number(data.long);


    const phi =
        (90 - lat) *
        Math.PI /
        180;


    const theta =
        (lon + 180) *
        Math.PI /
        180;


    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);


    const y =
        radius *
        Math.cos(phi);


    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    marker.position.copy(
        planet.position
    );


    const direction =
        new THREE.Vector3(
            x,
            y,
            z
        );


    direction.normalize();


    marker.position.add(
        direction.multiplyScalar(
            radius + size * 1.5
        )
    );


    marker.userData = {

        type: "marker",

        data: data,

        planet: planet
    };


    galaxyGroup.add(
        marker
    );


    /*
       Marker label.
    */

    const label =
        createLabel(
            data.country ||
            data.title ||
            ""
        );


    label.scale.set(
        2.2,
        0.55,
        1
    );


    label.position.copy(
        marker.position
    );


    label.position.multiplyScalar(
        1.02
    );


    label.userData = {

        type: "marker-label",

        marker: marker
    };


    galaxyGroup.add(
        label
    );
}

       Remove markers.
    */

    galaxyGroup.children
        .filter(
            child =>
                child.userData &&
                (
                    child.userData.type ===
                    "marker" ||

                    child.userData.type ===
                    "marker-label"
                )
        )
        .forEach(
            child =>
                galaxyGroup.remove(
                    child
                )
        );


    /*
       Show planets and labels.
    */

    galaxyGroup.children.forEach(
        child => {

            if (
                child.userData &&
                child.userData.type ===
                "planet"
            ) {

                child.visible = true;
            }

            if (
                child.userData &&
                child.userData.type ===
                "label"
            ) {

                child.visible = true;
            }
        }
    );


    cameraPositionTarget.set(
        0,
        0,
        25
    );


    cameraTarget.set(
        0,
        0,
        0
    );


    cameraAnimating =
        true;
}

   ========================================================= */

function returnToWorld() {

    articlePanel.classList.remove(
        "visible"
    );


    selectedMarker =
        null;


    currentView =
        VIEW.PLANET;


    backGalaxy.classList.remove(
        "hidden"
    );

    backWorld.classList.add(
        "hidden"
    );


    instruction.textContent =
        "Click a location to explore";
}


/* =========================================================
   CLICK HANDLING
   ========================================================= */

function onPointerDown(
    event
) {

    /*
       ARTICLE VIEW:

       Don't allow the 3D universe
       to receive clicks.
    */

    if (
        currentView ===
        VIEW.ARTICLE
    ) {
        return;
    }


    mouse.x =
        (
            event.clientX /
            window.innerWidth
        ) * 2 - 1;


    mouse.y =
        -(
            event.clientY /
            window.innerHeight
        ) * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    /*
       GALAXY VIEW

       Only planets are clickable.
    */

    if (
        currentView ===
        VIEW.GALAXY
    ) {

        const planets =
            galaxyGroup.children.filter(
                child =>
                    child.userData &&
                    child.userData.type ===
                    "planet" &&
                    child.visible
            );


        const hits =
            raycaster.intersectObjects(
                planets,
                false
            );


        if (hits.length) {

            enterPlanet(
                hits[0].object
            );

        }

        return;
    }


    /*
       PLANET VIEW

       Only markers are clickable.
    */

    if (
        currentView ===
        VIEW.PLANET
    ) {

        const markers =
            galaxyGroup.children.filter(
                child =>
                    child.userData &&
                    child.userData.type ===
                    "marker" &&
                    child.visible
            );


        const hits =
            raycaster.intersectObjects(
                markers,
                false
            );


        if (hits.length) {

            showArticle(
                hits[0].object
            );
        }

        return;
    }
}


/* =========================================================
   BUTTONS
   ========================================================= */

backGalaxy.addEventListener(
    "click",
    returnToGalaxy
);


backWorld.addEventListener(
    "click",
    returnToWorld
);


closeArticle.addEventListener(
    "click",
    returnToWorld
);


/* =========================================================
   CAMERA ANIMATION
   ========================================================= */

function updateCamera() {

    if (!cameraAnimating) {
        return;
    }


    camera.position.lerp(
        cameraPositionTarget,
        0.055
    );


    const currentTarget =
        new THREE.Vector3();

    currentTarget.copy(
        cameraTarget
    );


    const lookTarget =
        new THREE.Vector3();


    camera.getWorldDirection(
        lookTarget
    );


    const desiredLook =
        currentTarget;


    camera.lookAt(
        desiredLook
    );


    if (
        camera.position.distanceTo(
            cameraPositionTarget
        ) < 0.02
    ) {

        camera.position.copy(
            cameraPositionTarget
        );

        cameraAnimating =
            false;
    }
}


/* =========================================================
   RESIZE
   ========================================================= */

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCamera();


    /*
       Very subtle planet rotation.

       Only the selected planet needs
       stronger motion later.
    */

    galaxyGroup.children.forEach(
        child => {

            if (
                child.userData &&
                child.userData.type ===
                "planet"
            ) {

                child.rotation.y +=
                    0.0008;
            }
        }
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   LOAD EVERYTHING
   ========================================================= */

async function loadData() {

    try {

        console.log(
            "Loading PLANETS sheet..."
        );


        planetData =
            await loadCSV(
                PLANETS_CSV
            );


        console.log(
            "PLANETS loaded:",
            planetData
        );


        console.log(
            "Loading MARKERS sheet..."
        );


        markerData =
            await loadCSV(
                MARKERS_CSV
            );


        console.log(
            "MARKERS loaded:",
            markerData
        );


        initThree();


        buildGalaxy();


        loading.classList.add(
            "hidden"
        );


        console.log(
            "Research universe ready."
        );


    } catch (error) {

        console.error(
            "RESEARCH UNIVERSE ERROR:",
            error
        );


        errorBox.textContent =
            "RESEARCH UNIVERSE ERROR\n\n" +
            error.message;


        errorBox.style.display =
            "block";


        loading.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   START
   ========================================================= */

loadData();

</script>
