<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloe DWG — Research Universe</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020308;
      color: white;
      font-family: Arial, sans-serif;
    }

    #galaxy {
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      position: absolute;
      top: 30px;
      left: 35px;
      z-index: 10;
      pointer-events: none;
    }

    .title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.18em;
    }

    .title p {
      margin: 8px 0 0;
      font-size: 10px;
      letter-spacing: 0.22em;
      opacity: 0.55;
    }

    .instructions {
      position: absolute;
      bottom: 30px;
      left: 35px;
      z-index: 10;
      font-size: 10px;
      letter-spacing: 0.12em;
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="title">
    <h1>CHLOE DWG</h1>
    <p>RESEARCH UNIVERSE</p>
  </div>

  <div class="instructions">
    DRAG TO EXPLORE · SCROLL TO ZOOM · CLICK A WORLD
  </div>

  <div id="galaxy"></div>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { OrbitControls } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


    // -----------------------------------
    // BASIC 3D WORLD
    // -----------------------------------

    const container = document.getElementById("galaxy");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x020308);


    // -----------------------------------
    // CAMERA
    // -----------------------------------

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 18);


    // -----------------------------------
    // RENDERER
    // -----------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    container.appendChild(renderer.domElement);


    // -----------------------------------
    // CAMERA CONTROLS
    // -----------------------------------

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.04;

    controls.minDistance = 5;

    controls.maxDistance = 40;

    controls.enablePan = true;


    // -----------------------------------
    // LIGHTING
    // -----------------------------------

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.7
    );

    scene.add(ambientLight);


    const sun = new THREE.PointLight(
      0xffffff,
      100
    );

    sun.position.set(5, 8, 10);

    scene.add(sun);


    // -----------------------------------
    // CREATE A PLANET
    // -----------------------------------

    function createPlanet(
      x,
      y,
      z,
      size,
      colour,
      name
    ) {

      const geometry =
        new THREE.SphereGeometry(
          size,
          64,
          64
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: colour,
          roughness: 0.8,
          metalness: 0.05
        });

      const planet =
        new THREE.Mesh(
          geometry,
          material
        );

      planet.position.set(
        x,
        y,
        z
      );

      planet.userData.name = name;

      scene.add(planet);

      return planet;
    }


    // -----------------------------------
    // OUR RESEARCH WORLDS
    // -----------------------------------

    const unga = createPlanet(
      0,
      0,
      0,
      3,
      0x315b8c,
      "UNGA 81"
    );


    const cop = createPlanet(
      -7,
      3,
      -4,
      1.7,
      0x527b5c,
      "COP"
    );


    const refugee = createPlanet(
      7,
      -2,
      -5,
      2.0,
      0x79565b,
      "REFUGEE CAMPS"
    );


    const future = createPlanet(
      -4,
      -5,
      -7,
      1.2,
      0x806d42,
      "FUTURE PROJECT"
    );


    // -----------------------------------
    // STARS
    // -----------------------------------

    const starGeometry =
      new THREE.BufferGeometry();

    const starCount = 2500;

    const starPositions =
      new Float32Array(
        starCount * 3
      );

    for (
      let i = 0;
      i < starCount * 3;
      i++
    ) {

      starPositions[i] =
        (Math.random() - 0.5) * 200;

    }

    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );

    const starMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.06
      });

    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );

    scene.add(stars);


    // -----------------------------------
    // PLANET ROTATION
    // -----------------------------------

    function animate() {

      requestAnimationFrame(animate);

      unga.rotation.y += 0.0015;

      cop.rotation.y += 0.002;

      refugee.rotation.y += 0.001;

      future.rotation.y += 0.0025;

      controls.update();

      renderer.render(
        scene,
        camera
      );
    }

    animate();


    // -----------------------------------
    // RESPONSIVE
    // -----------------------------------

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
